<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Earth Station — Premium Live Atmospheric Readout</title>
<meta name="description" content="A cinematic rotating 3D Earth with live weather, air quality, day/night terminator, space weather, flights, and immersive audio. Tap anywhere to read conditions." />
<meta name="theme-color" content="#04060b" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04060b;
    --deep:#0a1120;
    --panel:#0c1424;
    --cyan:#5eead4;
    --cyan-dim:rgba(94,234,212,0.35);
    --amber:#f5a94e;
    --amber-dim:rgba(245,169,78,0.35);
    --violet:#a78bfa;
    --violet-dim:rgba(167,139,250,0.35);
    --rose:#fb7185;
    --rose-dim:rgba(251,113,133,0.35);
    --ink:#e8edf6;
    --mist:#7d8aa3;
    --line:rgba(125,138,163,0.18);
    --line-strong:rgba(125,138,163,0.3);
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --accent:var(--cyan);
    --accent-dim:var(--cyan-dim);
    --glass:rgba(10,17,32,0.72);
    --glass-strong:rgba(9,14,26,0.9);
    --glow:0 0 30px rgba(94,234,212,0.12);
    --shadow-card:0 8px 32px rgba(0,0,0,0.4);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-display);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
  }

  /* ============================================================
     ANIMATED BACKGROUND GRADIENT
     ============================================================ */
  #bg-gradient{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, rgba(30,58,95,0.35), transparent 60%),
      radial-gradient(ellipse 120% 100% at 50% 100%, rgba(8,12,22,0.9), var(--void) 70%);
    pointer-events:none;
    z-index:0;
  }
  #bg-gradient::before{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 80%, rgba(94,234,212,0.06), transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(245,169,78,0.04), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(167,139,250,0.03), transparent 60%);
    animation:bgShift 20s ease-in-out infinite alternate;
  }
  @keyframes bgShift{
    0%{ opacity:0.6; transform:scale(1); }
    100%{ opacity:1; transform:scale(1.05); }
  }

  /* ============================================================
     CANVAS
     ============================================================ */
  #canvas-container{
    position:fixed; inset:0;
    z-index:1;
    cursor:grab;
  }
  #canvas-container.dragging{ cursor:grabbing; }
  #canvas-container canvas{ display:block; touch-action:none; }

  /* ============================================================
     HUD CORNERS — animated
     ============================================================ */
  .hud-corner{
    position:fixed;
    width:30px; height:30px;
    border:1.5px solid var(--accent-dim);
    z-index:5;
    pointer-events:none;
    opacity:0.7;
    transition:all 0.6s cubic-bezier(0.19,1,0.22,1);
  }
  .hud-corner.tl{ top:18px; left:18px; border-right:none; border-bottom:none; border-radius:4px 0 0 0; }
  .hud-corner.tr{ top:18px; right:18px; border-left:none; border-bottom:none; border-radius:0 4px 0 0; }
  .hud-corner.bl{ bottom:18px; left:18px; border-right:none; border-top:none; border-radius:0 0 0 4px; }
  .hud-corner.br{ bottom:18px; right:18px; border-left:none; border-top:none; border-radius:0 0 4px 0; }
  .hud-corner::after{
    content:'';
    position:absolute;
    width:4px; height:4px;
    background:var(--accent);
    border-radius:50%;
    opacity:0;
    transition:opacity 0.3s;
  }
  .hud-corner.tl::after{ top:2px; left:2px; }
  .hud-corner.tr::after{ top:2px; right:2px; }
  .hud-corner.bl::after{ bottom:2px; left:2px; }
  .hud-corner.br::after{ bottom:2px; right:2px; }
  .hud-corner:hover::after{ opacity:1; }

  /* ============================================================
     TOP BAR — premium glass
     ============================================================ */
  .topbar{
    position:fixed; top:0; left:0; right:0;
    z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:22px 36px 0 36px;
    pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }

  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    color:var(--amber);
    font-size:22px;
    line-height:1;
    text-shadow:0 0 20px var(--amber-dim), 0 0 40px rgba(245,169,78,0.1);
    transition:transform 0.6s cubic-bezier(0.19,1,0.22,1);
  }
  .brand:hover .brand-mark{ transform:rotate(90deg) scale(1.1); }
  .brand-text{ display:flex; flex-direction:column; gap:2px; }
  .brand-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    letter-spacing:0.2em;
    color:var(--ink);
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .brand-sub{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--mist);
    text-transform:uppercase;
  }

  .controls{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; }

  /* ============================================================
     SEARCH — premium
     ============================================================ */
  .search-wrap{ position:relative; width:260px; }
  #searchInput{
    width:100%;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 38px 11px 16px;
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:0.02em;
    outline:none;
    backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    transition:border-color 0.3s, box-shadow 0.3s, background 0.3s;
  }
  #searchInput::placeholder{ color:var(--mist); }
  #searchInput:focus{
    border-color:var(--accent-dim);
    box-shadow:0 0 0 3px rgba(94,234,212,0.08), var(--glow);
    background:rgba(10,17,32,0.85);
  }
  .search-hint-key{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-family:var(--font-mono); font-size:9.5px;
    color:var(--mist);
    border:1px solid var(--line);
    padding:1px 6px; border-radius:5px;
    pointer-events:none;
    opacity:0.7;
    transition:opacity 0.2s;
  }
  #searchInput:focus ~ .search-hint-key{ opacity:0; }

  .search-results{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:rgba(10,16,30,0.96);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    max-height:320px; overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(94,234,212,0.05);
    z-index:30;
    animation:dropIn 0.25s cubic-bezier(0.19,1,0.22,1);
  }
  @keyframes dropIn{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:translateY(0); } }
  .search-results.hidden{ display:none; }
  .search-result-item{
    padding:11px 16px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:8px;
    transition:background 0.2s, padding-left 0.2s;
  }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover, .search-result-item.highlighted{
    background:rgba(94,234,212,0.08);
    padding-left:20px;
  }
  .search-result-item .sr-country{
    color:var(--mist);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%; text-align:right;
  }
  .search-result-empty{
    padding:14px 16px; font-family:var(--font-mono); font-size:12px; color:var(--mist);
  }
  .search-section-label{
    padding:10px 16px 4px 16px;
    font-family:var(--font-mono); font-size:9px;
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--mist); opacity:0.6;
  }
  .recent-chip-row{
    display:flex; flex-wrap:wrap; gap:6px;
    padding:6px 16px 14px 16px;
  }
  .recent-chip{
    font-family:var(--font-mono); font-size:10px;
    padding:5px 11px; border-radius:20px;
    border:1px solid var(--line);
    color:var(--mist);
    background:rgba(255,255,255,0.02);
    cursor:pointer;
    transition:border-color 0.2s, color 0.2s, background 0.2s, transform 0.15s;
  }
  .recent-chip:hover{
    color:var(--ink); border-color:var(--accent-dim);
    background:rgba(94,234,212,0.06);
    transform:translateY(-1px);
  }

  /* ============================================================
     ICON BUTTONS — premium
     ============================================================ */
  .icon-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:11px;
    color:var(--accent);
    font-size:15px;
    cursor:pointer;
    backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    transition:border-color 0.25s, color 0.25s, transform 0.15s, background 0.25s, box-shadow 0.25s;
    position:relative;
    overflow:hidden;
  }
  .icon-btn::after{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at center, var(--accent-dim), transparent 70%);
    opacity:0; transition:opacity 0.3s;
  }
  .icon-btn:hover{
    border-color:var(--accent-dim);
    background:rgba(10,17,32,0.9);
    box-shadow:var(--glow);
  }
  .icon-btn:hover::after{ opacity:0.3; }
  .icon-btn:active{ transform:scale(0.93); }
  .icon-btn.active{
    color:var(--accent);
    border-color:var(--accent-dim);
    background:rgba(94,234,212,0.08);
    box-shadow:var(--glow);
  }
  .icon-btn.paused{ color:var(--mist); }
  .icon-btn.paused:hover{ color:var(--ink); }

  /* ============================================================
     THEME PICKER
     ============================================================ */
  .theme-picker{
    display:flex; gap:6px; align-items:center; padding:0 4px; height:38px;
  }
  .theme-dot{
    width:15px; height:15px; border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    transition:transform 0.2s cubic-bezier(0.19,1,0.22,1), border-color 0.2s, box-shadow 0.2s;
    position:relative;
  }
  .theme-dot:hover{ transform:scale(1.25); box-shadow:0 0 12px currentColor; }
  .theme-dot.active{ border-color:var(--ink); box-shadow:0 0 10px currentColor; }

  /* ============================================================
     HINT
     ============================================================ */
  .hint{
    position:fixed; bottom:40px; left:50%;
    transform:translateX(-50%);
    z-index:6;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--mist);
    text-transform:uppercase;
    display:flex; align-items:center; gap:12px;
    transition:opacity 0.8s cubic-bezier(0.19,1,0.22,1);
    pointer-events:none;
    text-align:center;
    white-space:nowrap;
  }
  .hint::before, .hint::after{
    content:'';
    width:28px; height:1px;
    background:linear-gradient(90deg, transparent, var(--line));
  }
  .hint::after{ background:linear-gradient(90deg, var(--line), transparent); }
  .hint.faded{ opacity:0; }

  /* ============================================================
     COORDINATE READOUT
     ============================================================ */
  .coord-readout{
    position:fixed; left:36px; bottom:36px;
    z-index:6;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--mist);
    line-height:1.8;
    pointer-events:none;
    opacity:0.75;
    transition:opacity 0.3s;
  }
  .coord-readout .cr-label{ color:var(--accent); opacity:0.9; }

  /* ============================================================
     TOAST — premium
     ============================================================ */
  #toastHost{
    position:fixed; bottom:32px; right:32px;
    z-index:100;
    display:flex; flex-direction:column; gap:10px;
    align-items:flex-end;
    pointer-events:none;
  }
  .toast{
    font-family:var(--font-mono); font-size:11.5px;
    letter-spacing:0.03em;
    padding:12px 20px;
    border-radius:12px;
    background:rgba(10,16,30,0.94);
    border:1px solid var(--line-strong);
    color:var(--ink);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    box-shadow:0 16px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(94,234,212,0.05);
    animation:toastIn 0.4s cubic-bezier(0.19,1,0.22,1);
    max-width:360px;
    display:flex; align-items:center; gap:10px;
  }
  .toast::before{
    content:'◆';
    font-size:8px;
    opacity:0.6;
    flex-shrink:0;
  }
  .toast.ok{ border-color:rgba(94,234,212,0.35); }
  .toast.ok::before{ color:var(--cyan); }
  .toast.warn{ border-color:rgba(245,169,78,0.4); }
  .toast.warn::before{ color:var(--amber); }
  .toast.err{ border-color:rgba(248,113,113,0.4); }
  .toast.err::before{ color:var(--rose); }
  .toast.fade{ animation:toastOut 0.4s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(40px) scale(0.95); } to{ opacity:1; transform:translateX(0) scale(1); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(40px) scale(0.95); } }

  /* ============================================================
     LOADING SCREEN — cinematic
     ============================================================ */
  .loading{
    position:fixed; inset:0; z-index:50;
    background:var(--void);
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.8s cubic-bezier(0.19,1,0.22,1), visibility 0.8s;
  }
  .loading.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loading-inner{ display:flex; flex-direction:column; align-items:center; gap:24px; width:240px; }
  .loading-brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    letter-spacing:0.4em;
    color:var(--ink);
    opacity:0.9;
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .spinner{
    width:38px; height:38px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--mist);
    text-transform:uppercase;
    text-align:center;
  }
  .loading-bar{
    width:100%; height:2px;
    background:rgba(255,255,255,0.06);
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .loading-bar::after{
    content:'';
    position:absolute; top:0; left:0; height:100%;
    width:40%;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation:loadingSlide 1.6s ease-in-out infinite;
  }
  @keyframes loadingSlide{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(350%); }
  }

  /* ============================================================
     SIDE PANEL — premium glass
     ============================================================ */
  .panel{
    position:fixed;
    top:0; right:0;
    width:430px; height:100%;
    z-index:20;
    background:rgba(9,14,26,0.85);
    border-left:1px solid var(--line);
    backdrop-filter:blur(28px) saturate(1.3);
    -webkit-backdrop-filter:blur(28px) saturate(1.3);
    transform:translateX(100%);
    transition:transform 0.5s cubic-bezier(0.19,1,0.22,1);
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
    box-shadow:-20px 0 60px rgba(0,0,0,0.4);
  }
  .panel::-webkit-scrollbar{ width:6px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .panel.visible{ transform:translateX(0); }

  .panel-close{
    position:absolute; top:20px; right:20px;
    width:32px; height:32px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--glass);
    color:var(--mist);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    z-index:2;
    transition:color 0.2s, border-color 0.2s, transform 0.15s, background 0.2s;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    display:flex; align-items:center; justify-content:center;
  }
  .panel-close:hover{
    color:var(--ink);
    border-color:var(--accent-dim);
    background:rgba(94,234,212,0.06);
    transform:scale(1.05);
  }

  .panel-content{ padding:80px 28px 48px 28px; }

  /* ============================================================
     PANEL TYPOGRAPHY
     ============================================================ */
  .p-eyebrow{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.22em;
    color:var(--accent);
    text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
    margin-bottom:12px;
  }
  .p-eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent), 0 0 20px var(--accent-dim);
    animation:pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(0.8); } }

  .p-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:24px;
    line-height:1.2;
    margin:0 0 8px 0;
    padding-right:36px;
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .p-coords{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--mist);
    letter-spacing:0.04em;
  }

  .p-divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
    margin:24px 0;
  }

  .p-temp-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .p-temp{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:56px;
    line-height:1;
    letter-spacing:-0.02em;
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .p-temp-unit{
    font-size:24px;
    color:var(--mist);
    cursor:pointer;
    user-select:none;
    border-bottom:1px dashed var(--mist);
    padding-bottom:2px;
    transition:color 0.2s, border-color 0.2s;
  }
  .p-temp-unit:hover{ color:var(--ink); border-color:var(--accent); }
  .p-cond{ text-align:right; }
  .p-cond-icon{ font-size:34px; line-height:1; }
  .p-cond-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--mist);
    margin-top:6px;
    max-width:130px;
  }
  .p-feels{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--mist);
    margin-top:12px;
    letter-spacing:0.02em;
  }

  /* ============================================================
     STAT GRID
     ============================================================ */
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:24px;
  }
  .stat-card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    background:rgba(255,255,255,0.015);
    transition:border-color 0.25s, background 0.25s, transform 0.2s, box-shadow 0.25s;
  }
  .stat-card:hover{
    border-color:var(--accent-dim);
    background:rgba(94,234,212,0.04);
    transform:translateY(-2px);
    box-shadow:var(--shadow-card);
  }
  .stat-label{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.16em;
    color:var(--mist);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .stat-value{
    font-family:var(--font-mono);
    font-size:20px;
    font-weight:700;
  }

  /* ============================================================
     AQI BLOCK
     ============================================================ */
  .aqi-block{ margin-top:24px; }
  .aqi-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px;
    gap:12px;
  }
  .aqi-label{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.16em;
    color:var(--mist);
    text-transform:uppercase;
  }
  .aqi-value-wrap{ display:flex; align-items:baseline; gap:8px; }
  .aqi-value{ font-family:var(--font-mono); font-size:20px; font-weight:700; }
  .aqi-tag{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.05em;
    padding:3px 10px;
    border-radius:20px;
    text-transform:uppercase;
  }
  .aqi-bar-track{
    height:6px; border-radius:4px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .aqi-bar-fill{
    height:100%; border-radius:4px;
    transition:width 0.8s cubic-bezier(0.19,1,0.22,1);
  }

  /* ============================================================
     SECTION TITLES
     ============================================================ */
  .section-title{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.18em;
    color:var(--amber);
    text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
    margin:26px 0 14px 0;
  }
  .section-title .stitch{
    flex:1; height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }

  /* ============================================================
     INFO LOADING
     ============================================================ */
  .info-loading{
    display:flex; align-items:center; gap:12px;
    padding:20px 2px;
  }
  .spinner.small{ width:18px; height:18px; border-width:1.5px; }

  /* ============================================================
     CITY HERO
     ============================================================ */
  .city-hero{
    position:relative;
    width:100%; height:160px;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(140deg, rgba(94,234,212,0.08), rgba(245,169,78,0.05));
    transition:border-color 0.3s, box-shadow 0.3s;
  }
  .city-hero:hover{
    border-color:var(--accent-dim);
    box-shadow:var(--shadow-card);
  }
  .city-hero img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(1.05) contrast(1.02);
    transition:transform 0.8s cubic-bezier(0.19,1,0.22,1);
  }
  .city-hero:hover img{ transform:scale(1.06); }
  .city-hero-fallback{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size:38px; opacity:0.5;
  }
  .city-hero-caption{
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 14px;
    background:linear-gradient(to top, rgba(4,6,11,0.9), transparent);
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.08em;
    color:var(--mist);
  }

  .city-extract{
    font-family:var(--font-display);
    font-size:13px;
    line-height:1.7;
    color:var(--ink);
    opacity:0.92;
    margin-top:4px;
  }

  .pop-card{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    background:rgba(255,255,255,0.015);
    transition:border-color 0.25s, background 0.25s;
  }
  .pop-card:hover{
    border-color:var(--accent-dim);
    background:rgba(94,234,212,0.04);
  }
  .pop-label{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.16em;
    color:var(--mist);
    text-transform:uppercase;
  }
  .pop-value{
    font-family:var(--font-mono);
    font-size:24px;
    font-weight:700;
    color:var(--accent);
    margin-top:4px;
  }
  .pop-icon{ font-size:28px; opacity:0.6; }

  /* ============================================================
     POI / TRANSPORT LISTS
     ============================================================ */
  .poi-list, .transport-list{ display:flex; flex-direction:column; gap:8px; }

  .poi-item{
    display:flex; align-items:center; gap:14px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    background:rgba(255,255,255,0.015);
    text-decoration:none;
    transition:border-color 0.25s, background 0.25s, transform 0.2s, box-shadow 0.25s;
  }
  .poi-item:hover{
    border-color:var(--accent-dim);
    background:rgba(94,234,212,0.05);
    transform:translateX(3px);
    box-shadow:var(--shadow-card);
  }
  .poi-thumb-fallback{
    width:44px; height:44px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.04);
    font-size:18px;
  }
  .poi-info{ flex:1; min-width:0; }
  .poi-name{
    font-family:var(--font-display);
    font-size:13px; font-weight:500;
    color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .poi-dist{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--mist);
    margin-top:3px;
  }

  .transport-item{
    display:flex; align-items:center; gap:14px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    background:rgba(255,255,255,0.015);
    transition:border-color 0.25s, background 0.25s;
  }
  .transport-item:hover{
    border-color:var(--amber-dim);
    background:rgba(245,169,78,0.04);
  }
  .transport-icon{
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(245,169,78,0.1);
    font-size:17px;
  }
  .transport-info{ flex:1; min-width:0; }
  .transport-type{
    font-family:var(--font-mono);
    font-size:9px; letter-spacing:0.12em;
    color:var(--amber); text-transform:uppercase;
  }
  .transport-name{
    font-family:var(--font-display);
    font-size:13px; font-weight:500; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:3px;
  }
  .transport-dist{
    font-family:var(--font-mono);
    font-size:11px; color:var(--mist);
    flex-shrink:0;
  }

  .info-empty{
    font-family:var(--font-mono);
    font-size:11px; color:var(--mist);
    padding:8px 2px;
    line-height:1.7;
  }

  .wiki-link{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:16px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px dashed var(--accent-dim);
    padding-bottom:3px;
    transition:border-color 0.2s, color 0.2s;
  }
  .wiki-link:hover{ border-color:var(--accent); color:var(--ink); }

  /* ============================================================
     TABS
     ============================================================ */
  .panel-tabs{
    display:flex; gap:2px;
    overflow-x:auto;
    margin:22px 0 4px 0;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
    position:relative;
  }
  .panel-tabs::-webkit-scrollbar{ display:none; }
  .panel-tab-btn{
    flex:0 0 auto;
    padding:10px 13px 11px 13px;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--mist);
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    cursor:pointer;
    white-space:nowrap;
    transition:color 0.2s, border-color 0.2s, background 0.2s;
    position:relative;
  }
  .panel-tab-btn:hover{ color:var(--ink); background:rgba(255,255,255,0.02); }
  .panel-tab-btn.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .panel-tab-btn.active::after{
    content:'';
    position:absolute;
    bottom:-1px; left:0; right:0;
    height:1px;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }

  .tab-panel{ display:none; padding-top:18px; }
  .tab-panel.active{ display:block; animation:tabIn 0.35s cubic-bezier(0.19,1,0.22,1); }
  @keyframes tabIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:none; }
  }

  /* ============================================================
     HOURLY STRIP
     ============================================================ */
  .hourly-scroll{
    display:flex; gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:4px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .hourly-scroll::-webkit-scrollbar{ height:5px; }
  .hourly-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .hourly-item{
    flex:0 0 auto; width:60px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 4px;
    background:rgba(255,255,255,0.015);
    transition:border-color 0.25s, background 0.25s, transform 0.2s;
  }
  .hourly-item:hover{
    border-color:var(--accent-dim);
    transform:translateY(-2px);
  }
  .hourly-item.is-now{
    border-color:var(--accent-dim);
    background:rgba(94,234,212,0.06);
    box-shadow:0 0 20px rgba(94,234,212,0.08);
  }
  .hourly-time{ font-family:var(--font-mono); font-size:9px; color:var(--mist); }
  .hourly-icon{ font-size:18px; }
  .hourly-temp{ font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--ink); }
  .hourly-rain{ font-family:var(--font-mono); font-size:8.5px; color:var(--accent); }

  /* ============================================================
     DAILY LIST
     ============================================================ */
  .daily-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
    transition:background 0.2s;
  }
  .daily-row:hover{ background:rgba(255,255,255,0.015); }
  .daily-row:last-child{ border-bottom:none; }
  .daily-day{ width:68px; flex-shrink:0; font-family:var(--font-mono); font-size:11px; color:var(--mist); }
  .daily-icon{ font-size:16px; width:24px; text-align:center; flex-shrink:0; }
  .daily-rain{ width:40px; flex-shrink:0; font-family:var(--font-mono); font-size:10px; color:var(--accent); text-align:right; }
  .daily-temps{ flex:1; display:flex; align-items:center; gap:8px; min-width:0; }
  .daily-min{ font-family:var(--font-mono); font-size:11px; color:var(--mist); width:28px; text-align:right; }
  .daily-bar-track{ flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.06); position:relative; }
  .daily-bar-fill{
    position:absolute; top:0; height:100%; border-radius:2px;
    background:linear-gradient(90deg, var(--cyan), var(--amber));
    transition:width 0.6s cubic-bezier(0.19,1,0.22,1);
  }
  .daily-max{ font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ink); width:28px; }

  /* ============================================================
     SUN & MOON CARDS
     ============================================================ */
  .sunmoon-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sunmoon-card{
    border:1px solid var(--line); border-radius:12px;
    padding:16px; text-align:center;
    background:rgba(255,255,255,0.015);
    transition:border-color 0.25s, background 0.25s, transform 0.2s;
  }
  .sunmoon-card:hover{
    border-color:var(--amber-dim);
    background:rgba(245,169,78,0.04);
    transform:translateY(-2px);
  }
  .sunmoon-icon{ font-size:24px; }
  .sunmoon-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; color:var(--mist); text-transform:uppercase; margin-top:8px; }
  .sunmoon-value{ font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--ink); margin-top:3px; }

  /* ============================================================
     SPARKLINE CHART
     ============================================================ */
  .chart-wrap{
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 14px 8px 14px;
    background:rgba(255,255,255,0.015);
    margin-top:4px;
    overflow:hidden;
    transition:border-color 0.25s;
  }
  .chart-wrap:hover{ border-color:var(--accent-dim); }
  .chart-title{
    font-family:var(--font-mono); font-size:9.5px;
    letter-spacing:0.14em; color:var(--mist);
    text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:8px;
  }
  .chart-title strong{ color:var(--accent); font-weight:700; }
  .chart-svg{ display:block; width:100%; height:80px; }
  .chart-legend{
    display:flex; justify-content:space-between;
    font-family:var(--font-mono); font-size:9px; color:var(--mist);
    margin-top:4px;
  }

  /* ============================================================
     SUN ARC
     ============================================================ */
  .sun-arc-wrap{
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    background:linear-gradient(180deg, rgba(245,169,78,0.05), rgba(94,234,212,0.03));
    transition:border-color 0.25s;
  }
  .sun-arc-wrap:hover{ border-color:var(--amber-dim); }
  .sun-arc-svg{ display:block; width:100%; height:80px; }
  .sun-arc-times{
    display:flex; justify-content:space-between;
    font-family:var(--font-mono); font-size:10px; color:var(--mist);
    margin-top:6px;
  }
  .sun-arc-times strong{ color:var(--ink); font-weight:700; }

  /* ============================================================
     WIND COMPASS
     ============================================================ */
  .compass-wrap{
    display:flex; align-items:center; gap:16px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    background:rgba(255,255,255,0.015);
    margin-top:4px;
    transition:border-color 0.25s;
  }
  .compass-wrap:hover{ border-color:var(--amber-dim); }
  .compass-svg{ width:78px; height:78px; flex-shrink:0; }
  .compass-info{ flex:1; }
  .compass-value{ font-family:var(--font-mono); font-size:20px; font-weight:700; color:var(--ink); }
  .compass-label{ font-family:var(--font-mono); font-size:10px; color:var(--mist); letter-spacing:0.1em; text-transform:uppercase; margin-top:5px; }
  .compass-gust{ font-family:var(--font-mono); font-size:10.5px; color:var(--mist); margin-top:6px; }

  /* ============================================================
     SPACE WEATHER
     ============================================================ */
  .sw-row{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
    margin-top:8px;
  }
  .sw-card{
    border:1px solid var(--line); border-radius:12px;
    padding:12px 10px 14px 10px;
    background:rgba(255,255,255,0.015);
    text-align:center;
    transition:border-color 0.25s, background 0.25s;
  }
  .sw-card:hover{ border-color:var(--accent-dim); background:rgba(94,234,212,0.04); }
  .sw-label{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.12em; color:var(--mist); text-transform:uppercase; }
  .sw-value{ font-family:var(--font-mono); font-size:17px; font-weight:700; margin-top:5px; }
  .kp-dot{
    display:inline-block;
    width:8px; height:8px; border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
    box-shadow:0 0 10px currentColor;
  }

  /* ============================================================
     ISS ROW
     ============================================================ */
  .iss-row{
    display:flex; align-items:center; gap:14px;
    border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-top:8px;
    background:rgba(94,234,212,0.04);
    transition:border-color 0.25s, background 0.25s;
  }
  .iss-row:hover{ border-color:var(--accent-dim); background:rgba(94,234,212,0.06); }
  .iss-icon{ font-size:24px; }
  .iss-info{ flex:1; min-width:0; }
  .iss-title{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.12em; color:var(--accent); text-transform:uppercase; }
  .iss-value{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink); margin-top:4px; }
  .iss-stats{ font-family:var(--font-mono); font-size:10px; color:var(--mist); margin-top:5px; }

  /* ============================================================
     CHIPS
     ============================================================ */
  .chip-scroll{ display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; margin-bottom:4px; scrollbar-width:none; }
  .chip-scroll::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.05em;
    padding:7px 13px; border-radius:20px;
    border:1px solid var(--line);
    color:var(--mist);
    background:rgba(255,255,255,0.02);
    cursor:pointer;
    transition:color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .chip:hover{ color:var(--ink); border-color:var(--accent-dim); background:rgba(94,234,212,0.06); transform:translateY(-1px); }
  .chip.has-results{ color:var(--ink); border-color:var(--accent-dim); }

  .category-block{ margin-bottom:20px; }
  .category-heading{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--amber); margin-bottom:10px;
  }

  /* ============================================================
     DATA ROWS
     ============================================================ */
  .data-list{ display:flex; flex-direction:column; }
  .data-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    transition:background 0.2s;
  }
  .data-row:hover{ background:rgba(255,255,255,0.01); }
  .data-row:last-child{ border-bottom:none; }
  .data-row-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--mist); letter-spacing:0.04em; }
  .data-row-value{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink); font-weight:700; text-align:right; }

  .note-card{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-family:var(--font-mono);
    font-size:10.5px;
    line-height:1.7;
    color:var(--mist);
    margin-top:8px;
  }

  .tip-card{
    display:flex; gap:12px; align-items:flex-start;
    border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:8px;
    background:rgba(245,169,78,0.04);
    transition:border-color 0.25s, background 0.25s;
  }
  .tip-card:hover{ border-color:var(--amber-dim); background:rgba(245,169,78,0.06); }
  .tip-icon{ font-size:18px; flex-shrink:0; }
  .tip-text{ font-family:var(--font-display); font-size:12.5px; line-height:1.6; color:var(--ink); }

  /* ============================================================
     FAVORITES
     ============================================================ */
  .fav-btn{
    position:absolute; top:20px; left:20px;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(10,14,22,0.6);
    color:var(--mist);
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:color 0.2s, border-color 0.2s, transform 0.2s, background 0.2s;
    z-index:3;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  .fav-btn:hover{ transform:scale(1.1); color:var(--amber); border-color:var(--amber-dim); }
  .fav-btn.active{ color:var(--amber); border-color:var(--amber); background:rgba(245,169,78,0.1); }

  /* ============================================================
     QUAKE / HOLIDAY
     ============================================================ */
  .quake-item, .holiday-item, .currency-item{
    border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; margin-bottom:8px;
    background:rgba(255,255,255,0.015);
    transition:border-color 0.25s, background 0.25s;
  }
  .quake-item:hover, .holiday-item:hover{ border-color:var(--amber-dim); background:rgba(245,169,78,0.04); }
  .quake-mag{ font-family:var(--font-mono); font-size:16px; font-weight:700; color:var(--amber); }
  .quake-place{ font-family:var(--font-display); font-size:12.5px; color:var(--ink); margin-top:4px; }
  .quake-time{ font-family:var(--font-mono); font-size:10px; color:var(--mist); margin-top:4px; }

  /* ============================================================
     ERROR / LOADING
     ============================================================ */
  .p-loading, .p-error{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:60px 10px;
    text-align:center;
  }
  .p-error-text{
    font-family:var(--font-mono); font-size:12px; color:var(--mist); line-height:1.7;
  }

  /* ============================================================
     SOUNDSCAPE TOGGLE
     ============================================================ */
  .sound-toggle{
    position:fixed; bottom:36px; right:36px;
    z-index:7;
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--glass);
    color:var(--mist);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
    transition:color 0.25s, border-color 0.25s, transform 0.2s, box-shadow 0.25s, background 0.25s;
    box-shadow:var(--shadow-card);
  }
  .sound-toggle:hover{
    color:var(--accent);
    border-color:var(--accent-dim);
    transform:scale(1.08);
    box-shadow:var(--glow), var(--shadow-card);
  }
  .sound-toggle.active{
    color:var(--accent);
    border-color:var(--accent);
    background:rgba(94,234,212,0.08);
    box-shadow:var(--glow);
  }
  .sound-toggle .pulse-ring{
    position:absolute; inset:-4px;
    border-radius:50%;
    border:1px solid var(--accent-dim);
    opacity:0;
    transition:opacity 0.3s;
  }
  .sound-toggle.active .pulse-ring{
    opacity:1;
    animation:pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ transform:scale(1); opacity:0.6; }
    100%{ transform:scale(1.4); opacity:0; }
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width:720px){
    .topbar{ flex-direction:column; padding:16px 16px 0 16px; gap:12px; }
    .controls{ width:100%; flex-wrap:wrap; }
    .search-wrap{ flex:1; width:auto; min-width:180px; }
    .brand{ align-self:flex-start; }
    .hud-corner{ display:none; }
    .panel{
      top:auto; bottom:0; left:0; right:0;
      width:100%; height:auto; max-height:80vh;
      border-left:none; border-top:1px solid var(--line);
      border-radius:22px 22px 0 0;
      transform:translateY(100%);
    }
    .panel.visible{ transform:translateY(0); }
    .panel-content{ padding:60px 20px 48px 20px; }
    .hint{ bottom:24px; font-size:10px; text-align:center; padding:0 20px; white-space:normal; }
    .coord-readout{ display:none; }
    .theme-picker{ height:auto; }
    #toastHost{ left:16px; right:16px; bottom:16px; align-items:stretch; }
    .toast{ max-width:none; }
    .sound-toggle{ bottom:20px; right:20px; width:40px; height:40px; font-size:16px; }
    .stat-grid{ grid-template-columns:1fr 1fr; }
    .sw-row{ grid-template-columns:1fr 1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    .spinner{ animation:none; }
    .p-eyebrow .dot{ animation:none; }
    .loading-bar::after{ animation:none; }
    .sound-toggle.active .pulse-ring{ animation:none; }
    #bg-gradient::before{ animation:none; }
    *{ transition-duration:0.01ms !important; }
  }
</style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
/* ==========================================================================
   EARTH STATION 2.0 — PREMIUM EDITION
   Cinematic globe w/ day-night terminator, live weather, space weather,
   ISS, flights, clouds, soundscapes, and a feature-rich side panel.
   ========================================================================== */
(function () {
  'use strict';

  /* --------------------------------------------------------------
     Configuration
     -------------------------------------------------------------- */
  var EARTH_RADIUS = 5;
  var ROTATE_SPEED = 0.0011;
  var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // High-quality textures
  var TEXTURES = {
    day:     'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
    night:   'https://unpkg.com/three-globe/example/img/earth-night.jpg',
    topology:'https://unpkg.com/three-globe/example/img/earth-topology.png',
    water:   'https://unpkg.com/three-globe/example/img/earth-water.png',
    clouds:  'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'
  };

  // RainViewer tile template for live precipitation (free, no key)
  var RAINVIEWER_TILE = 'https://tilecache.rainviewer.com/v2/radar/{ts}/256/{z}/{x}/{y}/2/1_1.png';

  var WEATHER_CODES = {
    0: ['Clear sky', '☀️'], 1: ['Mainly clear', '🌤️'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
    45: ['Fog', '🌫️'], 48: ['Rime fog', '🌫️'],
    51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Dense drizzle', '🌧️'],
    56: ['Freezing drizzle', '🌧️'], 57: ['Dense freezing drizzle', '🌧️'],
    61: ['Slight rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
    66: ['Freezing rain', '🌧️'], 67: ['Heavy freezing rain', '🌨️'],
    71: ['Slight snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '❄️'],
    80: ['Rain showers', '🌦️'], 81: ['Rain showers', '🌧️'], 82: ['Violent showers', '⛈️'],
    85: ['Snow showers', '🌨️'], 86: ['Heavy snow showers', '❄️'],
    95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm, hail', '⛈️'], 99: ['Severe thunderstorm', '⛈️']
  };

  var MOON_NAMES = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  var MOON_ICONS = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];

  var THEMES = {
    cyan:   { accent: '#5eead4', dim: 'rgba(94,234,212,0.35)',  rgb: '94,234,212' },
    amber:  { accent: '#f5a94e', dim: 'rgba(245,169,78,0.35)',  rgb: '245,169,78' },
    violet: { accent: '#a78bfa', dim: 'rgba(167,139,250,0.35)', rgb: '167,139,250' },
    rose:   { accent: '#fb7185', dim: 'rgba(251,113,133,0.35)', rgb: '251,113,133' }
  };

  /* --------------------------------------------------------------
     Scene setup
     -------------------------------------------------------------- */
  var container = document.getElementById('canvas-container');
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 13.5);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  var baseDPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(baseDPR);
  container.appendChild(renderer.domElement);

  var ambient = new THREE.AmbientLight(0x3a4a6b, 1.2);
  scene.add(ambient);

  /* --------------------------------------------------------------
     Loading manager
     -------------------------------------------------------------- */
  var loadManager = new THREE.LoadingManager();
  var loadingTextEl = document.getElementById('loadingText');
  loadManager.onProgress = function (url) {
    if (loadingTextEl) {
      var name = url.split('/').pop().split('?')[0];
      loadingTextEl.textContent = 'Loading ' + name.slice(0, 28) + '…';
    }
  };
  loadManager.onLoad = function () {
    var el = document.getElementById('loading');
    el.classList.add('hidden');
    setTimeout(function () { el.style.display = 'none'; }, 900);
  };
  var textureLoader = new THREE.TextureLoader(loadManager);
  textureLoader.crossOrigin = 'anonymous';

  /* --------------------------------------------------------------
     Subsolar point (day/night terminator)
     -------------------------------------------------------------- */
  function getSubsolarPoint(date) {
    var dayMs = 86400000;
    var start = Date.UTC(date.getUTCFullYear(), 0, 0);
    var dayOfYear = Math.floor((date.getTime() - start) / dayMs);
    var hours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;

    var decl = -23.44 * Math.cos((2 * Math.PI / 365) * (dayOfYear + 10));
    var B = (2 * Math.PI / 365) * (dayOfYear - 81);
    var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    var lon = -15 * (hours - 12 + eot / 60);
    while (lon < -180) lon += 360;
    while (lon > 180) lon -= 360;
    return { lat: decl, lon: lon };
  }

  function latLonToVector3(lat, lon, radius) {
    var phi = (90 - lat) * (Math.PI / 180);
    var theta = (lon + 180) * (Math.PI / 180);
    var x = -(radius * Math.sin(phi) * Math.cos(theta));
    var z = radius * Math.sin(phi) * Math.sin(theta);
    var y = radius * Math.cos(phi);
    return new THREE.Vector3(x, y, z);
  }

  function vector3ToLatLon(v, radius) {
    var phi = Math.acos(Math.max(-1, Math.min(1, v.y / radius)));
    var theta = Math.atan2(v.z, -v.x);
    var lat = 90 - (phi * 180 / Math.PI);
    var lon = (theta * 180 / Math.PI) - 180;
    if (lon < -180) lon += 360;
    if (lon > 180) lon -= 360;
    return { lat: lat, lon: lon };
  }

  function shortestAngleDiff(a, b) {
    var diff = (b - a) % (Math.PI * 2);
    if (diff > Math.PI) diff -= Math.PI * 2;
    if (diff < -Math.PI) diff += Math.PI * 2;
    return diff;
  }
  function frontRotationFor(localPoint) { return Math.atan2(-localPoint.x, localPoint.z); }

  var sunDirection = new THREE.Vector3(1, 0, 0);
  (function initSunDir() {
    var sub = getSubsolarPoint(new Date());
    sunDirection.copy(latLonToVector3(sub.lat, sub.lon, 1)).normalize();
  })();

  /* --------------------------------------------------------------
     Fallback textures
     -------------------------------------------------------------- */
  function solidCanvasTexture(r, g, b, a) {
    var canvas = document.createElement('canvas');
    canvas.width = 4; canvas.height = 4;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (a === undefined ? 1 : a) + ')';
    ctx.fillRect(0, 0, 4, 4);
    return new THREE.CanvasTexture(canvas);
  }

  /* --------------------------------------------------------------
     Earth — custom shader with day/night blend
     -------------------------------------------------------------- */
  var earthUniforms = {
    dayTexture:   { value: solidCanvasTexture(10, 30, 60) },
    nightTexture: { value: solidCanvasTexture(2, 4, 10) },
    sunDirection: { value: sunDirection },
    nightBoost:   { value: 1.0 },
    dayBoost:     { value: 1.05 }
  };

  var earthVertexShader = [
    'varying vec2 vUv;',
    'varying vec3 vWorldNormal;',
    'void main() {',
    '  vUv = uv;',
    '  vWorldNormal = normalize(mat3(modelMatrix) * normal);',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}'
  ].join('\n');

  var earthFragmentShader = [
    'uniform sampler2D dayTexture;',
    'uniform sampler2D nightTexture;',
    'uniform vec3 sunDirection;',
    'uniform float nightBoost;',
    'uniform float dayBoost;',
    'varying vec2 vUv;',
    'varying vec3 vWorldNormal;',
    'void main() {',
    '  vec3 dayCol = texture2D(dayTexture, vUv).rgb;',
    '  vec3 nightCol = texture2D(nightTexture, vUv).rgb;',
    '  float cosA = dot(normalize(vWorldNormal), normalize(sunDirection));',
    '  float dayMix = smoothstep(-0.16, 0.22, cosA);',
    '  vec3 dayLit = dayCol * dayBoost * (0.5 + 0.55 * smoothstep(0.0, 0.65, cosA));',
    '  vec3 nightLit = nightCol * nightBoost;',
    '  float twilight = exp(-pow((cosA - 0.0) * 5.0, 2.0));',
    '  vec3 twilightTint = vec3(0.14, 0.08, 0.16);',
    '  vec3 col = mix(nightLit, dayLit, dayMix) + twilight * twilightTint;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  var earthMaterial = new THREE.ShaderMaterial({
    uniforms: earthUniforms,
    vertexShader: earthVertexShader,
    fragmentShader: earthFragmentShader
  });

  textureLoader.load(TEXTURES.day, function (tex) {
    earthUniforms.dayTexture.value = tex;
  }, undefined, function () {});
  textureLoader.load(TEXTURES.night, function (tex) {
    tex.minFilter = THREE.LinearFilter;
    earthUniforms.nightTexture.value = tex;
  }, undefined, function () {});

  var earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 128, 128);
  var earth = new THREE.Mesh(earthGeometry, earthMaterial);
  scene.add(earth);

  /* --------------------------------------------------------------
     Clouds — dynamic with real-time wind modulation
     -------------------------------------------------------------- */
  var cloudMaterial = new THREE.MeshPhongMaterial({
    transparent: true,
    opacity: 0.3,
    depthWrite: false
  });
  textureLoader.load(TEXTURES.clouds, function (tex) {
    cloudMaterial.map = tex;
    cloudMaterial.needsUpdate = true;
  }, undefined, function () {});
  var clouds = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.012, 96, 96), cloudMaterial);
  scene.add(clouds);

  /* --------------------------------------------------------------
     RainViewer precipitation overlay (live radar)
     -------------------------------------------------------------- */
  var precipGroup = new THREE.Group();
  precipGroup.visible = false;
  earth.add(precipGroup);
  var precipMesh = null;
  var rainviewerTimestamp = null;

  function refreshRainViewer() {
    // RainViewer free API: get latest timestamp
    fetch('https://api.rainviewer.com/public/weather-maps.json')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.radar && d.radar.past && d.radar.past.length) {
          rainviewerTimestamp = d.radar.past[d.radar.past.length - 1].time;
        }
      })
      .catch(function () {});
  }
  refreshRainViewer();
  setInterval(refreshRainViewer, 120000);

  /* --------------------------------------------------------------
     Atmosphere glow
     -------------------------------------------------------------- */
  var atmosphereMaterial = new THREE.ShaderMaterial({
    vertexShader: [
      'varying vec3 vNormal;',
      'void main() {',
      '  vNormal = normalize(normalMatrix * normal);',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vNormal;',
      'void main() {',
      '  float intensity = pow(0.62 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.2);',
      '  gl_FragColor = vec4(0.36, 0.72, 0.95, 1.0) * intensity;',
      '}'
    ].join('\n'),
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false
  });
  var atmosphere = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.16, 64, 64), atmosphereMaterial);
  scene.add(atmosphere);

  /* --------------------------------------------------------------
     Grid
     -------------------------------------------------------------- */
  var gridGroup = new THREE.Group();
  gridGroup.visible = false;
  earth.add(gridGroup);

  (function buildGrid() {
    var lineMat = new THREE.LineBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.18 });
    var eqMat = new THREE.LineBasicMaterial({ color: 0xf5a94e, transparent: true, opacity: 0.35 });
    var r = EARTH_RADIUS * 1.004;

    for (var lat = -60; lat <= 60; lat += 30) {
      var pts = [];
      for (var lon = -180; lon <= 180; lon += 4) pts.push(latLonToVector3(lat, lon, r));
      var geo = new THREE.BufferGeometry().setFromPoints(pts);
      gridGroup.add(new THREE.Line(geo, lat === 0 ? eqMat : lineMat));
    }
    for (var lon2 = -180; lon2 < 180; lon2 += 30) {
      var pts2 = [];
      for (var la = -85; la <= 85; la += 3) pts2.push(latLonToVector3(la, lon2, r));
      var geo2 = new THREE.BufferGeometry().setFromPoints(pts2);
      gridGroup.add(new THREE.Line(geo2, lon2 === 0 ? eqMat : lineMat));
    }
  })();

  /* --------------------------------------------------------------
     Starfield
     -------------------------------------------------------------- */
  (function createStars() {
    var isMobile = window.innerWidth < 720;
    var count = isMobile ? 3500 : 7000;
    var positions = new Float32Array(count * 3);
    var colors = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var r = 260 + Math.random() * 500;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
      // Slight color variation for realism
      var tint = 0.8 + Math.random() * 0.4;
      colors[i * 3] = tint;
      colors[i * 3 + 1] = tint * (0.9 + Math.random() * 0.2);
      colors[i * 3 + 2] = 1.0;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    var mat = new THREE.PointsMaterial({
      size: 1.2, sizeAttenuation: true, transparent: true, opacity: 0.85,
      vertexColors: true
    });
    scene.add(new THREE.Points(geo, mat));
  })();

  /* --------------------------------------------------------------
     ISS marker
     -------------------------------------------------------------- */
  var issGroup = new THREE.Group();
  issGroup.visible = false;
  earth.add(issGroup);
  var issCore = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.08, 0),
    new THREE.MeshBasicMaterial({ color: 0xffd166 })
  );
  issGroup.add(issCore);
  var issHalo = new THREE.Mesh(
    new THREE.RingGeometry(0.14, 0.16, 32),
    new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
  );
  issGroup.add(issHalo);
  var issData = null;

  /* --------------------------------------------------------------
     Flight markers (OpenSky)
     -------------------------------------------------------------- */
  var flightGroup = new THREE.Group();
  flightGroup.visible = false;
  earth.add(flightGroup);
  var flightMarkers = [];
  var flightData = [];
  var lastFlightFetch = 0;

  function fetchFlights() {
    if (Date.now() - lastFlightFetch < 15000) return;
    lastFlightFetch = Date.now();
    // OpenSky anonymous API — global state vectors (rate-limited)
    fetch('https://opensky-network.org/api/states/all?extended=1')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.states) return;
        flightData = d.states.slice(0, 120).filter(function (s) {
          return s[5] !== null && s[6] !== null && s[8] !== false;
        });
        renderFlightMarkers();
      })
      .catch(function () {});
  }

  function renderFlightMarkers() {
    // Clear old markers
    flightGroup.children.slice().forEach(function (m) {
      flightGroup.remove(m);
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
    });
    flightMarkers = [];
    flightData.forEach(function (s) {
      var lat = s[6], lon = s[5];
      if (lat === null || lon === null) return;
      var pos = latLonToVector3(lat, lon, EARTH_RADIUS * 1.06);
      var dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.035, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.8 })
      );
      dot.position.copy(pos);
      flightGroup.add(dot);
      flightMarkers.push(dot);
    });
  }

  setInterval(function () {
    if (flightGroup.visible && !state.paused) fetchFlights();
  }, 15000);

  /* --------------------------------------------------------------
     OrbitControls
     -------------------------------------------------------------- */
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 7.2;
  controls.maxDistance = 26;
  controls.enablePan = false;
  controls.rotateSpeed = 0.55;

  /* --------------------------------------------------------------
     State
     -------------------------------------------------------------- */
  var state = {
    autoRotate: !prefersReducedMotion,
    panelOpen: false,
    dragging: false,
    rotationTarget: null,
    markerGroup: null,
    markerPlacedAt: 0,
    unit: 'C',
    currentLocation: null,
    tabCache: {},
    showGrid: false,
    showISS: false,
    showFlights: false,
    lastFpsSample: performance.now(),
    frameCount: 0,
    currentDPR: baseDPR,
    paused: false,
    recentSearches: loadRecentSearches(),
    soundOn: false
  };

  var clock = new THREE.Clock();

  /* --------------------------------------------------------------
     Marker
     -------------------------------------------------------------- */
  function clearMarker() {
    if (state.markerGroup) {
      earth.remove(state.markerGroup);
      state.markerGroup.traverse(function (obj) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      });
      state.markerGroup = null;
    }
  }

  function placeMarker(localPoint) {
    clearMarker();
    var normal = localPoint.clone().normalize();
    var group = new THREE.Group();
    group.position.copy(normal.clone().multiplyScalar(EARTH_RADIUS * 1.006));
    group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

    var core = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xf5a94e })
    );
    group.add(core);

    var ring = new THREE.Mesh(
      new THREE.RingGeometry(0.15, 0.18, 48),
      new THREE.MeshBasicMaterial({ color: 0xf5a94e, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
    );
    group.add(ring);
    group.userData.ring = ring;

    var staticRing = new THREE.Mesh(
      new THREE.RingGeometry(0.095, 0.105, 48),
      new THREE.MeshBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
    );
    group.add(staticRing);

    var lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, 0.24)
    ]);
    var lineMat = new THREE.LineBasicMaterial({ color: 0xf5a94e, transparent: true, opacity: 0.5 });
    group.add(new THREE.Line(lineGeo, lineMat));

    earth.add(group);
    state.markerGroup = group;
    state.markerPlacedAt = clock.getElapsedTime();
  }

  function updateMarkerPulse() {
    if (!state.markerGroup || prefersReducedMotion) return;
    var t = (clock.getElapsedTime() - state.markerPlacedAt) % 1.6;
    var progress = t / 1.6;
    var scale = 1 + progress * 2.2;
    var ring = state.markerGroup.userData.ring;
    if (ring) {
      ring.scale.set(scale, scale, scale);
      ring.material.opacity = Math.max(0, 0.9 * (1 - progress));
    }
  }

  /* --------------------------------------------------------------
     Ambient Soundscape (Web Audio API — procedural)
     -------------------------------------------------------------- */
  var audioCtx = null;
  var soundNodes = null;
  var soundGain = null;

  function initSoundscape() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }

    // Master gain
    soundGain = audioCtx.createGain();
    soundGain.gain.value = 0;
    soundGain.connect(audioCtx.destination);

    // White noise buffer
    var bufferSize = audioCtx.sampleRate * 2;
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    // Rain noise
    var rainSource = audioCtx.createBufferSource();
    rainSource.buffer = buffer;
    rainSource.loop = true;
    var rainFilter = audioCtx.createBiquadFilter();
    rainFilter.type = 'bandpass';
    rainFilter.frequency.value = 2400;
    rainFilter.Q.value = 0.6;
    var rainGain = audioCtx.createGain();
    rainGain.gain.value = 0.18;
    rainSource.connect(rainFilter).connect(rainGain).connect(soundGain);
    rainSource.start();

    // Wind / rumble layer
    var windSource = audioCtx.createBufferSource();
    windSource.buffer = buffer;
    windSource.loop = true;
    var windFilter = audioCtx.createBiquadFilter();
    windFilter.type = 'lowpass';
    windFilter.frequency.value = 320;
    var windGain = audioCtx.createGain();
    windGain.gain.value = 0.08;
    windSource.connect(windFilter).connect(windGain).connect(soundGain);
    windSource.start();

    // Gentle LFO for wind modulation
    var lfo = audioCtx.createOscillator();
    var lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.15;
    lfoGain.gain.value = 80;
    lfo.connect(lfoGain).connect(windFilter.frequency);
    lfo.start();

    soundNodes = { rainSource: rainSource, windSource: windSource, rainFilter: rainFilter, windFilter: windFilter };
  }

  function toggleSoundscape() {
    if (!audioCtx) initSoundscape();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    state.soundOn = !state.soundOn;
    var btn = document.getElementById('soundToggle');
    if (state.soundOn) {
      soundGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 1.5);
      btn.classList.add('active');
      btn.textContent = '🔊';
      btn.querySelector('.pulse-ring') || btn.insertAdjacentHTML('beforeend', '<span class="pulse-ring"></span>');
      toast('Ambient soundscape on', 'ok', 1800);
    } else {
      soundGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
      btn.classList.remove('active');
      btn.textContent = '🔇';
      toast('Ambient soundscape off', 'ok', 1400);
    }
  }

  // Adjust rain intensity based on weather data
  function syncSoundscapeToWeather(weatherData) {
    if (!soundNodes || !state.soundOn) return;
    var rain = weatherData && weatherData.current && weatherData.current.precipitation;
    var target = 0.08;
    if (rain !== null && rain !== undefined) {
      target = Math.min(0.45, 0.08 + rain * 0.25);
    }
    soundNodes.rainGain = soundNodes.rainGain || { gain: { value: 0.18 } };
    // We use the filter Q for subtle intensity changes
    if (soundNodes.rainFilter) {
      soundNodes.rainFilter.Q.value = 0.5 + target * 2;
    }
  }

  /* --------------------------------------------------------------
     Animation loop
     -------------------------------------------------------------- */
  function animate() {
    requestAnimationFrame(animate);
    if (state.paused) return;

    var now = performance.now();
    state.frameCount++;
    if (now - state.lastFpsSample > 1500) {
      var fps = state.frameCount / ((now - state.lastFpsSample) / 1000);
      state.frameCount = 0;
      state.lastFpsSample = now;
      if (fps < 32 && state.currentDPR > 1) {
        state.currentDPR = Math.max(1, state.currentDPR - 0.25);
        renderer.setPixelRatio(state.currentDPR);
      }
    }

    if (state.rotationTarget !== null) {
      var diff = shortestAngleDiff(earth.rotation.y, state.rotationTarget);
      if (Math.abs(diff) > 0.002) {
        var step = diff * 0.06;
        earth.rotation.y += step;
        clouds.rotation.y += step * 1.15;
        precipGroup.rotation.y += step;
      } else {
        earth.rotation.y = state.rotationTarget;
        state.rotationTarget = null;
      }
    } else if (state.autoRotate && !state.panelOpen && !state.dragging) {
      earth.rotation.y += ROTATE_SPEED;
      clouds.rotation.y += ROTATE_SPEED * 1.15;
      precipGroup.rotation.y += ROTATE_SPEED;
    } else {
      clouds.rotation.y += ROTATE_SPEED * 0.15;
    }

    // ISS animation
    if (issGroup.visible) {
      var issScale = 1 + 0.06 * Math.sin(clock.getElapsedTime() * 4);
      issCore.scale.set(issScale, issScale, issScale);
      issHalo.scale.set(issScale, issScale, issScale);
      issHalo.material.opacity = 0.35 + 0.25 * Math.sin(clock.getElapsedTime() * 3);
    }

    // Flight marker subtle pulse
    if (flightGroup.visible && !prefersReducedMotion) {
      var pulse = 0.7 + 0.3 * Math.sin(clock.getElapsedTime() * 3);
      flightMarkers.forEach(function (m) {
        m.material.opacity = pulse;
      });
    }

    updateMarkerPulse();
    controls.update();
    renderer.render(scene, camera);
  }

  document.addEventListener('visibilitychange', function () {
    state.paused = document.hidden;
    if (!document.hidden) {
      state.lastFpsSample = performance.now();
      state.frameCount = 0;
    }
  });

  animate();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* --------------------------------------------------------------
     Pointer interaction
     -------------------------------------------------------------- */
  var raycaster = new THREE.Raycaster();
  var pointerVec = new THREE.Vector2();
  var downPos = null;
  var lastPointerMove = { x: 0, y: 0 };

  renderer.domElement.addEventListener('pointerdown', function (e) {
    downPos = { x: e.clientX, y: e.clientY };
    state.dragging = false;
  });

  renderer.domElement.addEventListener('pointermove', function (e) {
    lastPointerMove.x = e.clientX;
    lastPointerMove.y = e.clientY;
    if (downPos) {
      var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > 6) {
        state.dragging = true;
        container.classList.add('dragging');
      }
    }
  });

  window.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    downPos = null;
    container.classList.remove('dragging');
    if (dist < 6) handleTap(e.clientX, e.clientY);
    setTimeout(function () { state.dragging = false; }, 50);
  });

  function handleTap(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    pointerVec.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerVec.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerVec, camera);
    var hits = raycaster.intersectObject(earth, false);
    if (hits.length === 0) return;
    var worldPoint = hits[0].point;
    var localPoint = earth.worldToLocal(worldPoint.clone());
    var geo = vector3ToLatLon(localPoint, EARTH_RADIUS);
    placeMarker(localPoint);
    hideHint();
    fetchLocationData(geo.lat, geo.lon, null, null);
  }

  // Hover coordinate readout
  renderer.domElement.addEventListener('pointermove', function () {
    if (state.dragging) return;
    var now = performance.now();
    if (now - (handleTap._lastHover || 0) < 40) return;
    handleTap._lastHover = now;

    var rect = renderer.domElement.getBoundingClientRect();
    pointerVec.x = ((lastPointerMove.x - rect.left) / rect.width) * 2 - 1;
    pointerVec.y = -((lastPointerMove.y - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerVec, camera);
    var hits = raycaster.intersectObject(earth, false);
    if (hits.length) {
      var local = earth.worldToLocal(hits[0].point.clone());
      var geo = vector3ToLatLon(local, EARTH_RADIUS);
      var latEl = document.getElementById('crLat');
      var lonEl = document.getElementById('crLon');
      if (latEl) latEl.textContent = Math.abs(geo.lat).toFixed(2) + '°' + (geo.lat >= 0 ? 'N' : 'S');
      if (lonEl) lonEl.textContent = Math.abs(geo.lon).toFixed(2) + '°' + (geo.lon >= 0 ? 'E' : 'W');
    }
  });

  /* --------------------------------------------------------------
     Formatting helpers
     -------------------------------------------------------------- */
  function formatCoord(lat, lon) {
    var latDir = lat >= 0 ? 'N' : 'S';
    var lonDir = lon >= 0 ? 'E' : 'W';
    return Math.abs(lat).toFixed(2) + '°' + latDir + '  ' + Math.abs(lon).toFixed(2) + '°' + lonDir;
  }
  function aqiCategory(aqi) {
    if (aqi <= 50) return { label: 'Good', color: '#4ade80' };
    if (aqi <= 100) return { label: 'Moderate', color: '#facc15' };
    if (aqi <= 150) return { label: 'Unhealthy (Sensitive)', color: '#fb923c' };
    if (aqi <= 200) return { label: 'Unhealthy', color: '#f87171' };
    if (aqi <= 300) return { label: 'Very Unhealthy', color: '#c084fc' };
    return { label: 'Hazardous', color: '#991b1b' };
  }
  function cToF(c) { return (c * 9 / 5) + 32; }
  function statCard(label, value) {
    return '<div class="stat-card"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
  }
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str === undefined || str === null ? '' : str;
    return div.innerHTML;
  }
  function formatNumber(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function formatDistance(km) {
    if (km === undefined || km === null || isNaN(km)) return '—';
    return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
  }
  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }
  function formatTimeFromIso(iso) {
    if (!iso) return '—';
    var t = iso.split('T')[1];
    return t ? t.slice(0, 5) : '—';
  }
  function formatHourFromIso(iso) {
    if (!iso) return '';
    var t = iso.split('T')[1];
    return t ? t.slice(0, 2) + ':00' : '';
  }
  function windCompass(deg) {
    if (deg === null || deg === undefined) return '';
    var dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }
  function getMoonPhase(date) {
    var knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
    var synodicMonth = 29.530588853;
    var diffDays = (date.getTime() - knownNewMoon) / 86400000;
    var phase = diffDays % synodicMonth;
    if (phase < 0) phase += synodicMonth;
    var illumination = (1 - Math.cos((phase / synodicMonth) * 2 * Math.PI)) / 2;
    var idx = Math.floor((phase / synodicMonth) * 8 + 0.5) % 8;
    return { name: MOON_NAMES[idx], icon: MOON_ICONS[idx], illumination: Math.round(illumination * 100), phase: phase / synodicMonth };
  }
  function dataRow(label, value) {
    return '<div class="data-row"><span class="data-row-label">' + label + '</span><span class="data-row-value">' + value + '</span></div>';
  }

  function getFavorites() {

    catch (e) { return []; }

  function saveFavorites(list) {

  }
  function isFavorite(lat, lon) {
    var favs = getFavorites();
    for (var i = 0; i < favs.length; i++) {
      if (Math.abs(favs[i].lat - lat) < 0.01 && Math.abs(favs[i].lon - lon) < 0.01) return true;
    }
    return false;
  }
  function toggleFavorite(name, lat, lon) {
    var favs = getFavorites();
    var idx = -1;
    for (var i = 0; i < favs.length; i++) {
      if (Math.abs(favs[i].lat - lat) < 0.01 && Math.abs(favs[i].lon - lon) < 0.01) { idx = i; break; }
    }
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push({ name: name, lat: lat, lon: lon });
    saveFavorites(favs);
    return idx < 0;
  }
  function loadRecentSearches() {

    list.unshift(entry);
    list = list.slice(0, 6);
    state.recentSearches = list;
    try { localStorage.setItem('earthStationRecent', JSON.stringify(list)); } catch (e) {}
  }

  /* --------------------------------------------------------------
     URL hash
     -------------------------------------------------------------- */
  function updateHash(lat, lon, name) {
    var hash = '#@' + lat.toFixed(3) + ',' + lon.toFixed(3) + (name ? ',' + encodeURIComponent(name) : '');
    try { history.replaceState(null, '', hash); } catch (e) { location.hash = hash; }
  }
  function parseHash() {
    var h = location.hash;
    if (!h || h.indexOf('#@') !== 0) return null;
    var body = h.slice(2);
    var parts = body.split(',');
    if (parts.length < 2) return null;
    var lat = parseFloat(parts[0]), lon = parseFloat(parts[1]);
    if (isNaN(lat) || isNaN(lon)) return null;
    var name = parts.slice(2).join(',') || null;
    try { name = name ? decodeURIComponent(name) : null; } catch (e) {}
    return { lat: lat, lon: lon, name: name };
  }
