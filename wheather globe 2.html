<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Earth Station — Live Atmospheric Readout</title>
<meta name="description" content="A realistic rotating 3D Earth. Tap anywhere to read live temperature, humidity and air quality." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04060b;
    --deep:#0a1120;
    --panel:#0c1424;
    --cyan:#5eead4;
    --cyan-dim:rgba(94,234,212,0.35);
    --amber:#f5a94e;
    --amber-dim:rgba(245,169,78,0.35);
    --ink:#e8edf6;
    --mist:#7d8aa3;
    --line:rgba(125,138,163,0.18);
    --radius:14px;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-display);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #bg-gradient{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, rgba(30,58,95,0.35), transparent 60%),
      radial-gradient(ellipse 120% 100% at 50% 100%, rgba(8,12,22,0.9), var(--void) 70%);
    pointer-events:none;
    z-index:0;
  }

  #canvas-container{
    position:fixed; inset:0;
    z-index:1;
    cursor:grab;
  }
  #canvas-container.dragging{ cursor:grabbing; }
  #canvas-container canvas{ display:block; touch-action:none; }

  /* ---------- HUD corner brackets ---------- */
  .hud-corner{
    position:fixed;
    width:26px; height:26px;
    border:1.5px solid var(--cyan-dim);
    z-index:5;
    pointer-events:none;
    opacity:0.8;
  }
  .hud-corner.tl{ top:18px; left:18px; border-right:none; border-bottom:none; }
  .hud-corner.tr{ top:18px; right:18px; border-left:none; border-bottom:none; }
  .hud-corner.bl{ bottom:18px; left:18px; border-right:none; border-top:none; }
  .hud-corner.br{ bottom:18px; right:18px; border-left:none; border-top:none; }

  /* ---------- Top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0;
    z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:28px 44px 0 44px;
    pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }

  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    color:var(--amber);
    font-size:20px;
    line-height:1;
    text-shadow:0 0 14px var(--amber-dim);
  }
  .brand-text{ display:flex; flex-direction:column; gap:3px; }
  .brand-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    letter-spacing:0.18em;
    color:var(--ink);
  }
  .brand-sub{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    color:var(--mist);
    text-transform:uppercase;
  }

  .controls{ display:flex; align-items:flex-start; gap:10px; }

  .search-wrap{ position:relative; width:250px; }
  #searchInput{
    width:100%;
    background:rgba(10,17,32,0.72);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:0.02em;
    outline:none;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:border-color 0.2s ease;
  }
  #searchInput::placeholder{ color:var(--mist); }
  #searchInput:focus{ border-color:var(--cyan-dim); }

  .search-results{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:rgba(10,16,30,0.92);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    max-height:260px; overflow-y:auto;
  }
  .search-results.hidden{ display:none; }
  .search-result-item{
    padding:10px 14px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:8px;
  }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover{ background:rgba(94,234,212,0.08); }
  .search-result-item .sr-country{ color:var(--mist); white-space:nowrap; }
  .search-result-empty{
    padding:12px 14px; font-family:var(--font-mono); font-size:12px; color:var(--mist);
  }

  .icon-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,17,32,0.72);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--cyan);
    font-size:16px;
    cursor:pointer;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .icon-btn:hover{ border-color:var(--cyan-dim); }
  .icon-btn:active{ transform:scale(0.94); }
  .icon-btn.paused{ color:var(--mist); }

  /* ---------- Hint ---------- */
  .hint{
    position:fixed; bottom:36px; left:50%;
    transform:translateX(-50%);
    z-index:6;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.16em;
    color:var(--mist);
    text-transform:uppercase;
    display:flex; align-items:center; gap:10px;
    transition:opacity 0.6s ease;
    pointer-events:none;
  }
  .hint::before, .hint::after{
    content:'';
    width:22px; height:1px;
    background:var(--line);
  }
  .hint.faded{ opacity:0; }

  /* ---------- Loading ---------- */
  .loading{
    position:fixed; inset:0; z-index:50;
    background:var(--void);
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.6s ease, visibility 0.6s ease;
  }
  .loading.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loading-inner{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .spinner{
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--cyan);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--mist);
    text-transform:uppercase;
  }

  /* ---------- Panel ---------- */
  .panel{
    position:fixed;
    top:0; right:0;
    width:410px; height:100%;
    z-index:20;
    background:rgba(9,14,26,0.82);
    border-left:1px solid var(--line);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    transform:translateX(100%);
    transition:transform 0.45s cubic-bezier(0.19,1,0.22,1);
    overflow-y:auto;
  }
  .panel.visible{ transform:translateX(0); }

  .panel-close{
    position:absolute; top:20px; right:20px;
    width:30px; height:30px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(10,17,32,0.6);
    color:var(--mist);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }
  .panel-close:hover{ color:var(--ink); border-color:var(--cyan-dim); }

  .panel-content{ padding:76px 26px 32px 26px; }

  .p-eyebrow{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.2em;
    color:var(--cyan);
    text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
    margin-bottom:10px;
  }
  .p-eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
  }

  .p-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    line-height:1.25;
    margin:0 0 8px 0;
  }
  .p-coords{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--mist);
    letter-spacing:0.03em;
  }

  .p-divider{ height:1px; background:var(--line); margin:22px 0; }

  .p-temp-row{ display:flex; align-items:flex-end; justify-content:space-between; }
  .p-temp{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:52px;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .p-temp-unit{
    font-size:22px;
    color:var(--mist);
    cursor:pointer;
    user-select:none;
    border-bottom:1px dashed var(--mist);
  }
  .p-cond{ text-align:right; }
  .p-cond-icon{ font-size:30px; line-height:1; }
  .p-cond-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--mist);
    margin-top:4px;
    max-width:120px;
  }
  .p-feels{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--mist);
    margin-top:10px;
    letter-spacing:0.02em;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:22px;
  }
  .stat-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    background:rgba(255,255,255,0.015);
  }
  .stat-label{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.14em;
    color:var(--mist);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .stat-value{
    font-family:var(--font-mono);
    font-size:19px;
    font-weight:600;
  }

  .aqi-block{ margin-top:22px; }
  .aqi-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .aqi-label{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.14em;
    color:var(--mist);
    text-transform:uppercase;
  }
  .aqi-value-wrap{ display:flex; align-items:baseline; gap:8px; }
  .aqi-value{ font-family:var(--font-mono); font-size:19px; font-weight:600; }
  .aqi-tag{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.05em;
    padding:2px 8px;
    border-radius:20px;
    text-transform:uppercase;
  }
  .aqi-bar-track{
    height:6px; border-radius:4px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .aqi-bar-fill{
    height:100%; border-radius:4px;
    transition:width 0.6s ease;
  }

  .p-footer{
    margin-top:28px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.04em;
    color:var(--mist);
    line-height:1.6;
  }
  .p-footer a{ color:var(--mist); }

  /* ---------- City Intel (image, history, population, POIs, transport) ---------- */
  .info-loading{
    display:flex; align-items:center; gap:10px;
    padding:18px 2px;
  }
  .spinner.small{ width:16px; height:16px; border-width:1.5px; }

  .section-title{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.16em;
    color:var(--amber);
    text-transform:uppercase;
    display:flex; align-items:center; gap:7px;
    margin:22px 0 12px 0;
  }
  .section-title .stitch{ flex:1; height:1px; background:var(--line); }

  .city-hero{
    position:relative;
    width:100%; height:150px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(140deg, rgba(94,234,212,0.08), rgba(245,169,78,0.05));
  }
  .city-hero img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(1.05) contrast(1.02);
  }
  .city-hero-fallback{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; opacity:0.5;
  }
  .city-hero-caption{
    position:absolute; left:0; right:0; bottom:0;
    padding:8px 12px;
    background:linear-gradient(to top, rgba(4,6,11,0.85), transparent);
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--mist);
  }

  .city-extract{
    font-family:var(--font-display);
    font-size:13px;
    line-height:1.65;
    color:var(--ink);
    opacity:0.92;
    margin-top:2px;
  }

  .pop-card{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    background:rgba(255,255,255,0.015);
  }
  .pop-label{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.14em;
    color:var(--mist);
    text-transform:uppercase;
  }
  .pop-value{
    font-family:var(--font-mono);
    font-size:22px;
    font-weight:600;
    color:var(--cyan);
    margin-top:4px;
  }
  .pop-icon{ font-size:26px; opacity:0.6; }

  .poi-list, .transport-list{ display:flex; flex-direction:column; gap:8px; }

  .poi-item{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    background:rgba(255,255,255,0.015);
    text-decoration:none;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .poi-item:hover{ border-color:var(--cyan-dim); background:rgba(94,234,212,0.05); }
  .poi-thumb{
    width:42px; height:42px; border-radius:8px;
    object-fit:cover; flex-shrink:0;
    background:rgba(255,255,255,0.04);
  }
  .poi-thumb-fallback{
    width:42px; height:42px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.04);
    font-size:17px;
  }
  .poi-info{ flex:1; min-width:0; }
  .poi-name{
    font-family:var(--font-display);
    font-size:12.5px; font-weight:500;
    color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .poi-dist{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--mist);
    margin-top:2px;
  }

  .transport-item{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    background:rgba(255,255,255,0.015);
  }
  .transport-icon{
    width:36px; height:36px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(245,169,78,0.1);
    font-size:16px;
  }
  .transport-info{ flex:1; min-width:0; }
  .transport-type{
    font-family:var(--font-mono);
    font-size:9px; letter-spacing:0.1em;
    color:var(--amber); text-transform:uppercase;
  }
  .transport-name{
    font-family:var(--font-display);
    font-size:12.5px; font-weight:500; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:2px;
  }
  .transport-dist{
    font-family:var(--font-mono);
    font-size:11px; color:var(--mist);
    flex-shrink:0;
  }

  .info-empty{
    font-family:var(--font-mono);
    font-size:11px; color:var(--mist);
    padding:6px 2px;
  }

  .wiki-link{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:14px;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.05em;
    color:var(--cyan);
    text-decoration:none;
    border-bottom:1px dashed var(--cyan-dim);
    padding-bottom:2px;
  }
  .wiki-link:hover{ border-color:var(--cyan); }

  /* ---------- Tabs ---------- */
  .panel-tabs{
    display:flex; gap:2px;
    overflow-x:auto;
    margin:20px 0 4px 0;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .panel-tabs::-webkit-scrollbar{ display:none; }
  .panel-tab-btn{
    flex:0 0 auto;
    padding:9px 11px 10px 11px;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--mist);
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    cursor:pointer;
    white-space:nowrap;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .panel-tab-btn:hover{ color:var(--ink); }
  .panel-tab-btn.active{ color:var(--cyan); border-bottom-color:var(--cyan); }

  .tab-panel{ display:none; padding-top:16px; }
  .tab-panel.active{ display:block; }

  /* ---------- Hourly forecast strip ---------- */
  .hourly-scroll{
    display:flex; gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:4px;
  }
  .hourly-item{
    flex:0 0 auto; width:56px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 4px;
    background:rgba(255,255,255,0.015);
  }
  .hourly-item.is-now{ border-color:var(--cyan-dim); background:rgba(94,234,212,0.06); }
  .hourly-time{ font-family:var(--font-mono); font-size:9px; color:var(--mist); }
  .hourly-icon{ font-size:17px; }
  .hourly-temp{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--ink); }
  .hourly-rain{ font-family:var(--font-mono); font-size:8.5px; color:var(--cyan); }

  /* ---------- Daily forecast list ---------- */
  .daily-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 2px;
    border-bottom:1px solid var(--line);
  }
  .daily-row:last-child{ border-bottom:none; }
  .daily-day{ width:64px; flex-shrink:0; font-family:var(--font-mono); font-size:10.5px; color:var(--mist); }
  .daily-icon{ font-size:15px; width:22px; text-align:center; flex-shrink:0; }
  .daily-rain{ width:38px; flex-shrink:0; font-family:var(--font-mono); font-size:9.5px; color:var(--cyan); text-align:right; }
  .daily-temps{ flex:1; display:flex; align-items:center; gap:8px; min-width:0; }
  .daily-min{ font-family:var(--font-mono); font-size:10.5px; color:var(--mist); width:26px; text-align:right; }
  .daily-bar-track{ flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.06); position:relative; }
  .daily-bar-fill{ position:absolute; top:0; height:100%; border-radius:2px; background:linear-gradient(90deg,var(--cyan),var(--amber)); }
  .daily-max{ font-family:var(--font-mono); font-size:10.5px; font-weight:600; color:var(--ink); width:26px; }

  /* ---------- Sun / moon ---------- */
  .sunmoon-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sunmoon-card{
    border:1px solid var(--line); border-radius:10px;
    padding:14px; text-align:center;
    background:rgba(255,255,255,0.015);
  }
  .sunmoon-icon{ font-size:22px; }
  .sunmoon-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.1em; color:var(--mist); text-transform:uppercase; margin-top:6px; }
  .sunmoon-value{ font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--ink); margin-top:2px; }

  /* ---------- Category chips ---------- */
  .chip-scroll{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; scrollbar-width:none; }
  .chip-scroll::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.04em;
    padding:6px 11px; border-radius:20px;
    border:1px solid var(--line);
    color:var(--mist);
    background:rgba(255,255,255,0.02);
  }
  .chip.has-results{ color:var(--ink); border-color:var(--cyan-dim); }
  .category-block{ margin-bottom:18px; }
  .category-heading{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--amber); margin-bottom:8px;
  }

  /* ---------- Data rows (key/value list) ---------- */
  .data-list{ display:flex; flex-direction:column; }
  .data-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .data-row:last-child{ border-bottom:none; }
  .data-row-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--mist); letter-spacing:0.03em; }
  .data-row-value{ font-family:var(--font-mono); font-size:12px; color:var(--ink); font-weight:600; text-align:right; }

  .note-card{
    border:1px dashed var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-family:var(--font-mono);
    font-size:10.5px;
    line-height:1.6;
    color:var(--mist);
    margin-top:6px;
  }

  .tip-card{
    display:flex; gap:10px; align-items:flex-start;
    border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
    background:rgba(245,169,78,0.04);
  }
  .tip-icon{ font-size:16px; flex-shrink:0; }
  .tip-text{ font-family:var(--font-display); font-size:12px; line-height:1.5; color:var(--ink); }

  .fav-btn{
    position:absolute; top:20px; left:20px;
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(10,14,22,0.6);
    color:var(--mist);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .fav-btn.active{ color:var(--amber); border-color:var(--amber); }

  .quake-item, .holiday-item, .currency-item{
    border:1px solid var(--line); border-radius:10px;
    padding:11px 14px; margin-bottom:8px;
    background:rgba(255,255,255,0.015);
  }
  .quake-mag{ font-family:var(--font-mono); font-size:15px; font-weight:700; color:var(--amber); }
  .quake-place{ font-family:var(--font-display); font-size:12px; color:var(--ink); margin-top:3px; }
  .quake-time{ font-family:var(--font-mono); font-size:9.5px; color:var(--mist); margin-top:3px; }

  .p-loading, .p-error{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:60px 10px;
    text-align:center;
  }
  .p-error-text{
    font-family:var(--font-mono); font-size:12px; color:var(--mist); line-height:1.6;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:720px){
    .topbar{ flex-direction:column; padding:20px 18px 0 18px; gap:12px; }
    .controls{ width:100%; }
    .search-wrap{ flex:1; width:auto; }
    .brand{ align-self:flex-start; }
    .hud-corner{ display:none; }
    .panel{
      top:auto; bottom:0; left:0; right:0;
      width:100%; height:auto; max-height:72vh;
      border-left:none; border-top:1px solid var(--line);
      border-radius:20px 20px 0 0;
      transform:translateY(100%);
    }
    .panel.visible{ transform:translateY(0); }
    .panel-content{ padding:56px 20px 34px 20px; }
    .hint{ bottom:20px; font-size:10px; text-align:center; padding:0 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    .spinner{ animation:none; }
  }
</style>

<body>

  <div id="bg-gradient"></div>
  <div id="canvas-container"></div>

  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◇</span>
      <div class="brand-text">
        <span class="brand-title">EARTH STATION</span>
        <span class="brand-sub">live atmospheric readout</span>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Search a place…" autocomplete="off" spellcheck="false" />
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <button id="rotateToggle" class="icon-btn" title="Pause rotation" aria-label="Toggle auto-rotation">⟳</button>
    </div>
  </header>

  <div id="hint" class="hint">Tap anywhere on Earth to read conditions</div>

  <div id="loading" class="loading">
    <div class="loading-inner">
      <div class="spinner"></div>
      <span class="loading-text">Calibrating sensors…</span>
    </div>
  </div>

  <aside id="panel" class="panel">
    <button id="panelClose" class="panel-close" aria-label="Close">×</button>
    <div id="panelContent" class="panel-content"></div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
/* ==========================================================================
   EARTH STATION — rotating realistic globe with live weather / AQI readout
   ========================================================================== */

(function () {
  'use strict';

  var EARTH_RADIUS = 5;
  var ROTATE_SPEED = 0.0011;
  var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TEXTURES = {
    map: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
    normal: 'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
    specular: 'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
    clouds: 'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'
  };

  var WEATHER_CODES = {
    0: ['Clear sky', '☀️'], 1: ['Mainly clear', '🌤️'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
    45: ['Fog', '🌫️'], 48: ['Rime fog', '🌫️'],
    51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Dense drizzle', '🌧️'],
    56: ['Freezing drizzle', '🌧️'], 57: ['Dense freezing drizzle', '🌧️'],
    61: ['Slight rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
    66: ['Freezing rain', '🌧️'], 67: ['Heavy freezing rain', '🌨️'],
    71: ['Slight snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '❄️'],
    80: ['Rain showers', '🌦️'], 81: ['Rain showers', '🌧️'], 82: ['Violent showers', '⛈️'],
    85: ['Snow showers', '🌨️'], 86: ['Heavy snow showers', '❄️'],
    95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm, hail', '⛈️'], 99: ['Severe thunderstorm', '⛈️']
  };

  /* ---------------------------------------------------------------------
     Scene setup
     --------------------------------------------------------------------- */

  var container = document.getElementById('canvas-container');
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 13.5);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  var ambient = new THREE.AmbientLight(0x3a4a6b, 1.6);
  scene.add(ambient);

  var sunLight = new THREE.DirectionalLight(0xffffff, 1.15);
  sunLight.position.set(6, 2.5, 5);
  scene.add(sunLight);

  var loadManager = new THREE.LoadingManager();
  loadManager.onLoad = function () {
    var loadingEl = document.getElementById('loading');
    loadingEl.classList.add('hidden');
  };
  var textureLoader = new THREE.TextureLoader(loadManager);
  textureLoader.crossOrigin = 'anonymous';

  function fallbackEarthTexture() {
    var canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 512;
    var ctx = canvas.getContext('2d');
    var grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0c3d68');
    grad.addColorStop(1, '#0a2c4d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);
    ctx.fillStyle = '#2f6b3a';
    for (var i = 0; i < 46; i++) {
      var x = Math.random() * 1024, y = Math.random() * 512, r = 26 + Math.random() * 70;
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.55, Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    return new THREE.CanvasTexture(canvas);
  }

  var earthMaterial = new THREE.MeshPhongMaterial({
    specular: new THREE.Color(0x252b36),
    shininess: 9
  });

  textureLoader.load(TEXTURES.map, function (tex) {
    earthMaterial.map = tex;
    earthMaterial.needsUpdate = true;
  }, undefined, function () {
    earthMaterial.map = fallbackEarthTexture();
    earthMaterial.needsUpdate = true;
  });
  textureLoader.load(TEXTURES.normal, function (tex) {
    earthMaterial.normalMap = tex;
    earthMaterial.normalScale = new THREE.Vector2(0.7, 0.7);
    earthMaterial.needsUpdate = true;
  }, undefined, function () {});
  textureLoader.load(TEXTURES.specular, function (tex) {
    earthMaterial.specularMap = tex;
    earthMaterial.needsUpdate = true;
  }, undefined, function () {});

  var earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
  var earth = new THREE.Mesh(earthGeometry, earthMaterial);
  scene.add(earth);

  var cloudMaterial = new THREE.MeshPhongMaterial({
    transparent: true,
    opacity: 0.32,
    depthWrite: false
  });
  textureLoader.load(TEXTURES.clouds, function (tex) {
    cloudMaterial.map = tex;
    cloudMaterial.needsUpdate = true;
  }, undefined, function () {});
  var cloudGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.012, 96, 96);
  var clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
  scene.add(clouds);

  // Fresnel-style atmosphere glow
  var atmosphereMaterial = new THREE.ShaderMaterial({
    vertexShader: [
      'varying vec3 vNormal;',
      'void main() {',
      '  vNormal = normalize(normalMatrix * normal);',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vNormal;',
      'void main() {',
      '  float intensity = pow(0.62 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.2);',
      '  gl_FragColor = vec4(0.36, 0.72, 0.95, 1.0) * intensity;',
      '}'
    ].join('\n'),
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true
  });
  var atmosphere = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.16, 64, 64), atmosphereMaterial);
  scene.add(atmosphere);

  // Starfield
  (function createStars() {
    var count = 7000;
    var positions = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var r = 260 + Math.random() * 500;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    var mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, sizeAttenuation: true });
    scene.add(new THREE.Points(geo, mat));
  })();

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 7.2;
  controls.maxDistance = 26;
  controls.enablePan = false;
  controls.rotateSpeed = 0.55;
  controls.autoRotate = false; // we rotate the earth mesh itself instead

  /* ---------------------------------------------------------------------
     State
     --------------------------------------------------------------------- */

  var state = {
    autoRotate: !prefersReducedMotion,
    panelOpen: false,
    dragging: false,
    rotationTarget: null,
    markerGroup: null,
    markerPlacedAt: 0,
    unit: 'C',
    lastWeather: null,
    cityInfoToken: 0,
    cityInfoCacheKey: null,
    cityInfoCacheHTML: null
  };

  var clock = new THREE.Clock();

  /* ---------------------------------------------------------------------
     Coordinate conversion
     --------------------------------------------------------------------- */

  function latLonToVector3(lat, lon, radius) {
    var phi = (90 - lat) * (Math.PI / 180);
    var theta = (lon + 180) * (Math.PI / 180);
    var x = -(radius * Math.sin(phi) * Math.cos(theta));
    var z = radius * Math.sin(phi) * Math.sin(theta);
    var y = radius * Math.cos(phi);
    return new THREE.Vector3(x, y, z);
  }

  function vector3ToLatLon(v, radius) {
    var phi = Math.acos(Math.max(-1, Math.min(1, v.y / radius)));
    var theta = Math.atan2(v.z, -v.x);
    var lat = 90 - (phi * 180 / Math.PI);
    var lon = (theta * 180 / Math.PI) - 180;
    if (lon < -180) lon += 360;
    if (lon > 180) lon -= 360;
    return { lat: lat, lon: lon };
  }

  function shortestAngleDiff(a, b) {
    var diff = (b - a) % (Math.PI * 2);
    if (diff > Math.PI) diff -= Math.PI * 2;
    if (diff < -Math.PI) diff += Math.PI * 2;
    return diff;
  }

  function frontRotationFor(localPoint) {
    return Math.atan2(-localPoint.x, localPoint.z);
  }

  /* ---------------------------------------------------------------------
     Marker / target-lock reticle
     --------------------------------------------------------------------- */

  function clearMarker() {
    if (state.markerGroup) {
      earth.remove(state.markerGroup);
      state.markerGroup.traverse(function (obj) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      });
      state.markerGroup = null;
    }
  }

  function placeMarker(localPoint) {
    clearMarker();
    var normal = localPoint.clone().normalize();
    var group = new THREE.Group();
    group.position.copy(normal.clone().multiplyScalar(EARTH_RADIUS * 1.006));
    group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

    var core = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xf5a94e })
    );
    group.add(core);

    var ring = new THREE.Mesh(
      new THREE.RingGeometry(0.14, 0.165, 48),
      new THREE.MeshBasicMaterial({ color: 0xf5a94e, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
    );
    group.add(ring);
    group.userData.ring = ring;

    var staticRing = new THREE.Mesh(
      new THREE.RingGeometry(0.09, 0.1, 48),
      new THREE.MeshBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
    );
    group.add(staticRing);

    earth.add(group);
    state.markerGroup = group;
    state.markerPlacedAt = clock.getElapsedTime();
  }

  function updateMarkerPulse() {
    if (!state.markerGroup || prefersReducedMotion) return;
    var t = (clock.getElapsedTime() - state.markerPlacedAt) % 1.6;
    var progress = t / 1.6;
    var scale = 1 + progress * 2.1;
    var ring = state.markerGroup.userData.ring;
    ring.scale.set(scale, scale, scale);
    ring.material.opacity = Math.max(0, 0.9 * (1 - progress));
  }

  /* ---------------------------------------------------------------------
     Animation loop
     --------------------------------------------------------------------- */

  function animate() {
    requestAnimationFrame(animate);

    if (state.rotationTarget !== null) {
      var diff = shortestAngleDiff(earth.rotation.y, state.rotationTarget);
      if (Math.abs(diff) > 0.002) {
        var step = diff * 0.06;
        earth.rotation.y += step;
        clouds.rotation.y += step;
      } else {
        earth.rotation.y = state.rotationTarget;
        state.rotationTarget = null;
      }
    } else if (state.autoRotate && !state.panelOpen && !state.dragging) {
      earth.rotation.y += ROTATE_SPEED;
      clouds.rotation.y += ROTATE_SPEED * 1.15;
    } else {
      clouds.rotation.y += ROTATE_SPEED * 0.15;
    }

    updateMarkerPulse();
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---------------------------------------------------------------------
     Pointer interaction: distinguish tap from drag
     --------------------------------------------------------------------- */

  var raycaster = new THREE.Raycaster();
  var pointerVec = new THREE.Vector2();
  var downPos = null;

  renderer.domElement.addEventListener('pointerdown', function (e) {
    downPos = { x: e.clientX, y: e.clientY };
    state.dragging = false;
  });

  renderer.domElement.addEventListener('pointermove', function (e) {
    if (downPos) {
      var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > 6) {
        state.dragging = true;
        container.classList.add('dragging');
      }
    }
  });

  window.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    downPos = null;
    container.classList.remove('dragging');
    if (dist < 6) {
      handleTap(e.clientX, e.clientY);
    }
    setTimeout(function () { state.dragging = false; }, 50);
  });

  function handleTap(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    pointerVec.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerVec.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerVec, camera);
    var hits = raycaster.intersectObject(earth, false);
    if (hits.length === 0) return;
    var worldPoint = hits[0].point;
    var localPoint = earth.worldToLocal(worldPoint.clone());
    var geo = vector3ToLatLon(localPoint, EARTH_RADIUS);
    placeMarker(localPoint);
    hideHint();
    fetchLocationData(geo.lat, geo.lon, null);
  }

  /* ---------------------------------------------------------------------
     Hint fade
     --------------------------------------------------------------------- */

  function hideHint() {
    var hint = document.getElementById('hint');
    if (hint && !hint.classList.contains('faded')) hint.classList.add('faded');
  }

  /* ---------------------------------------------------------------------
     Rotate-toggle button
     --------------------------------------------------------------------- */

  var rotateBtn = document.getElementById('rotateToggle');
  function syncRotateBtn() {
    rotateBtn.textContent = state.autoRotate ? '⟳' : '⏸';
    rotateBtn.classList.toggle('paused', !state.autoRotate);
    rotateBtn.title = state.autoRotate ? 'Pause rotation' : 'Resume rotation';
  }
  syncRotateBtn();
  rotateBtn.addEventListener('click', function () {
    state.autoRotate = !state.autoRotate;
    syncRotateBtn();
  });

  state.tabCache = {};
  state.currentLocation = null;

  /* ---------------------------------------------------------------------
     Panel shell
     --------------------------------------------------------------------- */

  var panelEl = document.getElementById('panel');
  var panelContentEl = document.getElementById('panelContent');
  var panelCloseEl = document.getElementById('panelClose');

  var MOON_NAMES = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  var MOON_ICONS = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];

  var TABS = [
    { id: 'weather', label: 'Weather' },
    { id: 'city', label: 'City' },
    { id: 'places', label: 'Places' },
    { id: 'food', label: 'Food & Stay' },
    { id: 'transport', label: 'Transport' },
    { id: 'more', label: 'More' }
  ];

  function openPanel() {
    state.panelOpen = true;
    panelEl.classList.add('visible');
  }
  function closePanel() {
    state.panelOpen = false;
    panelEl.classList.remove('visible');
    clearMarker();
  }
  panelCloseEl.addEventListener('click', closePanel);

  function showPanelLoading() {
    panelContentEl.innerHTML =
      '<div class="p-loading">' +
      '<div class="spinner"></div>' +
      '<span class="loading-text" style="font-size:10.5px;">Reading sensors…</span>' +
      '</div>';
    openPanel();
  }

  function showPanelError(lat, lon) {
    panelContentEl.innerHTML =
      '<div class="p-eyebrow"><span class="dot"></span>LOCATION LOCK</div>' +
      '<div class="p-title">' + formatCoord(lat, lon) + '</div>' +
      '<div class="p-error">' +
      '<div class="p-error-text">Signal lost. Could not reach the weather<br/>network for this point. Try another spot.</div>' +
      '</div>';
    openPanel();
  }

  function formatCoord(lat, lon) {
    var latDir = lat >= 0 ? 'N' : 'S';
    var lonDir = lon >= 0 ? 'E' : 'W';
    return Math.abs(lat).toFixed(2) + '°' + latDir + '  ' + Math.abs(lon).toFixed(2) + '°' + lonDir;
  }

  function aqiCategory(aqi) {
    if (aqi <= 50) return { label: 'Good', color: '#4ade80' };
    if (aqi <= 100) return { label: 'Moderate', color: '#facc15' };
    if (aqi <= 150) return { label: 'Unhealthy (Sensitive)', color: '#fb923c' };
    if (aqi <= 200) return { label: 'Unhealthy', color: '#f87171' };
    if (aqi <= 300) return { label: 'Very Unhealthy', color: '#c084fc' };
    return { label: 'Hazardous', color: '#991b1b' };
  }

  function cToF(c) { return (c * 9 / 5) + 32; }

  function statCard(label, value) {
    return '<div class="stat-card"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str === undefined || str === null ? '' : str;
    return div.innerHTML;
  }

  function formatNumber(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function formatDistance(km) {
    if (km === undefined || km === null || isNaN(km)) return '—';
    return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function formatTimeFromIso(iso) {
    if (!iso) return '—';
    var t = iso.split('T')[1];
    return t ? t.slice(0, 5) : '—';
  }
  function formatHourFromIso(iso) {
    if (!iso) return '';
    var t = iso.split('T')[1];
    return t ? t.slice(0, 2) + ':00' : '';
  }
  function windCompass(deg) {
    if (deg === null || deg === undefined) return '';
    var dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }
  function getMoonPhase(date) {
    var knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
    var synodicMonth = 29.530588853;
    var diffDays = (date.getTime() - knownNewMoon) / 86400000;
    var phase = diffDays % synodicMonth;
    if (phase < 0) phase += synodicMonth;
    var illumination = (1 - Math.cos((phase / synodicMonth) * 2 * Math.PI)) / 2;
    var idx = Math.floor((phase / synodicMonth) * 8 + 0.5) % 8;
    return { name: MOON_NAMES[idx], icon: MOON_ICONS[idx], illumination: Math.round(illumination * 100) };
  }

  /* ---------------------------------------------------------------------
     Favorites (stored locally in this browser)
     --------------------------------------------------------------------- */

  function getFavorites() {
    try { return JSON.parse(localStorage.getItem('earthStationFavorites') || '[]'); }
    catch (e) { return []; }
  }
  function saveFavorites(list) {
    try { localStorage.setItem('earthStationFavorites', JSON.stringify(list)); } catch (e) {}
  }
  function isFavorite(lat, lon) {
    var favs = getFavorites();
    for (var i = 0; i < favs.length; i++) {
      if (Math.abs(favs[i].lat - lat) < 0.01 && Math.abs(favs[i].lon - lon) < 0.01) return true;
    }
    return false;
  }
  function toggleFavorite(name, lat, lon) {
    var favs = getFavorites();
    var idx = -1;
    for (var i = 0; i < favs.length; i++) {
      if (Math.abs(favs[i].lat - lat) < 0.01 && Math.abs(favs[i].lon - lon) < 0.01) { idx = i; break; }
    }
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push({ name: name, lat: lat, lon: lon });
    saveFavorites(favs);
    return idx < 0;
  }

  /* ---------------------------------------------------------------------
     Panel render — head, quick glance, tab shell
     --------------------------------------------------------------------- */

  function renderPanel(placeName, lat, lon, weatherData, aqiData, loc) {
    state.currentLocation = loc;
    state.currentLocation.weatherData = weatherData;
    state.currentLocation.aqiData = aqiData;

    var current = weatherData ? weatherData.current : null;
    var wcode = current && current.weather_code !== undefined ? current.weather_code : null;
    var wInfo = WEATHER_CODES[wcode] || ['Conditions unavailable', '🛰️'];
    var tempC = current ? current.temperature_2m : null;
    var feelsC = current ? current.apparent_temperature : null;

    var favActive = isFavorite(lat, lon);
    var eyebrow = '<div class="p-eyebrow"><span class="dot"></span>LOCATION LOCK</div>';
    var favBtn = '<button class="fav-btn' + (favActive ? ' active' : '') + '" id="favToggleBtn" title="Save to favorites">' + (favActive ? '★' : '☆') + '</button>';
    var title = '<div class="p-title">' + escapeHtml(placeName || 'Unnamed Point') + '</div>';
    var coords = '<div class="p-coords">' + formatCoord(lat, lon) + '</div>';

    var tempDisplay = tempC === null || tempC === undefined ? '—' : Math.round(state.unit === 'C' ? tempC : cToF(tempC));
    var feelsDisplay = feelsC === null || feelsC === undefined ? null : Math.round(state.unit === 'C' ? feelsC : cToF(feelsC));

    var tempBlock =
      '<div class="p-temp-row">' +
      '<div><span class="p-temp" id="quickTemp">' + tempDisplay + '°</span><span class="p-temp-unit" id="unitToggle">' + state.unit + '</span></div>' +
      '<div class="p-cond"><div class="p-cond-icon">' + wInfo[1] + '</div><div class="p-cond-label">' + wInfo[0] + '</div></div>' +
      '</div>' +
      '<div class="p-feels" id="quickFeels">' + (feelsDisplay !== null ? 'Feels like ' + feelsDisplay + '°' + state.unit : '') + '</div>';

    var tabBar = '<div class="panel-tabs">';
    TABS.forEach(function (t, i) {
      tabBar += '<button class="panel-tab-btn' + (i === 0 ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>';
    });
    tabBar += '</div>';

    var tabPanels = '<div id="tabPanelsWrap">';
    TABS.forEach(function (t, i) {
      tabPanels += '<div class="tab-panel' + (i === 0 ? ' active' : '') + '" id="tab-' + t.id + '"></div>';
    });
    tabPanels += '</div>';

    var footer =
      '<div class="p-footer">Weather via Open&#8209;Meteo · Places via OpenStreetMap · City data via Wikipedia &amp; Wikidata · Country data via REST Countries · Quakes via USGS · Holidays via Nager.Date.</div>';

    panelContentEl.innerHTML =
      favBtn + eyebrow + title + coords +
      '<div class="p-divider"></div>' +
      tempBlock +
      tabBar +
      tabPanels +
      footer;

    // Weather tab renders immediately since we already have the data
    renderWeatherTab(document.getElementById('tab-weather'), weatherData, aqiData);

    var favBtnEl = document.getElementById('favToggleBtn');
    if (favBtnEl) {
      favBtnEl.addEventListener('click', function () {
        var nowActive = toggleFavorite(placeName, lat, lon);
        favBtnEl.textContent = nowActive ? '★' : '☆';
        favBtnEl.classList.toggle('active', nowActive);
      });
    }

    var unitToggle = document.getElementById('unitToggle');
    if (unitToggle) {
      unitToggle.addEventListener('click', function () {
        state.unit = state.unit === 'C' ? 'F' : 'C';
        document.getElementById('unitToggle').textContent = state.unit;
        var qt = document.getElementById('quickTemp');
        var qf = document.getElementById('quickFeels');
        if (qt) qt.textContent = (tempC === null || tempC === undefined ? '—' : Math.round(state.unit === 'C' ? tempC : cToF(tempC))) + '°';
        if (qf && feelsC !== null && feelsC !== undefined) qf.textContent = 'Feels like ' + Math.round(state.unit === 'C' ? feelsC : cToF(feelsC)) + '°' + state.unit;
        renderWeatherTab(document.getElementById('tab-weather'), weatherData, aqiData);
      });
    }

    // Tab switching (event delegation, panel is rebuilt per location so rebind each time)
    Array.prototype.forEach.call(panelContentEl.querySelectorAll('.panel-tab-btn'), function (btn) {
      btn.addEventListener('click', function () {
        var tabId = btn.getAttribute('data-tab');
        Array.prototype.forEach.call(panelContentEl.querySelectorAll('.panel-tab-btn'), function (b) { b.classList.remove('active'); });
        Array.prototype.forEach.call(panelContentEl.querySelectorAll('.tab-panel'), function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        var panelDiv = document.getElementById('tab-' + tabId);
        panelDiv.classList.add('active');
        loadTabIfNeeded(tabId, panelDiv, loc);
      });
    });

    openPanel();
  }

  function locationKey(loc) { return loc.lat.toFixed(3) + ',' + loc.lon.toFixed(3); }

  function loadTabIfNeeded(tabId, container, loc) {
    if (tabId === 'weather') return; // already rendered synchronously
    var key = locationKey(loc);
    if (!state.tabCache[key]) state.tabCache[key] = {};
    if (state.tabCache[key][tabId]) {
      container.innerHTML = state.tabCache[key][tabId];
      return;
    }
    container.innerHTML = '<div class="info-loading"><div class="spinner small"></div><span class="loading-text" style="font-size:10px;">Fetching ' + tabId + ' data…</span></div>';

    if (tabId === 'city') loadCityTab(container, loc, key);
    else if (tabId === 'places') loadPlacesTab(container, loc, key);
    else if (tabId === 'food') loadFoodTab(container, loc, key);
    else if (tabId === 'transport') loadTransportTab(container, loc, key);
    else if (tabId === 'more') loadMoreTab(container, loc, key);
  }

  function cacheTab(key, tabId, container) {
    if (!state.tabCache[key]) state.tabCache[key] = {};
    state.tabCache[key][tabId] = container.innerHTML;
  }

  /* ---------------------------------------------------------------------
     Weather tab
     --------------------------------------------------------------------- */

  function renderWeatherTab(container, weatherData, aqiData) {
    if (!container) return;
    var current = weatherData ? weatherData.current : null;
    var hourly = weatherData ? weatherData.hourly : null;
    var daily = weatherData ? weatherData.daily : null;

    var html = '';

    html += '<div class="section-title"><span>Hourly · Next 48h</span><span class="stitch"></span></div>';
    html += renderHourlyStrip(hourly, current && current.time);

    html += '<div class="section-title"><span>15-Day Forecast</span><span class="stitch"></span></div>';
    html += renderDailyList(daily);

    var uvNow = hourly && hourly.uv_index ? hourly.uv_index[0] : null;
    var visNow = hourly && hourly.visibility ? hourly.visibility[0] : null;
    var dewNow = hourly && hourly.dew_point_2m ? hourly.dew_point_2m[0] : null;
    var rainProbToday = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
    var snowToday = daily && daily.snowfall_sum ? daily.snowfall_sum[0] : null;
    var windDir = current ? windCompass(current.wind_direction_10m) : '';

    html += '<div class="section-title"><span>Conditions</span><span class="stitch"></span></div>';
    html += '<div class="stat-grid">' +
      statCard('Humidity', current && current.relative_humidity_2m !== undefined ? Math.round(current.relative_humidity_2m) + '%' : '—') +
      statCard('Wind', current && current.wind_speed_10m !== undefined ? current.wind_speed_10m.toFixed(1) + ' km/h ' + windDir : '—') +
      statCard('Pressure', current && current.surface_pressure !== undefined ? Math.round(current.surface_pressure) + ' hPa' : '—') +
      statCard('Rain Chance', rainProbToday !== null && rainProbToday !== undefined ? rainProbToday + '%' : '—') +
      statCard('UV Index', uvNow !== null && uvNow !== undefined ? uvNow.toFixed(1) : '—') +
      statCard('Visibility', visNow !== null && visNow !== undefined ? (visNow / 1000).toFixed(1) + ' km' : '—') +
      statCard('Cloud Cover', current && current.cloud_cover !== undefined ? Math.round(current.cloud_cover) + '%' : '—') +
      statCard('Dew Point', dewNow !== null && dewNow !== undefined ? Math.round(state.unit === 'C' ? dewNow : cToF(dewNow)) + '°' + state.unit : '—') +
      statCard('Snowfall', snowToday !== null && snowToday !== undefined ? snowToday.toFixed(1) + ' cm' : '0 cm') +
      '</div>';

    var sunrise = daily && daily.sunrise ? daily.sunrise[0] : null;
    var sunset = daily && daily.sunset ? daily.sunset[0] : null;
    var moon = getMoonPhase(new Date());

    html += '<div class="section-title"><span>Sun &amp; Moon</span><span class="stitch"></span></div>';
    html += '<div class="sunmoon-grid">' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">🌅</div><div class="sunmoon-label">Sunrise</div><div class="sunmoon-value">' + formatTimeFromIso(sunrise) + '</div></div>' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">🌇</div><div class="sunmoon-label">Sunset</div><div class="sunmoon-value">' + formatTimeFromIso(sunset) + '</div></div>' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">' + moon.icon + '</div><div class="sunmoon-label">Moon Phase</div><div class="sunmoon-value">' + moon.name + '</div></div>' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">✨</div><div class="sunmoon-label">Illumination</div><div class="sunmoon-value">' + moon.illumination + '%</div></div>' +
      '</div>' +
      '<div class="note-card">Moonrise/moonset times need a dedicated ephemeris service and aren\'t included here — phase &amp; illumination are computed locally.</div>';

    var aqiValue = aqiData && aqiData.us_aqi !== undefined && aqiData.us_aqi !== null ? Math.round(aqiData.us_aqi) : null;
    var aqiCat = aqiValue !== null ? aqiCategory(aqiValue) : null;

    html += '<div class="section-title"><span>Air Quality &amp; Pollen</span><span class="stitch"></span></div>';
    if (aqiValue !== null) {
      var pct = Math.min(100, (aqiValue / 300) * 100);
      html += '<div class="aqi-block">' +
        '<div class="aqi-head"><span class="aqi-label">US AQI</span>' +
        '<div class="aqi-value-wrap"><span class="aqi-value">' + aqiValue + '</span>' +
        '<span class="aqi-tag" style="color:' + aqiCat.color + ';border:1px solid ' + aqiCat.color + '55;background:' + aqiCat.color + '1a;">' + aqiCat.label + '</span></div></div>' +
        '<div class="aqi-bar-track"><div class="aqi-bar-fill" style="width:' + pct + '%; background:' + aqiCat.color + ';"></div></div></div>';
    } else {
      html += '<div class="info-empty">No air quality data for this location.</div>';
    }

    var pollenFields = [
      ['alder_pollen', 'Alder'], ['birch_pollen', 'Birch'], ['grass_pollen', 'Grass'],
      ['mugwort_pollen', 'Mugwort'], ['olive_pollen', 'Olive'], ['ragweed_pollen', 'Ragweed']
    ];
    var pollenCards = '';
    var hasPollen = false;
    pollenFields.forEach(function (p) {
      var v = aqiData ? aqiData[p[0]] : null;
      if (v !== null && v !== undefined) { hasPollen = true; pollenCards += statCard(p[1] + ' Pollen', Math.round(v) + ' gr/m³'); }
    });
    if (hasPollen) {
      html += '<div class="stat-grid" style="margin-top:10px;">' + pollenCards + '</div>';
    } else {
      html += '<div class="note-card">Pollen data is currently only available for parts of Europe via the free Open&#8209;Meteo network — not reported for this location.</div>';
    }

    html += '<div class="section-title"><span>Lightning &amp; Storm Tracking</span><span class="stitch"></span></div>';
    html += '<div class="note-card">Live lightning strikes and storm-cell tracking need a dedicated radar/lightning API (e.g. a paid RainViewer or Tomorrow.io key) — not wired up in this free build.</div>';

    container.innerHTML = html;
  }

  function renderHourlyStrip(hourly, currentTimeIso) {
    if (!hourly || !hourly.time || !hourly.time.length) return '<div class="info-empty">Hourly data unavailable.</div>';
    var startIdx = hourly.time.indexOf(currentTimeIso);
    if (startIdx < 0) startIdx = 0;
    var items = '';
    var end = Math.min(startIdx + 48, hourly.time.length);
    for (var i = startIdx; i < end; i++) {
      var hourLabel = i === startIdx ? 'Now' : formatHourFromIso(hourly.time[i]);
      var wc = hourly.weather_code ? hourly.weather_code[i] : null;
      var info = WEATHER_CODES[wc] || ['', '🌡️'];
      var t = hourly.temperature_2m ? hourly.temperature_2m[i] : null;
      var temp = t === null || t === undefined ? '—' : Math.round(state.unit === 'C' ? t : cToF(t));
      var rain = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
      items += '<div class="hourly-item' + (i === startIdx ? ' is-now' : '') + '">' +
        '<div class="hourly-time">' + hourLabel + '</div>' +
        '<div class="hourly-icon">' + info[1] + '</div>' +
        '<div class="hourly-temp">' + temp + '°</div>' +
        '<div class="hourly-rain">' + (rain !== null && rain !== undefined ? '💧' + rain + '%' : '\u00A0') + '</div>' +
        '</div>';
    }
    return '<div class="hourly-scroll">' + items + '</div>';
  }

  function renderDailyList(daily) {
    if (!daily || !daily.time || !daily.time.length) return '<div class="info-empty">Forecast unavailable.</div>';
    var minAll = Math.min.apply(null, daily.temperature_2m_min);
    var maxAll = Math.max.apply(null, daily.temperature_2m_max);
    var range = Math.max(1, maxAll - minAll);
    var html = '';
    for (var i = 0; i < daily.time.length; i++) {
      var d = new Date(daily.time[i] + 'T12:00:00');
      var dayLabel = i === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
      var wc = daily.weather_code ? daily.weather_code[i] : null;
      var info = WEATHER_CODES[wc] || ['', '🌡️'];
      var tmin = daily.temperature_2m_min[i], tmax = daily.temperature_2m_max[i];
      var tminD = Math.round(state.unit === 'C' ? tmin : cToF(tmin));
      var tmaxD = Math.round(state.unit === 'C' ? tmax : cToF(tmax));
      var leftPct = ((tmin - minAll) / range) * 100;
      var widthPct = Math.max(4, ((tmax - tmin) / range) * 100);
      var rain = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
      html += '<div class="daily-row">' +
        '<div class="daily-day">' + dayLabel + '</div>' +
        '<div class="daily-icon">' + info[1] + '</div>' +
        '<div class="daily-rain">' + (rain !== null && rain !== undefined ? '💧' + rain + '%' : '') + '</div>' +
        '<div class="daily-temps">' +
        '<div class="daily-min">' + tminD + '°</div>' +
        '<div class="daily-bar-track"><div class="daily-bar-fill" style="left:' + leftPct + '%; width:' + widthPct + '%;"></div></div>' +
        '<div class="daily-max">' + tmaxD + '°</div>' +
        '</div></div>';
    }
    return html;
  }

  /* ---------------------------------------------------------------------
     City tab — population, area, elevation, timezone, country, history…
     --------------------------------------------------------------------- */

  function loadCityTab(container, loc, key) {
    var cityQuery = loc.cityQuery;

    Promise.all([
      getWikiSummary(cityQuery),
      getWikidataDetails(cityQuery),
      getCountryInfo(loc.countryCode)
    ]).then(function (results) {
      var summary = results[0], wd = results[1], country = results[2];
      var currencyCode = country && country.currencies ? Object.keys(country.currencies)[0] : null;
      getCurrencyRate(currencyCode).then(function (rate) {
        renderCityTab(container, cityQuery, loc, summary, wd, country, currencyCode, rate);
        cacheTab(key, 'city', container);
      });
    });
  }

  function renderCityTab(container, cityQuery, loc, summary, wd, country, currencyCode, rate) {
    var html = '';

    var img = summary && (summary.originalimage || summary.thumbnail);
    html += '<div class="section-title"><span>City Snapshot</span><span class="stitch"></span></div>';
    html += '<div class="city-hero">';
    if (img && img.source) {
      html += '<img src="' + img.source + '" alt="' + escapeHtml((summary && summary.title) || cityQuery) + '" loading="lazy" />';
    } else {
      html += '<div class="city-hero-fallback">🏙️</div>';
    }
    html += '<div class="city-hero-caption">' + escapeHtml((summary && summary.title) || cityQuery) + '</div></div>';

    if (summary && summary.extract) {
      var extract = summary.extract;
      if (extract.length > 340) extract = extract.slice(0, 340).replace(/\s+\S*$/, '') + '…';
      html += '<div class="city-extract">' + escapeHtml(extract) + '</div>';
    }
    if (wd && wd.nickname) {
      html += '<div class="note-card">Nicknamed <strong>' + escapeHtml(wd.nickname) + '</strong></div>';
    }

    var population = wd ? wd.population : null;
    var areaKm2 = wd ? wd.areaKm2 : null;
    var elevationM = wd ? wd.elevationM : null;
    var density = (population && areaKm2) ? (population / areaKm2) : null;

    html += '<div class="section-title"><span>Population &amp; Geography</span><span class="stitch"></span></div>';
    if (population) {
      html += '<div class="pop-card"><div><div class="pop-label">Population (Wikidata)</div><div class="pop-value">' + formatNumber(population) + '</div></div><div class="pop-icon">👥</div></div>';
    }
    html += '<div class="data-list" style="margin-top:10px;">' +
      dataRow('Area', areaKm2 ? formatNumber(areaKm2) + ' km²' : '—') +
      dataRow('Population Density', density ? formatNumber(density) + ' /km²' : '—') +
      dataRow('Elevation', elevationM !== null && elevationM !== undefined ? formatNumber(elevationM) + ' m' : '—') +
      dataRow('Coordinates', formatCoord(loc.lat, loc.lon)) +
      dataRow('Time Zone', loc.timezone ? loc.timezone + (loc.timezoneAbbr ? ' (' + loc.timezoneAbbr + ')' : '') : '—') +
      dataRow('Local Time', loc.localTime || '—') +
      '</div>';

    html += '<div class="section-title"><span>Country &amp; Region</span><span class="stitch"></span></div>';
    html += '<div class="data-list">' +
      dataRow('Country', (country && country.name && country.name.common) ? escapeHtml(country.name.common) : (loc.countryName || '—')) +
      dataRow('State / Province', loc.adminRegion || '—') +
      dataRow('Capital', country && country.capital ? escapeHtml(country.capital[0]) : '—') +
      dataRow('Region', country && country.region ? escapeHtml(country.region + (country.subregion ? ' · ' + country.subregion : '')) : '—') +
      dataRow('Language(s)', country && country.languages ? escapeHtml(Object.values(country.languages).join(', ')) : '—') +
      dataRow('Currency', currencyCode ? escapeHtml(currencyCode) + (rate ? ' (1 USD ≈ ' + rate.toFixed(2) + ' ' + currencyCode + ')' : '') : '—') +
      dataRow('Calling Code', country && country.idd && country.idd.root ? country.idd.root + (country.idd.suffixes ? country.idd.suffixes[0] : '') : '—') +
      '</div>' +
      '<div class="note-card">Postal codes vary by exact address and aren\'t resolvable from a single map point.</div>';

    html += '<div class="section-title"><span>History</span><span class="stitch"></span></div>';
    var founded = null;
    if (wd && wd.inceptionRaw) {
      var m = /^\+?(-?\d+)-/.exec(wd.inceptionRaw);
      if (m) founded = m[1];
    }
    html += '<div class="data-list">' +
      dataRow('Founded / Established', founded || '—') +
      dataRow('Founder', (wd && wd.founder) ? escapeHtml(wd.founder) : '—') +
      '</div>';
    if (summary && summary.extract) {
      html += '<div class="note-card">A detailed historical timeline isn\'t available from free sources beyond the overview above — see the full Wikipedia article for more.</div>';
    }
    html += '<div class="note-card">GDP and detailed demographic breakdowns require licensed economic datasets and aren\'t included here.</div>';

    if (summary && summary.content_urls && summary.content_urls.desktop && summary.content_urls.desktop.page) {
      html += '<a class="wiki-link" href="' + summary.content_urls.desktop.page + '" target="_blank" rel="noopener noreferrer">Read full article on Wikipedia →</a>';
    }

    container.innerHTML = html;
  }

  function dataRow(label, value) {
    return '<div class="data-row"><span class="data-row-label">' + label + '</span><span class="data-row-value">' + value + '</span></div>';
  }

  function getWikiSummary(title) {
    var url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title);
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
      .catch(function () { return null; });
  }

  function resolveEntityLabel(qid) {
    var url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + qid + '&props=labels&languages=en&format=json&origin=*';
    return fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      var ent = d && d.entities && d.entities[qid];
      return ent && ent.labels && ent.labels.en ? ent.labels.en.value : null;
    }).catch(function () { return null; });
  }

  function getWikidataDetails(query) {
    var searchUrl = 'https://www.wikidata.org/w/api.php?action=wbsearchentities&search=' +
      encodeURIComponent(query) + '&language=en&format=json&origin=*&type=item&limit=1';
    return fetch(searchUrl).then(function (r) { return r.json(); }).then(function (d) {
      var id = d && d.search && d.search[0] && d.search[0].id;
      if (!id) return null;
      var url = 'https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=' + id + '&format=json&origin=*';
      return fetch(url).then(function (r) { return r.json(); }).then(function (cd) {
        var claims = cd && cd.claims;
        if (!claims) return null;
        function num(prop) {
          var c = claims[prop];
          if (!c || !c.length) return null;
          var snak = c[c.length - 1].mainsnak;
          var v = snak && snak.datavalue && snak.datavalue.value;
          return v && v.amount !== undefined ? parseFloat(String(v.amount).replace('+', '')) : null;
        }
        function time(prop) {
          var c = claims[prop];
          if (!c || !c.length) return null;
          var snak = c[0].mainsnak;
          var v = snak && snak.datavalue && snak.datavalue.value;
          return v && v.time ? v.time : null;
        }
        function str(prop) {

  function computeSmartTips(weatherData, aqiData) {
    var tips = [];
    var current = weatherData && weatherData.current;
    var daily = weatherData && weatherData.daily;
    var rainProb = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
    if (rainProb !== null && rainProb !== undefined && rainProb >= 40) {
      tips.push({ icon: '☂️', text: 'Rain probability is ' + rainProb + '% today — worth carrying an umbrella.' });
    }
    var uv = daily && daily.uv_index_max ? daily.uv_index_max[0] : null;
    if (uv !== null && uv !== undefined && uv >= 6) {
      tips.push({ icon: '🧴', text: 'UV index peaks around ' + uv.toFixed(1) + ' — sunscreen and shade are worth it around midday.' });
    }
    var aqiVal = aqiData && aqiData.us_aqi;
    if (aqiVal !== null && aqiVal !== undefined && aqiVal > 100) {
      tips.push({ icon: '😷', text: 'Air quality is elevated (AQI ' + Math.round(aqiVal) + ') — sensitive groups should limit prolonged outdoor exertion.' });
    }
    var wind = current && current.wind_speed_10m;
    if (wind !== null && wind !== undefined && wind >= 30) {
      tips.push({ icon: '💨', text: 'Winds around ' + Math.round(wind) + ' km/h — secure loose items outdoors.' });
    }
    if (daily && daily.sunset && daily.sunset[0]) {
      tips.push({ icon: '📷', text: 'Golden hour falls roughly in the hour before sunset (' + formatTimeFromIso(daily.sunset[0]) + ') — good light for photography.' });
    }
    if (!tips.length) tips.push({ icon: '✅', text: 'Conditions look calm and clear — a good day to be outside.' });
    return tips;
  }

  function getEarthquakes(lat, lon) {
    var end = new Date();
    var start = new Date(end.getTime() - 30 * 86400000);
    var url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=' + lat + '&longitude=' + lon +
      '&maxradiuskm=300&minmagnitude=3&orderby=time&limit=5&starttime=' + start.toISOString().slice(0, 10);
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d || !d.features) return [];
      return d.features.map(function (f) {
        return { mag: f.properties.mag, place: f.properties.place, time: f.properties.time };
      });
    }).catch(function () { return []; });
  }

  function getPublicHolidays(countryCode) {
    if (!countryCode) return Promise.resolve([]);
    var url = 'https://date.nager.at/api/v3/NextPublicHolidays/' + countryCode;
    return fetch(url).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
  }

  function getHistoricalExtremes(lat, lon) {
    var endDate = new Date();
    endDate.setDate(endDate.getDate() - 3);
    var startDate = new Date(endDate);
    startDate.setFullYear(startDate.getFullYear() - 3);
    function fmt(d) { return d.toISOString().slice(0, 10); }
    var url = 'https://archive-api.open-meteo.com/v1/archive?latitude=' + lat + '&longitude=' + lon +
      '&start_date=' + fmt(startDate) + '&end_date=' + fmt(endDate) +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto';
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d || !d.daily || !d.daily.time || !d.daily.time.length) return null;
      var maxT = -Infinity, maxDate = null, minT = Infinity, minDate = null, totalPrecip = 0;
      var rainiestYear = {};
      for (var i = 0; i < d.daily.time.length; i++) {
        var tmax = d.daily.temperature_2m_max[i], tmin = d.daily.temperature_2m_min[i], p = d.daily.precipitation_sum[i] || 0;
        if (tmax !== null && tmax > maxT) { maxT = tmax; maxDate = d.daily.time[i]; }
        if (tmin !== null && tmin < minT) { minT = tmin; minDate = d.daily.time[i]; }
        var year = d.daily.time[i].slice(0, 4);
        rainiestYear[year] = (rainiestYear[year] || 0) + p;
        totalPrecip += p;
      }
      var years = Object.keys(rainiestYear);
      if (!years.length) return null;
      var bestYear = years.reduce(function (a, b) { return rainiestYear[a] > rainiestYear[b] ? a : b; }, years[0]);
      return {
        hottest: { value: maxT, date: maxDate },
        coldest: { value: minT, date: minDate },
        rainiestYear: { year: bestYear, total: rainiestYear[bestYear] },
        avgAnnualPrecip: totalPrecip / years.length,
        rangeStart: fmt(startDate), rangeEnd: fmt(endDate)
      };
    }).catch(function () { return null; });
  }

  /* ---------------------------------------------------------------------
     Data fetching — orchestrates the initial weather + AQI + geocode call
     --------------------------------------------------------------------- */

  function fetchLocationData(lat, lon, presetName, presetInfo) {
    showPanelLoading();

    var weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,cloud_cover,is_day' +
      '&hourly=temperature_2m,precipitation_probability,weather_code,relative_humidity_2m,uv_index,visibility,dew_point_2m,wind_speed_10m,wind_direction_10m,cloud_cover,snowfall' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max,snowfall_sum,wind_speed_10m_max' +
      '&forecast_days=16&timezone=auto';
    var aqiUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon +
      '&current=us_aqi,pm2_5,pm10,european_aqi,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto';
    var geoUrl = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=en';

    var weatherPromise = fetch(weatherUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    var aqiPromise = fetch(aqiUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    var geoPromise = presetName ? Promise.resolve(null) : fetch(geoUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });

    Promise.all([weatherPromise, aqiPromise, geoPromise]).then(function (results) {
      var weatherData = results[0];
      var aqiData = results[1];
      var geoData = results[2];

      if (!weatherData && !aqiData && !presetName && !geoData) {
        showPanelError(lat, lon);
        return;
      }

      var name = presetName;
      var countryCode = presetInfo && presetInfo.countryCode;
      var countryName = presetInfo && presetInfo.countryName;
      var adminRegion = presetInfo && presetInfo.adminRegion;

      if (!name) {
        if (geoData) {
          var city = geoData.city || geoData.locality;
          countryName = geoData.countryName;
          countryCode = geoData.countryCode;
          adminRegion = geoData.principalSubdivision;
          if (city && countryName) name = city + ', ' + countryName;
          else if (countryName) name = countryName;
          else name = 'Open Ocean';
        } else {
          name = 'Unnamed Point';
        }
      }

      var loc = {
        name: name,
        lat: lat,
        lon: lon,
        cityQuery: name.split(',')[0].trim(),
        countryCode: countryCode || null,
        countryName: countryName || null,
        adminRegion: adminRegion || null,
        timezone: weatherData ? weatherData.timezone : null,
        timezoneAbbr: weatherData ? weatherData.timezone_abbreviation : null,
        localTime: (weatherData && weatherData.current && weatherData.current.time) ? weatherData.current.time.replace('T', ' ') : null
      };

      renderPanel(name, lat, lon, weatherData, aqiData ? aqiData.current : null, loc);
    });
  }

  /* ---------------------------------------------------------------------
     Search
     --------------------------------------------------------------------- */

  var searchInput = document.getElementById('searchInput');
  var searchResultsEl = document.getElementById('searchResults');
  var searchDebounce = null;

  searchInput.addEventListener('input', function () {
    var q = searchInput.value.trim();
    clearTimeout(searchDebounce);
    if (q.length < 2) {
      searchResultsEl.classList.add('hidden');
      return;
    }
    searchDebounce = setTimeout(function () { runSearch(q); }, 320);
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchResultsEl.classList.add('hidden');
      searchInput.blur();
    }
  });

  document.addEventListener('click', function (e) {
    if (!searchResultsEl.contains(e.target) && e.target !== searchInput) {
      searchResultsEl.classList.add('hidden');
    }
  });

  function runSearch(query) {
    var url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(query) + '&count=6&language=en&format=json';
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      var results = (data && data.results) || [];
      renderSearchResults(results);
    }).catch(function () {
      searchResultsEl.innerHTML = '<div class="search-result-empty">Search unavailable right now.</div>';
      searchResultsEl.classList.remove('hidden');
    });
  }

  function renderSearchResults(results) {
    if (results.length === 0) {
      searchResultsEl.innerHTML = '<div class="search-result-empty">No matches found.</div>';
      searchResultsEl.classList.remove('hidden');
      return;
    }
    var html = '';
    results.forEach(function (r, i) {
      var label = r.name;
      var region = [r.admin1, r.country].filter(Boolean).join(', ');
      html += '<div class="search-result-item" data-idx="' + i + '"><span>' + escapeHtml(label) + '</span><span class="sr-country">' + escapeHtml(region) + '</span></div>';
    });
    searchResultsEl.innerHTML = html;
    searchResultsEl.classList.remove('hidden');

    Array.prototype.forEach.call(searchResultsEl.querySelectorAll('.search-result-item'), function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var r = results[idx];
        selectSearchResult(r);
      });
    });
  }

  function selectSearchResult(r) {
    searchResultsEl.classList.add('hidden');
    searchInput.value = r.name;
    hideHint();

    var localPoint = latLonToVector3(r.latitude, r.longitude, EARTH_RADIUS);
    placeMarker(localPoint);
    state.rotationTarget = frontRotationFor(localPoint);

    var region = [r.admin1, r.country].filter(Boolean).join(', ');
    var name = region ? r.name + ', ' + region : r.name;
    var presetInfo = { countryCode: r.country_code || null, countryName: r.country || null, adminRegion: r.admin1 || null };
    fetchLocationData(r.latitude, r.longitude, name, presetInfo);
  }

})();

</script>
