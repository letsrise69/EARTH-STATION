<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Earth Station — Live Planet Readout</title>
<meta name="description" content="A cinematic, zoomable 3D Earth with live weather, precipitation radar, air quality, space weather, ISS, aircraft, marine and river data." />
<meta name="theme-color" content="#04060b" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04060b;
    --panel-bg:rgba(9,14,26,0.85);
    --solid-bg:rgba(10,16,30,0.96);
    --glass:rgba(10,17,32,0.72);
    --glass-2:rgba(10,17,32,0.9);
    --overlay:rgba(4,6,11,0.9);
    --card-bg:rgba(255,255,255,0.015);
    --card-bg-2:rgba(255,255,255,0.03);
    --track-bg:rgba(255,255,255,0.06);
    --cyan:#5eead4;
    --cyan-dim:rgba(94,234,212,0.35);
    --amber:#f5a94e;
    --amber-dim:rgba(245,169,78,0.35);
    --violet:#a78bfa;
    --violet-dim:rgba(167,139,250,0.35);
    --rose:#fb7185;
    --rose-dim:rgba(251,113,133,0.35);
    --ink:#e8edf6;
    --mist:#7d8aa3;
    --line:rgba(125,138,163,0.18);
    --line-strong:rgba(125,138,163,0.3);
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --accent:var(--cyan);
    --accent-dim:var(--cyan-dim);
    --glow:0 0 30px rgba(94,234,212,0.12);
    --shadow-card:0 8px 32px rgba(0,0,0,0.4);
  }

  /* ---------- LIGHT / DAY THEME ---------- */
  :root[data-theme="light"]{
    --void:#eef2f8;
    --panel-bg:rgba(255,255,255,0.86);
    --solid-bg:rgba(255,255,255,0.97);
    --glass:rgba(255,255,255,0.72);
    --glass-2:rgba(255,255,255,0.94);
    --overlay:rgba(255,255,255,0.9);
    --card-bg:rgba(20,32,56,0.025);
    --card-bg-2:rgba(20,32,56,0.05);
    --track-bg:rgba(20,32,56,0.08);
    --ink:#0c1424;
    --mist:#5a6884;
    --line:rgba(20,32,56,0.13);
    --line-strong:rgba(20,32,56,0.24);
    --shadow-card:0 8px 32px rgba(20,32,56,0.10);
    --glow:0 0 30px rgba(13,148,136,0.18);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-display);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
    transition:background 0.6s ease, color 0.6s ease;
  }

  /* ============================================================
     BACKGROUND
     ============================================================ */
  #bg-gradient{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, rgba(30,58,95,0.35), transparent 60%),
      radial-gradient(ellipse 120% 100% at 50% 100%, rgba(8,12,22,0.9), var(--void) 70%);
    pointer-events:none;
    z-index:0;
    transition:background 0.8s ease;
  }
  :root[data-theme="light"] #bg-gradient{
    background:
      radial-gradient(ellipse 80% 60% at 50% 36%, rgba(178,206,244,0.60), transparent 62%),
      radial-gradient(ellipse 120% 100% at 50% 100%, rgba(232,239,250,0.95), var(--void) 72%);
  }
  #bg-gradient::before{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 80%, rgba(94,234,212,0.06), transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(245,169,78,0.04), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(167,139,250,0.03), transparent 60%);
    animation:bgShift 20s ease-in-out infinite alternate;
  }
  :root[data-theme="light"] #bg-gradient::before{
    background:
      radial-gradient(circle at 20% 80%, rgba(13,148,136,0.10), transparent 52%),
      radial-gradient(circle at 80% 20%, rgba(217,119,6,0.08), transparent 52%),
      radial-gradient(circle at 50% 50%, rgba(124,58,237,0.05), transparent 62%);
  }
  @keyframes bgShift{
    0%{ opacity:0.6; transform:scale(1); }
    100%{ opacity:1; transform:scale(1.05); }
  }

  /* ============================================================
     CANVAS
     ============================================================ */
  #canvas-container{ position:fixed; inset:0; z-index:1; cursor:grab; }
  #canvas-container.dragging{ cursor:grabbing; }
  #canvas-container canvas{ display:block; touch-action:none; image-rendering:auto; }

  /* ============================================================
     HUD CORNERS
     ============================================================ */
  .hud-corner{
    position:fixed; width:30px; height:30px;
    border:1.5px solid var(--accent-dim);
    z-index:5; pointer-events:none; opacity:0.7;
    transition:all 0.6s cubic-bezier(0.19,1,0.22,1);
  }
  .hud-corner.tl{ top:18px; left:18px; border-right:none; border-bottom:none; border-radius:4px 0 0 0; }
  .hud-corner.tr{ top:18px; right:18px; border-left:none; border-bottom:none; border-radius:0 4px 0 0; }
  .hud-corner.bl{ bottom:18px; left:18px; border-right:none; border-top:none; border-radius:0 0 0 4px; }
  .hud-corner.br{ bottom:18px; right:18px; border-left:none; border-top:none; border-radius:0 0 4px 0; }

  /* ============================================================
     TOP BAR
     ============================================================ */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:22px 36px 0 36px; pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }

  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    color:var(--amber); font-size:22px; line-height:1;
    text-shadow:0 0 20px var(--amber-dim), 0 0 40px rgba(245,169,78,0.1);
    transition:transform 0.6s cubic-bezier(0.19,1,0.22,1);
  }
  .brand:hover .brand-mark{ transform:rotate(90deg) scale(1.1); }
  .brand-text{ display:flex; flex-direction:column; gap:2px; }
  .brand-title{
    font-weight:700; font-size:16px; letter-spacing:0.2em; color:var(--ink);
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .brand-sub{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em;
    color:var(--mist); text-transform:uppercase;
  }

  .controls{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; }

  /* ============================================================
     SEARCH
     ============================================================ */
  .search-wrap{ position:relative; width:250px; }
  #searchInput{
    width:100%; background:var(--glass); border:1px solid var(--line);
    border-radius:12px; padding:11px 38px 11px 16px; color:var(--ink);
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.02em; outline:none;
    backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
    transition:border-color 0.3s, box-shadow 0.3s, background 0.3s;
  }
  #searchInput::placeholder{ color:var(--mist); }
  #searchInput:focus{
    border-color:var(--accent-dim);
    box-shadow:0 0 0 3px rgba(94,234,212,0.08), var(--glow);
    background:var(--glass-2);
  }
  .search-hint-key{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-family:var(--font-mono); font-size:9.5px; color:var(--mist);
    border:1px solid var(--line); padding:1px 6px; border-radius:5px;
    pointer-events:none; opacity:0.7; transition:opacity 0.2s;
  }
  #searchInput:focus ~ .search-hint-key{ opacity:0; }

  .search-results{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:var(--solid-bg); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    max-height:320px; overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(94,234,212,0.05);
    z-index:30; animation:dropIn 0.25s cubic-bezier(0.19,1,0.22,1);
  }
  @keyframes dropIn{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:translateY(0); } }
  .search-results.hidden{ display:none; }
  .search-result-item{
    padding:11px 16px; font-family:var(--font-mono); font-size:12px; color:var(--ink);
    cursor:pointer; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:8px;
    transition:background 0.2s, padding-left 0.2s;
  }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover, .search-result-item.highlighted{
    background:rgba(94,234,212,0.10); padding-left:20px;
  }
  .search-result-item .sr-country{
    color:var(--mist); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:55%; text-align:right;
  }
  .search-result-empty{ padding:14px 16px; font-family:var(--font-mono); font-size:12px; color:var(--mist); }
  .search-section-label{
    padding:10px 16px 4px 16px; font-family:var(--font-mono); font-size:9px;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--mist); opacity:0.6;
  }
  .recent-chip-row{ display:flex; flex-wrap:wrap; gap:6px; padding:6px 16px 14px 16px; }
  .recent-chip{
    font-family:var(--font-mono); font-size:10px; padding:5px 11px; border-radius:20px;
    border:1px solid var(--line); color:var(--mist); background:var(--card-bg-2);
    cursor:pointer; transition:border-color 0.2s, color 0.2s, background 0.2s, transform 0.15s;
  }
  .recent-chip:hover{
    color:var(--ink); border-color:var(--accent-dim);
    background:rgba(94,234,212,0.08); transform:translateY(-1px);
  }

  /* ============================================================
     ICON BUTTONS
     ============================================================ */
  .icon-btn{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    background:var(--glass); border:1px solid var(--line); border-radius:11px;
    color:var(--accent); font-size:14px; cursor:pointer;
    backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
    transition:border-color 0.25s, color 0.25s, transform 0.15s, background 0.25s, box-shadow 0.25s;
    position:relative; overflow:hidden; font-family:var(--font-mono); font-weight:600;
  }
  .icon-btn:hover{ border-color:var(--accent-dim); background:var(--glass-2); box-shadow:var(--glow); }
  .icon-btn:active{ transform:scale(0.93); }
  .icon-btn.active{
    color:var(--accent); border-color:var(--accent-dim);
    background:rgba(94,234,212,0.10); box-shadow:var(--glow);
  }
  .icon-btn.paused{ color:var(--mist); }
  .icon-btn.paused:hover{ color:var(--ink); }
  .icon-btn.loading{ color:var(--amber); border-color:var(--amber-dim); }

  .theme-picker{ display:flex; gap:6px; align-items:center; padding:0 4px; height:38px; }
  .theme-dot{
    width:15px; height:15px; border-radius:50%; cursor:pointer;
    border:2px solid transparent;
    transition:transform 0.2s cubic-bezier(0.19,1,0.22,1), border-color 0.2s, box-shadow 0.2s;
  }
  .theme-dot:hover{ transform:scale(1.25); box-shadow:0 0 12px currentColor; }
  .theme-dot.active{ border-color:var(--ink); box-shadow:0 0 10px currentColor; }

  /* ============================================================
     HINT
     ============================================================ */
  .hint{
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%); z-index:6;
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em;
    color:var(--mist); text-transform:uppercase;
    display:flex; align-items:center; gap:12px;
    transition:opacity 0.8s cubic-bezier(0.19,1,0.22,1);
    pointer-events:none; text-align:center; white-space:nowrap;
  }
  .hint::before, .hint::after{
    content:''; width:28px; height:1px;
    background:linear-gradient(90deg, transparent, var(--line));
  }
  .hint::after{ background:linear-gradient(90deg, var(--line), transparent); }
  .hint.faded{ opacity:0; }

  /* ============================================================
     COORD READOUT
     ============================================================ */
  .coord-readout{
    position:fixed; left:36px; bottom:36px; z-index:6;
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em;
    color:var(--mist); line-height:1.8; pointer-events:none; opacity:0.8;
  }
  .coord-readout .cr-label{ color:var(--accent); opacity:0.9; }

  /* ============================================================
     TOAST
     ============================================================ */
  #toastHost{
    position:fixed; bottom:32px; right:32px; z-index:100;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end; pointer-events:none;
  }
  .toast{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.03em;
    padding:12px 20px; border-radius:12px;
    background:var(--solid-bg); border:1px solid var(--line-strong); color:var(--ink);
    backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3);
    box-shadow:0 16px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(94,234,212,0.05);
    animation:toastIn 0.4s cubic-bezier(0.19,1,0.22,1);
    max-width:360px; display:flex; align-items:center; gap:10px;
  }
  .toast::before{ content:'◆'; font-size:8px; opacity:0.6; flex-shrink:0; }
  .toast.ok{ border-color:rgba(94,234,212,0.35); }
  .toast.ok::before{ color:var(--cyan); }
  .toast.warn{ border-color:rgba(245,169,78,0.4); }
  .toast.warn::before{ color:var(--amber); }
  .toast.err{ border-color:rgba(248,113,113,0.4); }
  .toast.err::before{ color:var(--rose); }
  .toast.fade{ animation:toastOut 0.4s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(40px) scale(0.95); } to{ opacity:1; transform:translateX(0) scale(1); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(40px) scale(0.95); } }

  /* ============================================================
     LOADING
     ============================================================ */
  .loading{
    position:fixed; inset:0; z-index:50; background:var(--void);
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.8s cubic-bezier(0.19,1,0.22,1), visibility 0.8s;
  }
  .loading.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loading-inner{ display:flex; flex-direction:column; align-items:center; gap:24px; width:250px; }
  .loading-brand{
    font-weight:700; font-size:14px; letter-spacing:0.4em; opacity:0.9;
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .spinner{
    width:38px; height:38px; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.2em;
    color:var(--mist); text-transform:uppercase; text-align:center;
  }
  .loading-bar{
    width:100%; height:2px; background:var(--track-bg); border-radius:2px;
    overflow:hidden; position:relative;
  }
  .loading-bar::after{
    content:''; position:absolute; top:0; left:0; height:100%; width:40%;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation:loadingSlide 1.6s ease-in-out infinite;
  }
  @keyframes loadingSlide{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(350%); } }

  /* ============================================================
     PANEL
     ============================================================ */
  .panel{
    position:fixed; top:0; right:0; width:432px; height:100%; z-index:20;
    background:var(--panel-bg); border-left:1px solid var(--line);
    backdrop-filter:blur(28px) saturate(1.3); -webkit-backdrop-filter:blur(28px) saturate(1.3);
    transform:translateX(100%);
    transition:transform 0.5s cubic-bezier(0.19,1,0.22,1), background 0.5s ease;
    overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent;
    box-shadow:-20px 0 60px rgba(0,0,0,0.3);
  }
  .panel::-webkit-scrollbar{ width:6px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .panel.visible{ transform:translateX(0); }

  .panel-close{
    position:absolute; top:20px; right:20px; width:32px; height:32px;
    border:1px solid var(--line); border-radius:9px; background:var(--glass);
    color:var(--mist); font-size:16px; line-height:1; cursor:pointer; z-index:2;
    transition:color 0.2s, border-color 0.2s, transform 0.15s, background 0.2s;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    display:flex; align-items:center; justify-content:center;
  }
  .panel-close:hover{
    color:var(--ink); border-color:var(--accent-dim);
    background:rgba(94,234,212,0.08); transform:scale(1.05);
  }

  .panel-content{ padding:80px 28px 48px 28px; }

  .p-eyebrow{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em;
    color:var(--accent); text-transform:uppercase;
    display:flex; align-items:center; gap:8px; margin-bottom:12px;
  }
  .p-eyebrow .dot{
    width:6px; height:6px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 10px var(--accent), 0 0 20px var(--accent-dim);
    animation:pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(0.8); } }

  .p-title{
    font-weight:700; font-size:24px; line-height:1.2; margin:0 0 8px 0; padding-right:36px;
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .p-coords{ font-family:var(--font-mono); font-size:12px; color:var(--mist); letter-spacing:0.04em; }

  .p-divider{
    height:1px; background:linear-gradient(90deg, transparent, var(--line), transparent);
    margin:24px 0;
  }

  .p-temp-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .p-temp{
    font-family:var(--font-mono); font-weight:700; font-size:56px; line-height:1;
    letter-spacing:-0.02em;
    background:linear-gradient(135deg, var(--ink), var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .p-temp-unit{
    font-size:24px; color:var(--mist); cursor:pointer; user-select:none;
    border-bottom:1px dashed var(--mist); padding-bottom:2px;
    transition:color 0.2s, border-color 0.2s;
  }
  .p-temp-unit:hover{ color:var(--ink); border-color:var(--accent); }
  .p-cond{ text-align:right; }
  .p-cond-icon{ font-size:34px; line-height:1; }
  .p-cond-label{ font-family:var(--font-mono); font-size:11px; color:var(--mist); margin-top:6px; max-width:130px; }
  .p-feels{ font-family:var(--font-mono); font-size:12px; color:var(--mist); margin-top:12px; letter-spacing:0.02em; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:24px; }
  .stat-card{
    border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    background:var(--card-bg);
    transition:border-color 0.25s, background 0.25s, transform 0.2s, box-shadow 0.25s;
  }
  .stat-card:hover{
    border-color:var(--accent-dim); background:rgba(94,234,212,0.05);
    transform:translateY(-2px); box-shadow:var(--shadow-card);
  }
  .stat-label{
    display:flex; align-items:center; gap:6px; font-family:var(--font-mono);
    font-size:9.5px; letter-spacing:0.16em; color:var(--mist);
    text-transform:uppercase; margin-bottom:8px;
  }
  .stat-value{ font-family:var(--font-mono); font-size:19px; font-weight:700; }

  .aqi-block{ margin-top:24px; }
  .aqi-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:12px; }
  .aqi-label{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.16em; color:var(--mist); text-transform:uppercase; }
  .aqi-value-wrap{ display:flex; align-items:baseline; gap:8px; }
  .aqi-value{ font-family:var(--font-mono); font-size:20px; font-weight:700; }
  .aqi-tag{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.05em;
    padding:3px 10px; border-radius:20px; text-transform:uppercase;
  }
  .aqi-bar-track{ height:6px; border-radius:4px; background:var(--track-bg); overflow:hidden; }
  .aqi-bar-fill{ height:100%; border-radius:4px; transition:width 0.8s cubic-bezier(0.19,1,0.22,1); }

  .section-title{
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em;
    color:var(--amber); text-transform:uppercase;
    display:flex; align-items:center; gap:8px; margin:26px 0 14px 0;
  }

     ============================================================ */
  @media (max-width:860px){

    #bg-gradient::before{ animation:none; }
    *{ transition-duration:0.01ms !important; }
  }

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
/* ==========================================================================
   EARTH STATION 3.0
   High-detail globe · day/night terminator · live precipitation radar ·
   real-time aircraft · ISS model · marine / river / aviation data.
   ========================================================================== */
(function () {
  'use strict';

  /* ======================================================================
     0 · CONFIG
     ====================================================================== */
  var EARTH_RADIUS = 5;
  var ROTATE_SPEED = 0.0009;
  var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // High-resolution source textures (CORS-enabled CDNs)
  var TEX = {
    day:    'https://cdn.jsdelivr.net/gh/turban/webgl-earth@master/images/2_no_clouds_4k.jpg',
    night:  'https://unpkg.com/three-globe/example/img/earth-night.jpg',
    bump:   'https://cdn.jsdelivr.net/gh/turban/webgl-earth@master/images/elev_bump_4k.jpg',
    clouds: 'https://cdn.jsdelivr.net/gh/turban/webgl-earth@master/images/fair_clouds_4k.png'
  };
  var TEX_FALLBACK = {
    day:   'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
    night: 'https://unpkg.com/three-globe/example/img/earth-night.jpg',
    bump:  'https://unpkg.com/three-globe/example/img/earth-topology.png',
    clouds:'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'
  };

  var WEATHER_CODES = {
    0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
    45:['Fog','🌫️'],48:['Rime fog','🌫️'],
    51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Dense drizzle','🌧️'],
    56:['Freezing drizzle','🌧️'],57:['Dense freezing drizzle','🌧️'],
    61:['Slight rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],
    66:['Freezing rain','🌧️'],67:['Heavy freezing rain','🌨️'],
    71:['Slight snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow grains','❄️'],
    80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Violent showers','⛈️'],
    85:['Snow showers','🌨️'],86:['Heavy snow showers','❄️'],
    95:['Thunderstorm','⛈️'],96:['Thunderstorm, hail','⛈️'],99:['Severe thunderstorm','⛈️']
  };

  var MOON_NAMES = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  var MOON_ICONS = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];

  var THEMES = {
    cyan:   { accent:'#5eead4', dim:'rgba(94,234,212,0.35)',  light:'#0d9488', lightDim:'rgba(13,148,136,0.32)' },
    amber:  { accent:'#f5a94e', dim:'rgba(245,169,78,0.35)',  light:'#b45309', lightDim:'rgba(180,83,9,0.32)' },
    violet: { accent:'#a78bfa', dim:'rgba(167,139,250,0.35)', light:'#7c3aed', lightDim:'rgba(124,58,237,0.30)' },
    rose:   { accent:'#fb7185', dim:'rgba(251,113,133,0.35)', light:'#e11d48', lightDim:'rgba(225,29,72,0.30)' }
  };

  /* ======================================================================
     1 · SCENE
     ====================================================================== */
  var container = document.getElementById('canvas-container');
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 4000);
  camera.position.set(0, 0, 13.2);

  var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  var baseDPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(baseDPR);
  container.appendChild(renderer.domElement);

  var MAX_ANISO = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 8;

  scene.add(new THREE.AmbientLight(0x3a4a6b, 1.15));

  /* ======================================================================
     2 · LOADING MANAGER
     ====================================================================== */
  var loadManager = new THREE.LoadingManager();
  var loadingTextEl = document.getElementById('loadingText');
  var loadingDone = false;

  loadManager.onProgress = function (url) {
    if (loadingTextEl) {
      var name = url.split('/').pop().split('?')[0];
      loadingTextEl.textContent = 'Loading ' + name.slice(0, 30) + '…';
    }
  };
  loadManager.onLoad = function () { finishLoading(); };
  loadManager.onError = function () {};

  function finishLoading() {
    if (loadingDone) return;
    loadingDone = true;
    var el = document.getElementById('loading');
    if (!el) return;
    el.classList.add('hidden');
    setTimeout(function () { el.style.display = 'none'; }, 900);
  }
  // Safety net — never leave the user stuck on the loading screen
  setTimeout(finishLoading, 12000);

  var textureLoader = new THREE.TextureLoader(loadManager);
  textureLoader.crossOrigin = 'anonymous';

  function loadTex(url, fallback, onLoad) {
    textureLoader.load(url, function (tex) {
      tex.anisotropy = MAX_ANISO;
      tex.minFilter = THREE.LinearMipMapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = true;
      if (onLoad) onLoad(tex);
    }, undefined, function () {
      if (!fallback) return;
      var l2 = new THREE.TextureLoader(loadManager);
      l2.crossOrigin = 'anonymous';
      l2.load(fallback, function (tex) {
        tex.anisotropy = MAX_ANISO;
        tex.minFilter = THREE.LinearMipMapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        if (onLoad) onLoad(tex);
      }, undefined, function () {});
    });
  }

  /* ======================================================================
     3 · MATH HELPERS
     ====================================================================== */
  function latLonToVector3(lat, lon, radius) {
    var phi = (90 - lat) * (Math.PI / 180);
    var theta = (lon + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -(radius * Math.sin(phi) * Math.cos(theta)),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  function vector3ToLatLon(v, radius) {
    var phi = Math.acos(Math.max(-1, Math.min(1, v.y / radius)));
    var theta = Math.atan2(v.z, -v.x);
    var lat = 90 - (phi * 180 / Math.PI);
    var lon = (theta * 180 / Math.PI) - 180;
    if (lon < -180) lon += 360;
    if (lon > 180) lon -= 360;
    return { lat:lat, lon:lon };
  }

  function shortestAngleDiff(a, b) {
    var diff = (b - a) % (Math.PI * 2);
    if (diff > Math.PI) diff -= Math.PI * 2;
    if (diff < -Math.PI) diff += Math.PI * 2;
    return diff;
  }
  function frontRotationFor(p) { return Math.atan2(-p.x, p.z); }

  function getSubsolarPoint(date) {
    var dayMs = 86400000;
    var start = Date.UTC(date.getUTCFullYear(), 0, 0);
    var dayOfYear = Math.floor((date.getTime() - start) / dayMs);
    var hours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
    var decl = -23.44 * Math.cos((2 * Math.PI / 365) * (dayOfYear + 10));
    var B = (2 * Math.PI / 365) * (dayOfYear - 81);
    var eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    var lon = -15 * (hours - 12 + eot / 60);
    while (lon < -180) lon += 360;
    while (lon > 180) lon -= 360;
    return { lat:decl, lon:lon };
  }

  var sunDirection = new THREE.Vector3(1, 0, 0);
  (function () {
    var sub = getSubsolarPoint(new Date());
    sunDirection.copy(latLonToVector3(sub.lat, sub.lon, 1)).normalize();
  })();

  /* ======================================================================
     4 · EARTH (custom shader: day/night + bump + water specular + city lights)
     ====================================================================== */
  function solidTexture(r, g, b) {
    var c = document.createElement('canvas');
    c.width = c.height = 4;
    var ctx = c.getContext('2d');
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fillRect(0, 0, 4, 4);
    return new THREE.CanvasTexture(c);
  }

  var earthUniforms = {
    dayTexture:   { value: solidTexture(12, 32, 62) },
    nightTexture: { value: solidTexture(2, 4, 10) },
    bumpTexture:  { value: solidTexture(128, 128, 128) },
    sunDirection: { value: sunDirection },
    bumpScale:    { value: 2.4 },
    nightBoost:   { value: 1.15 },
    twilightAmt:  { value: 1.0 },
    hasBump:      { value: 0.0 }
  };

  var earthVert = [
    'varying vec2 vUv;',
    'varying vec3 vWorldNormal;',
    'varying vec3 vWorldPos;',
    'void main() {',
    '  vUv = uv;',
    '  vWorldNormal = normalize(mat3(modelMatrix) * normal);',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vWorldPos = wp.xyz;',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n');

  var earthFrag = [
    'uniform sampler2D dayTexture;',
    'uniform sampler2D nightTexture;',
    'uniform sampler2D bumpTexture;',
    'uniform vec3 sunDirection;',
    'uniform float bumpScale;',
    'uniform float nightBoost;',
    'uniform float twilightAmt;',
    'uniform float hasBump;',
    'varying vec2 vUv;',
    'varying vec3 vWorldNormal;',
    'varying vec3 vWorldPos;',
    '',
    'void main() {',
    '  vec3 N = normalize(vWorldNormal);',
    '  vec3 S = normalize(sunDirection);',
    '',
    '  // ---- tangent frame (east / north) on the sphere ----',
    '  vec3 up = abs(N.y) > 0.999 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);',
    '  vec3 T = normalize(cross(up, N));',
    '  vec3 B = normalize(cross(N, T));',
    '',
    '  // ---- terrain normal perturbation from the elevation map ----',
    '  float tx = 1.0 / 4096.0;',
    '  float h  = texture2D(bumpTexture, vUv).r;',
    '  float hL = texture2D(bumpTexture, vUv - vec2(tx, 0.0)).r;',
    '  float hR = texture2D(bumpTexture, vUv + vec2(tx, 0.0)).r;',
    '  float hD = texture2D(bumpTexture, vUv - vec2(0.0, tx)).r;',
    '  float hU = texture2D(bumpTexture, vUv + vec2(0.0, tx)).r;',
    '  vec3 Np = normalize(N - hasBump * bumpScale * ((hR - hL) * T + (hU - hD) * B));',
    '',
    '  vec3 dayCol   = texture2D(dayTexture, vUv).rgb;',
    '  vec3 nightCol = texture2D(nightTexture, vUv).rgb;',
    '',
    '  float cosFlat = dot(N, S);',
    '  float cosPert = dot(Np, S);',
    '',
    '  // ---- day side ----',
    '  float diff = clamp(cosPert, 0.0, 1.0);',
    '  vec3 lit = dayCol * (0.055 + 1.02 * pow(diff, 0.82));',
    '',
    '  // ---- specular sun glint on water ----',
    '  float water = 1.0 - smoothstep(0.03, 0.16, h);',
    '  vec3 V = normalize(cameraPosition - vWorldPos);',
    '  vec3 H = normalize(S + V);',
    '  float spec = pow(max(dot(Np, H), 0.0), 72.0) * water * 0.85;',
    '  lit += vec3(1.0, 0.95, 0.85) * spec * smoothstep(0.0, 0.25, cosFlat);',
    '',
    '  // ---- night side + warm city lights ----',
    '  float cityGlow = pow(max(nightCol.r - 0.045, 0.0), 1.15);',
    '  vec3 nightLit = nightCol * nightBoost;',
    '  nightLit += vec3(1.0, 0.66, 0.28) * cityGlow * 1.35;',
    '  nightLit += vec3(0.02, 0.035, 0.07);',
    '',
    '  float dayMix = smoothstep(-0.14, 0.20, cosFlat);',
    '  vec3 col = mix(nightLit, lit, dayMix);',
    '',
    '  // ---- twilight band ----',
    '  float tw = exp(-pow((cosFlat - 0.0) * 5.4, 2.0));',
    '  col += tw * vec3(0.20, 0.09, 0.05) * twilightAmt;',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  var earthMaterial = new THREE.ShaderMaterial({
    uniforms: earthUniforms,
    vertexShader: earthVert,
    fragmentShader: earthFrag
  });

  loadTex(TEX.day, TEX_FALLBACK.day, function (t) { earthUniforms.dayTexture.value = t; });
  loadTex(TEX.night, TEX_FALLBACK.night, function (t) { earthUniforms.nightTexture.value = t; });
  loadTex(TEX.bump, TEX_FALLBACK.bump, function (t) {
    earthUniforms.bumpTexture.value = t;
    earthUniforms.hasBump.value = 1.0;
  });

  var earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS, 192, 192), earthMaterial);
  earth.rotation.y = -0.4;
  scene.add(earth);

  /* ======================================================================
     5 · CLOUD LAYER
     ====================================================================== */
  var cloudUniforms = {
    map:          { value: null },
    sunDirection: { value: sunDirection },
    opacity:      { value: 0.92 }
  };

  var cloudMat = new THREE.ShaderMaterial({
    uniforms: cloudUniforms,
    vertexShader: [
      'varying vec2 vUv;',
      'varying vec3 vWorldNormal;',
      'void main() {',
      '  vUv = uv;',
      '  vWorldNormal = normalize(mat3(modelMatrix) * normal);',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D map;',
      'uniform vec3 sunDirection;',
      'uniform float opacity;',
      'varying vec2 vUv;',
      'varying vec3 vWorldNormal;',
      'void main() {',
      '  vec4 c = texture2D(map, vUv);',
      '  float lum = dot(c.rgb, vec3(0.3333));',
      '  float a = c.a * smoothstep(0.02, 0.42, lum);',
      '  if (a < 0.004) discard;',
      '  float cosA = dot(normalize(vWorldNormal), normalize(sunDirection));',
      '  float lit = smoothstep(-0.28, 0.32, cosA);',
      '  vec3 warm = vec3(1.0, 0.985, 0.96);',
      '  vec3 shadow = vec3(0.055, 0.075, 0.14);',
      '  vec3 col = mix(shadow, warm, lit);',
      '  gl_FragColor = vec4(col, a * opacity * (0.28 + 0.72 * lit));',
      '}'
    ].join('\n'),
    transparent: true,
    depthWrite: false
  });

  loadTex(TEX.clouds, TEX_FALLBACK.clouds, function (t) { cloudUniforms.map.value = t; });

  var clouds = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.0115, 128, 128), cloudMat);
  scene.add(clouds);

  /* ======================================================================
     6 · ATMOSPHERE — troposphere / stratosphere / exosphere
     ====================================================================== */
  function makeShell(radius, colorHex, power, strength, sunBias, side, blending) {
    var uniforms = {
      glowColor:    { value: new THREE.Color(colorHex) },
      sunDirection: { value: sunDirection },
      power:        { value: power },
      strength:     { value: strength },
      sunBias:      { value: sunBias }
    };
    var mat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: [
        'varying vec3 vWN;',
        'varying vec3 vWP;',
        'void main() {',
        '  vWN = normalize(mat3(modelMatrix) * normal);',
        '  vec4 wp = modelMatrix * vec4(position, 1.0);',
        '  vWP = wp.xyz;',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 glowColor;',
        'uniform vec3 sunDirection;',
        'uniform float power;',
        'uniform float strength;',
        'uniform float sunBias;',
        'varying vec3 vWN;',
        'varying vec3 vWP;',
        'void main() {',
        '  vec3 N = normalize(vWN);',
        '  vec3 V = normalize(cameraPosition - vWP);',
        '  float rim = pow(clamp(1.0 - abs(dot(N, V)), 0.0, 1.0), power);',
        '  float sunFace = smoothstep(-0.5, 0.55 + sunBias, dot(normalize(vWP), normalize(sunDirection)));',
        '  vec3 col = glowColor * (0.18 + 1.05 * sunFace);',
        '  float a = rim * strength;',
        '  gl_FragColor = vec4(col * a, a);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      side: side,
      blending: blending
    });
    return new THREE.Mesh(new THREE.SphereGeometry(radius, 96, 96), mat);
  }

  // Troposphere — dense blue haze hugging the surface
  var troposphere = makeShell(EARTH_RADIUS * 1.006, 0x7dc4ff, 4.2, 0.55, 0.0,
    THREE.BackSide, THREE.AdditiveBlending);
  scene.add(troposphere);

  // Stratosphere — thin violet-blue ozone band
  var stratosphere = makeShell(EARTH_RADIUS * 1.055, 0x8ea6ff, 3.2, 0.42, 0.05,
    THREE.BackSide, THREE.AdditiveBlending);
  scene.add(stratosphere);

  // Exosphere — wide soft halo
  var exosphere = makeShell(EARTH_RADIUS * 1.16, 0x5f9cff, 2.2, 0.30, 0.12,
    THREE.BackSide, THREE.AdditiveBlending);
  scene.add(exosphere);

  /* ======================================================================
     7 · STARFIELD
     ====================================================================== */
  var starMaterial = null;
  (function createStars() {
    var isMobile = window.innerWidth < 860;
    var count = isMobile ? 3200 : 8000;
    var positions = new Float32Array(count * 3);
    var colors = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var r = 300 + Math.random() * 700;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
      var tint = 0.78 + Math.random() * 0.42;
      var warm = Math.random();
      colors[i * 3]     = tint * (warm > 0.85 ? 1.0 : 0.9);
      colors[i * 3 + 1] = tint * 0.94;
      colors[i * 3 + 2] = tint * (warm < 0.15 ? 0.82 : 1.0);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    starMaterial = new THREE.PointsMaterial({
      size: 1.35, sizeAttenuation: true, transparent: true,
      opacity: 0.9, vertexColors: true, depthWrite: false
    });
    scene.add(new THREE.Points(geo, starMaterial));
  })();

  /* ======================================================================
     8 · COORDINATE GRID
     ====================================================================== */
  var gridGroup = new THREE.Group();
  gridGroup.visible = false;
  earth.add(gridGroup);

  (function buildGrid() {
    var lineMat = new THREE.LineBasicMaterial({ color:0x5eead4, transparent:true, opacity:0.20 });
    var eqMat   = new THREE.LineBasicMaterial({ color:0xf5a94e, transparent:true, opacity:0.40 });
    var r = EARTH_RADIUS * 1.004;

    for (var lat = -60; lat <= 60; lat += 30) {
      var pts = [];
      for (var lon = -180; lon <= 180; lon += 4) pts.push(latLonToVector3(lat, lon, r));
      gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lat === 0 ? eqMat : lineMat));
    }
    for (var lon2 = -180; lon2 < 180; lon2 += 30) {
      var pts2 = [];
      for (var la = -85; la <= 85; la += 3) pts2.push(latLonToVector3(la, lon2, r));
      gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2), lon2 === 0 ? eqMat : lineMat));
    }
  })();

  /* ======================================================================
     9 · LIVE PRECIPITATION RADAR (RainViewer)
     ====================================================================== */
  var precipGroup = new THREE.Group();
  precipGroup.visible = false;
  earth.add(precipGroup);

  var precipUniforms = {
    map:     { value: null },
    opacity: { value: 0.9 },
    ready:   { value: 0.0 }
  };

  var precipMat = new THREE.ShaderMaterial({
    uniforms: precipUniforms,
    vertexShader: [
      'varying vec2 vUv;',
      'void main() {',
      '  vUv = uv;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D map;',
      'uniform float opacity;',
      'uniform float ready;',
      'varying vec2 vUv;',
      'void main() {',
      '  if (ready < 0.5) discard;',
      '  // equirectangular -> web-mercator',
      '  float lat = (vUv.y - 0.5) * 3.14159265;',
      '  lat = clamp(lat, -1.4835, 1.4835);',
      '  float mercN = 0.5 - log(tan(0.78539816 + lat * 0.5)) / 6.28318531;',
      '  vec2 muv = vec2(fract(vUv.x), clamp(1.0 - mercN, 0.0, 1.0));',
      '  vec4 c = texture2D(map, muv);',
      '  float a = c.a;',
      '  if (a < 0.03) discard;',
      '  float lum = dot(c.rgb, vec3(0.299, 0.587, 0.114));',
      '  vec3 lightRain = vec3(0.60, 0.88, 1.0);',
      '  vec3 heavyRain = vec3(1.0, 0.82, 0.46);',
      '  vec3 col = mix(lightRain, heavyRain, clamp(lum * 1.5, 0.0, 1.0));',
      '  gl_FragColor = vec4(col, a * opacity * 0.85);',
      '}'
    ].join('\n'),
    transparent: true,
    depthWrite: false
  });

  var precipMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.019, 128, 128), precipMat);
  precipMesh.rotation.y = 0;
  precipGroup.add(precipMesh);

  var radarTimestamp = null;
  var radarCanvas = null;
  var radarLoading = false;

  function loadRadarTile(ts, z, x, y) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      var done = false;
      img.onload = function () { if (!done) { done = true; resolve(img); } };
      img.onerror = function () { if (!done) { done = true; resolve(null); } };
      setTimeout(function () { if (!done) { done = true; resolve(null); } }, 9000);
      img.src = 'https://tilecache.rainviewer.com/v2/radar/' + ts + '/256/' + z + '/' + x + '/' + y + '/2/1_1.png';
    });
  }

  function buildRadarTexture(ts) {
    if (radarLoading) return;
    radarLoading = true;
    var size = 1024;
    var z = 2;
    var n = 1 << z;             // 4 x 4 tiles
    var tile = size / n;        // 256 px each
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    var jobs = [];
    for (var x = 0; x < n; x++) {
      for (var y = 0; y < n; y++) {
        (function (x, y) {
          jobs.push(loadRadarTile(ts, z, x, y).then(function (img) {
            if (img) {
              try { ctx.drawImage(img, x * tile, y * tile, tile, tile); } catch (e) {}
            }
          }));
        })(x, y);
      }
    }
    Promise.all(jobs).then(function () {
      radarLoading = false;
      try {
        var tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = MAX_ANISO;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.wrapS = THREE.RepeatWrapping;
        if (precipUniforms.map.value) precipUniforms.map.value.dispose();
        precipUniforms.map.value = tex;
        precipUniforms.ready.value = 1.0;
        radarCanvas = canvas;
        precipGroup.visible = state.showPrecip;
        if (state.showPrecip) toast('Precipitation radar updated', 'ok', 1600);
      } catch (e) {
        precipUniforms.ready.value = 0.0;
      }
    }).catch(function () { radarLoading = false; });
  }

  function refreshRadar() {
    fetch('https://api.rainviewer.com/public/weather-maps.json')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.radar && d.radar.past && d.radar.past.length) {
          var ts = d.radar.past[d.radar.past.length - 1].time;
          if (ts !== radarTimestamp) {
            radarTimestamp = ts;
            buildRadarTexture(ts);
          }
        }
      })
      .catch(function () {});
  }
  refreshRadar();
  setInterval(refreshRadar, 180000);

  /* ======================================================================
     10 · ISS — a real 3D satellite model
     ====================================================================== */
  function buildISSModel() {
    var g = new THREE.Group();

    var white   = new THREE.MeshPhongMaterial({ color:0xe8eef8, shininess:70, specular:0x9fb4d0 });
    var grey    = new THREE.MeshPhongMaterial({ color:0x9aa7ba, shininess:40, specular:0x66788f });
    var gold    = new THREE.MeshPhongMaterial({ color:0xd9a441, shininess:90, specular:0xffd88a });
    var panel   = new THREE.MeshPhongMaterial({ color:0x13234a, emissive:0x0a1630, shininess:120, specular:0x6f95d8 });
    var panelTr = new THREE.MeshBasicMaterial({ color:0x3c5f9e, wireframe:true, transparent:true, opacity:0.5 });
    var radiator= new THREE.MeshPhongMaterial({ color:0xf2f5fa, shininess:20, side:THREE.DoubleSide });

    // ---- main truss along X ----
    var truss = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.62, 8), grey);
    truss.rotation.z = Math.PI / 2;
    g.add(truss);
    for (var i = -3; i <= 3; i++) {
      var rib = new THREE.Mesh(new THREE.TorusGeometry(0.017, 0.004, 6, 12), grey);
      rib.rotation.y = Math.PI / 2;
      rib.position.x = i * 0.088;
      g.add(rib);
    }

    // ---- pressurised modules (stacked along Y) ----
    var mods = [
      { y: 0.00,  r: 0.032, h: 0.14, m: white },
      { y: 0.10,  r: 0.030, h: 0.10, m: gold  },
      { y: -0.10, r: 0.030, h: 0.10, m: white },
      { y: 0.19,  r: 0.024, h: 0.07, m: grey  },
      { y: -0.19, r: 0.024, h: 0.07, m: grey  }
    ];
    mods.forEach(function (md) {
      var cyl = new THREE.Mesh(new THREE.CylinderGeometry(md.r, md.r, md.h, 14), md.m);
      cyl.position.y = md.y;
      g.add(cyl);
    });

    // docking node
    var node = new THREE.Mesh(new THREE.SphereGeometry(0.030, 12, 10), gold);
    node.position.y = 0.23;
    g.add(node);

    // ---- solar wings: 4 pairs on the truss ----
    function makeWing(sign, offset) {
      var wing = new THREE.Group();
      var pw = 0.20, ph = 0.115, gap = 0.006;
      for (var k = 0; k < 2; k++) {
        var pnl = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, 0.0035), panel);
        pnl.position.set(sign * (pw / 2 + 0.012), 0, (k === 0 ? 1 : -1) * (ph / 2 + gap));
        wing.add(pnl);

        var grid = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), panelTr);
        grid.position.copy(pnl.position);
        grid.position.z += 0.0026;
        grid.rotation.x = 0;
        wing.add(grid);

        var grid2 = grid.clone();
        grid2.position.z -= 0.0052;
        wing.add(grid2);
      }
      // boom
      var boom = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, 0.05, 6), grey);
      boom.rotation.z = Math.PI / 2;
      boom.position.x = sign * 0.026;
      wing.add(boom);
      // rotary joint
      var joint = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.014, 10), grey);
      joint.rotation.x = Math.PI / 2;
      wing.add(joint);

      wing.position.x = offset;
      return wing;
    }

    [-0.24, -0.10, 0.10, 0.24].forEach(function (off, idx) {
      g.add(makeWing(1, off));
      g.add(makeWing(-1, off));
    });

    // ---- radiators ----
    [-1, 1].forEach(function (s) {
      var rad = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.055, 0.002), radiator);
      rad.position.set(0, -0.055, s * 0.055);
      rad.rotation.y = s * 0.28;
      g.add(rad);
    });

    // ---- small antenna dish ----
    var dish = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.45), white);
    dish.rotation.x = Math.PI;
    dish.position.set(0.055, 0.14, 0.02);
    g.add(dish);

    g.scale.setScalar(1.0);
    return g;
  }

  var issGroup = new THREE.Group();
  issGroup.visible = false;
  earth.add(issGroup);

  var issModel = buildISSModel();
  issGroup.add(issModel);

  // soft halo so it pops against the black of space
  var issHalo = new THREE.Mesh(
    new THREE.SphereGeometry(0.30, 16, 16),
    new THREE.MeshBasicMaterial({ color:0xffd166, transparent:true, opacity:0.055, side:THREE.BackSide, depthWrite:false })
  );
  issGroup.add(issHalo);

  var issData = null;

  function updateISSMarker() {
    if (!issData) return;
    var p = latLonToVector3(issData.latitude, issData.longitude, EARTH_RADIUS * 1.045);
    issGroup.position.copy(p);
    var up = p.clone().normalize();
    // Orient: local +Z = local up (nadir axis), local +Y = direction of travel
    var fwd = new THREE.Vector3().crossVectors(up, new THREE.Vector3(0, 1, 0));
    if (fwd.lengthSq() < 0.0001) fwd.set(1, 0, 0);
    fwd.normalize();
    var right = new THREE.Vector3().crossVectors(fwd, up).normalize();
    fwd.crossVectors(up, right).normalize();
    var m = new THREE.Matrix4().makeBasis(right, fwd, up);
    issGroup.quaternion.setFromRotationMatrix(m);
  }

  var issFetchedAt = 0;
  function fetchISS() {
    if (Date.now() - issFetchedAt < 4000) return;
    issFetchedAt = Date.now();
    fetch('https://api.wheretheiss.at/v1/satellites/25544')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || d.latitude === undefined) return;
        issData = d;
        updateISSMarker();
      })
      .catch(function () {});
  }
  setInterval(function () {
    if (state.showISS && !state.paused) fetchISS();
  }, 5000);

  /* ======================================================================
     11 · AIRCRAFT (adsb.lol — free, no key, live positions)
     ====================================================================== */
  var aircraftGroup = new THREE.Group();
  aircraftGroup.visible = false;
  earth.add(aircraftGroup);

  var aircraftMarkers = [];
  var lastFlightFetch = 0;
  var FLIGHT_RADIUS_NM = 250;

  function makePlaneMesh() {
    var s = new THREE.Shape();
    s.moveTo(0, 0.060);
    s.lineTo(0.016, 0.004);
    s.lineTo(0.050, -0.014);
    s.lineTo(0.050, -0.030);
    s.lineTo(0.013, -0.022);
    s.lineTo(0.013, -0.052);
    s.lineTo(0.028, -0.068);
    s.lineTo(0, -0.058);
    s.lineTo(-0.028, -0.068);
    s.lineTo(-0.013, -0.052);
    s.lineTo(-0.013, -0.022);
    s.lineTo(-0.050, -0.030);
    s.lineTo(-0.050, -0.014);
    s.lineTo(-0.016, 0.004);
    s.closePath();
    var geo = new THREE.ShapeGeometry(s);
    var mat = new THREE.MeshBasicMaterial({
      color: 0xffd166, transparent: true, opacity: 0.92,
      side: THREE.DoubleSide, depthWrite: false
    });
    return new THREE.Mesh(geo, mat);
  }

  function clearAircraft() {
    aircraftGroup.children.slice().forEach(function (m) {
      aircraftGroup.remove(m);
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
    });
    aircraftMarkers = [];
  }

  function renderAircraft(list) {
    clearAircraft();
    var shown = 0;
    list.forEach(function (a) {
      if (a.lat === undefined || a.lon === undefined) return;
      if (a.lat === null || a.lon === null) return;
      if (shown >= 200) return;
      shown++;

      var pos = latLonToVector3(a.lat, a.lon, EARTH_RADIUS * 1.035);
      var up = pos.clone().normalize();

      var north = new THREE.Vector3(0, 1, 0).sub(up.clone().multiplyScalar(up.y));
      if (north.lengthSq() < 0.0001) north.set(0, 0, 1);
      north.normalize();
      var east = new THREE.Vector3().crossVectors(north, up).normalize();

      var hdg = (a.track !== undefined && a.track !== null) ? a.track * Math.PI / 180 : 0;
      var dir = north.clone().multiplyScalar(Math.cos(hdg)).add(east.clone().multiplyScalar(Math.sin(hdg))).normalize();

      var right = new THREE.Vector3().crossVectors(dir, up).normalize();
      var mat = new THREE.Matrix4().makeBasis(right, dir, up);

      var mesh = makePlaneMesh();
      mesh.position.copy(pos);
      mesh.quaternion.setFromRotationMatrix(mat);
      var scale = 1.0 + Math.min(1.0, ((a.alt_baro || 0) / 40000)) * 0.35;
      mesh.scale.setScalar(scale);
      aircraftGroup.add(mesh);
      aircraftMarkers.push(mesh);
    });
  }

  function fetchAircraft(silent) {
    if (state.currentLat === null || state.currentLon === null) {
      if (!silent) toast('Tap a location first — aircraft load around it', 'warn', 2800);
      state.showFlights = false;
      aircraftGroup.visible = false;
      var b = document.getElementById('flightToggle');
      if (b) b.classList.remove('active');
      return;
    }
    if (Date.now() - lastFlightFetch < 20000) return;
    lastFlightFetch = Date.now();

    var url = 'https://api.adsb.lol/v2/point/' +
      state.currentLat.toFixed(3) + '/' + state.currentLon.toFixed(3) + '/' + FLIGHT_RADIUS_NM;

    fetch(url)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.ac) {
          if (!silent) toast('No aircraft data returned', 'warn', 2200);
          return;
        }
        renderAircraft(d.ac);
        if (!silent) toast(d.ac.length + ' live aircraft tracked nearby', 'ok', 2000);
      })
      .catch(function () {
        if (!silent) toast('Aircraft feed unreachable — try again shortly', 'err', 2600);
      });
  }

  setInterval(function () {
    if (state.showFlights && !state.paused) fetchAircraft(true);
  }, 25000);

  /* ======================================================================
     12 · LOCATION MARKER
     ====================================================================== */
  var markerGroup = null;
  var markerPlacedAt = 0;

  function clearMarker() {
    if (markerGroup) {
      earth.remove(markerGroup);
      markerGroup.traverse(function (o) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
      markerGroup = null;
    }
  }

  function placeMarker(localPoint) {
    clearMarker();
    var normal = localPoint.clone().normalize();
    var g = new THREE.Group();
    g.position.copy(normal.clone().multiplyScalar(EARTH_RADIUS * 1.006));
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);

    g.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 16, 16),
      new THREE.MeshBasicMaterial({ color:0xf5a94e })
    ));

    var ring = new THREE.Mesh(
      new THREE.RingGeometry(0.14, 0.17, 48),
      new THREE.MeshBasicMaterial({ color:0xf5a94e, transparent:true, opacity:0.9, side:THREE.DoubleSide })
    );
    g.add(ring);
    g.userData.ring = ring;

    g.add(new THREE.Mesh(
      new THREE.RingGeometry(0.088, 0.098, 48),
      new THREE.MeshBasicMaterial({ color:0x5eead4, transparent:true, opacity:0.75, side:THREE.DoubleSide })
    ));

    g.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0.22)]),
      new THREE.LineBasicMaterial({ color:0xf5a94e, transparent:true, opacity:0.5 })
    ));

    earth.add(g);
    markerGroup = g;
    markerPlacedAt = clock.getElapsedTime();
  }

  function updateMarkerPulse() {
    if (!markerGroup || prefersReducedMotion) return;
    var t = (clock.getElapsedTime() - markerPlacedAt) % 1.6;
    var p = t / 1.6;
    var s = 1 + p * 2.2;
    var ring = markerGroup.userData.ring;
    if (ring) {
      ring.scale.set(s, s, s);
      ring.material.opacity = Math.max(0, 0.9 * (1 - p));
    }
  }

  /* ======================================================================
     13 · ORBIT CONTROLS + FLY-TO
     ====================================================================== */
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.minDistance = EARTH_RADIUS * 1.02;   // ~5.1 → real close-up
  controls.maxDistance = 30;
  controls.enablePan = false;
  controls.rotateSpeed = 0.6;
  controls.zoomSpeed = 0.95;
  controls.enableZoom = true;

  var flyState = null;

  function flyTo(lat, lon, distance) {
    var targetRadius = distance || Math.max(EARTH_RADIUS * 1.55, 7.6);
    var localPoint = latLonToVector3(lat, lon, 1);
    var rotY = frontRotationFor(localPoint);

    var startRot = earth.rotation.y;
    var deltaRot = shortestAngleDiff(startRot, rotY);

    var startSph = new THREE.Spherical().setFromVector3(camera.position.clone());
    var targetPhi = Math.acos(Math.max(-1, Math.min(1, localPoint.y)));
    targetPhi = Math.max(0.42, Math.min(Math.PI - 0.42, targetPhi));

    // pick shortest theta path
    var startTheta = startSph.theta;
    var endTheta = 0;
    var dTheta = shortestAngleDiff(startTheta, endTheta);

    flyState = {
      t: 0,
      dur: 1.35,
      startRot: startRot,
      deltaRot: deltaRot,
      r0: startSph.radius,
      r1: targetRadius,
      p0: startSph.phi,
      p1: targetPhi,
      t0: startTheta,
      dt: dTheta
    };
    controls.enabled = false;
    state.rotationTarget = null;
  }

  function updateFly(dt) {
    if (!flyState) return false;
    flyState.t += dt / flyState.dur;
    var k = Math.min(1, flyState.t);
    var e = 1 - Math.pow(1 - k, 3);

    earth.rotation.y = flyState.startRot + flyState.deltaRot * e;

    var sph = new THREE.Spherical(
      flyState.r0 + (flyState.r1 - flyState.r0) * e,
      flyState.p0 + (flyState.p1 - flyState.p0) * e,
      flyState.t0 + flyState.dt * e
    );
    camera.position.setFromSpherical(sph);
    camera.lookAt(0, 0, 0);

    if (k >= 1) {
      flyState = null;
      controls.enabled = true;
      controls.update();
    }
    return true;
  }

  /* ======================================================================
     14 · SOUNDSCAPE
     ====================================================================== */
  var audioCtx = null, soundNodes = null, soundGain = null;

  function initSoundscape() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return; }

    soundGain = audioCtx.createGain();
    soundGain.gain.value = 0;
    soundGain.connect(audioCtx.destination);

    var bufferSize = audioCtx.sampleRate * 2;
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    var rainSource = audioCtx.createBufferSource();
    rainSource.buffer = buffer;
    rainSource.loop = true;
    var rainFilter = audioCtx.createBiquadFilter();
    rainFilter.type = 'bandpass';
    rainFilter.frequency.value = 2400;
    rainFilter.Q.value = 0.6;
    var rainGain = audioCtx.createGain();
    rainGain.gain.value = 0.18;
    rainSource.connect(rainFilter).connect(rainGain).connect(soundGain);
    rainSource.start();

    var windSource = audioCtx.createBufferSource();
    windSource.buffer = buffer;
    windSource.loop = true;
    var windFilter = audioCtx.createBiquadFilter();
    windFilter.type = 'lowpass';
    windFilter.frequency.value = 320;
    var windGain = audioCtx.createGain();
    windGain.gain.value = 0.09;
    windSource.connect(windFilter).connect(windGain).connect(soundGain);
    windSource.start();

    var lfo = audioCtx.createOscillator();
    var lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.15;
    lfoGain.gain.value = 80;
    lfo.connect(lfoGain).connect(windFilter.frequency);
    lfo.start();

    soundNodes = { rainSource:rainSource, windSource:windSource, rainFilter:rainFilter, windFilter:windFilter, rainGain:rainGain, windGain:windGain };
  }

  function toggleSoundscape() {
    if (!audioCtx) initSoundscape();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    state.soundOn = !state.soundOn;
    var btn = document.getElementById('soundToggle');
    if (state.soundOn) {
      soundGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 1.5);
      btn.classList.add('active');
      btn.textContent = '🔊';
      toast('Ambient soundscape on', 'ok', 1600);
    } else {
      soundGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
      btn.classList.remove('active');
      btn.textContent = '🔇';
      toast('Ambient soundscape off', 'ok', 1300);
    }
  }

  function syncSoundscapeToWeather(w) {
    if (!soundNodes || !state.soundOn || !soundNodes.rainFilter) return;
    var rain = w && w.current ? (w.current.precipitation || 0) : 0;
    soundNodes.rainFilter.Q.value = 0.5 + Math.min(2.6, rain * 0.9);
    if (soundNodes.rainGain) {
      soundNodes.rainGain.gain.value = 0.10 + Math.min(0.30, rain * 0.09);
    }
  }

  /* ======================================================================
     15 · STATE
     ====================================================================== */
  var state = {
    autoRotate: !prefersReducedMotion,
    panelOpen: false,
    dragging: false,
    rotationTarget: null,
    unit: 'C',
    currentLocation: null,
    currentLat: null,
    currentLon: null,
    tabCache: {},
    showGrid: false,
    showISS: false,
    showFlights: false,
    showPrecip: false,
    theme: 'dark',
    lastFpsSample: performance.now(),
    frameCount: 0,
    currentDPR: baseDPR,
    paused: false,
    recentSearches: loadRecentSearches(),
    soundOn: false
  };

  var clock = new THREE.Clock();
  var cloudPhase = 0;
  var lastT = performance.now();

  /* ======================================================================
     16 · ANIMATION LOOP
     ====================================================================== */
  function animate() {
    requestAnimationFrame(animate);
    if (state.paused) return;

    var now = performance.now();
    var dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;

    // adaptive resolution
    state.frameCount++;
    if (now - state.lastFpsSample > 1500) {
      var fps = state.frameCount / ((now - state.lastFpsSample) / 1000);
      state.frameCount = 0;
      state.lastFpsSample = now;
      if (fps < 30 && state.currentDPR > 1) {
        state.currentDPR = Math.max(1, state.currentDPR - 0.25);
        renderer.setPixelRatio(state.currentDPR);
      }
    }

    var flying = updateFly(dt);

    if (!flying) {
      if (state.rotationTarget !== null) {
        var diff = shortestAngleDiff(earth.rotation.y, state.rotationTarget);
        if (Math.abs(diff) > 0.002) {
          earth.rotation.y += diff * 0.07;
        } else {
          earth.rotation.y = state.rotationTarget;
          state.rotationTarget = null;
        }
      } else if (state.autoRotate && !state.panelOpen && !state.dragging) {
        earth.rotation.y += ROTATE_SPEED * dt * 60;
      }
      controls.update();
    }

    // clouds drift slightly relative to the surface
    cloudPhase += 0.00016;
    clouds.rotation.y = earth.rotation.y + cloudPhase;

    // sun direction (updated once a minute by the readout timer)

    // ISS tumble + halo breathe
    if (issGroup.visible) {
      issModel.rotation.y += dt * 0.22;
      var breathe = 1 + 0.05 * Math.sin(clock.getElapsedTime() * 2.4);
      issHalo.scale.setScalar(breathe);
      issHalo.material.opacity = 0.045 + 0.02 * Math.sin(clock.getElapsedTime() * 1.8);
    }

    // aircraft blink
    if (aircraftGroup.visible && !prefersReducedMotion) {
      var p = 0.75 + 0.25 * Math.sin(clock.getElapsedTime() * 3.2);
      for (var i = 0; i < aircraftMarkers.length; i++) {
        aircraftMarkers[i].material.opacity = p;
      }
    }

    updateMarkerPulse();
    renderer.render(scene, camera);
  }

  /* ======================================================================
     17 · POINTER INTERACTION
     ====================================================================== */
  var raycaster = new THREE.Raycaster();
  var pointerVec = new THREE.Vector2();
  var downPos = null;
  var lastPointerMove = { x:0, y:0 };

  renderer.domElement.addEventListener('pointerdown', function (e) {
    downPos = { x:e.clientX, y:e.clientY };
    state.dragging = false;
  });

  renderer.domElement.addEventListener('pointermove', function (e) {
    lastPointerMove.x = e.clientX;
    lastPointerMove.y = e.clientY;
    if (downPos) {
      var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > 6) {
        state.dragging = true;
        container.classList.add('dragging');
      }
    }
  });

  window.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    downPos = null;
    container.classList.remove('dragging');
    if (dist < 6) handleTap(e.clientX, e.clientY);
    setTimeout(function () { state.dragging = false; }, 50);
  });

  function handleTap(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    pointerVec.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerVec.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerVec, camera);
    var hits = raycaster.intersectObject(earth, false);
    if (!hits.length) return;
    var localPoint = earth.worldToLocal(hits[0].point.clone());
    var geo = vector3ToLatLon(localPoint, EARTH_RADIUS);
    placeMarker(localPoint);
    hideHint();
    fetchLocationData(geo.lat, geo.lon, null, null);
  }

  renderer.domElement.addEventListener('pointermove', function () {
    if (state.dragging || flyState) return;
    var now = performance.now();
    if (now - (handleTap._lastHover || 0) < 40) return;
    handleTap._lastHover = now;

    var rect = renderer.domElement.getBoundingClientRect();
    pointerVec.x = ((lastPointerMove.x - rect.left) / rect.width) * 2 - 1;
    pointerVec.y = -((lastPointerMove.y - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerVec, camera);
    var hits = raycaster.intersectObject(earth, false);
    if (hits.length) {
      var local = earth.worldToLocal(hits[0].point.clone());
      var geo = vector3ToLatLon(local, EARTH_RADIUS);
      var latEl = document.getElementById('crLat');
      var lonEl = document.getElementById('crLon');
      if (latEl) latEl.textContent = Math.abs(geo.lat).toFixed(2) + '°' + (geo.lat >= 0 ? 'N' : 'S');
      if (lonEl) lonEl.textContent = Math.abs(geo.lon).toFixed(2) + '°' + (geo.lon >= 0 ? 'E' : 'W');
    }
  });

  /* ======================================================================
     21 · FORMATTING HELPERS
     ====================================================================== */
  function formatCoord(lat, lon) {
    return Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S') + '  ' +
           Math.abs(lon).toFixed(2) + '°' + (lon >= 0 ? 'E' : 'W');
  }
  function aqiCategory(aqi) {
    if (aqi <= 50)  return { label:'Good', color:'#4ade80' };
    if (aqi <= 100) return { label:'Moderate', color:'#facc15' };
    if (aqi <= 150) return { label:'Unhealthy (Sensitive)', color:'#fb923c' };
    if (aqi <= 200) return { label:'Unhealthy', color:'#f87171' };
    if (aqi <= 300) return { label:'Very Unhealthy', color:'#c084fc' };
    return { label:'Hazardous', color:'#991b1b' };
  }
  function cToF(c) { return (c * 9 / 5) + 32; }
  function statCard(label, value) {
    return '<div class="stat-card"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
  }
  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str === undefined || str === null ? '' : str;
    return d.innerHTML;
  }
  function formatNumber(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function formatDistance(km) {
    if (km === undefined || km === null || isNaN(km)) return '—';
    return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
  }
  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function formatTimeFromIso(iso) {
    if (!iso) return '—';
    var t = iso.split('T')[1];
    return t ? t.slice(0, 5) : '—';
  }
  function formatHourFromIso(iso) {
    if (!iso) return '';
    var t = iso.split('T')[1];
    return t ? t.slice(0, 2) + ':00' : '';
  }
  function windCompass(deg) {
    if (deg === null || deg === undefined) return '';
    var dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }
  function getMoonPhase(date) {
    var knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
    var synodic = 29.530588853;
    var diffDays = (date.getTime() - knownNewMoon) / 86400000;
    var phase = diffDays % synodic;
    if (phase < 0) phase += synodic;
    var illum = (1 - Math.cos((phase / synodic) * 2 * Math.PI)) / 2;
    var idx = Math.floor((phase / synodic) * 8 + 0.5) % 8;
    return { name:MOON_NAMES[idx], icon:MOON_ICONS[idx], illumination:Math.round(illum * 100) };
  }
  function dataRow(label, value) {
    return '<div class="data-row"><span class="data-row-label">' + label + '</span><span class="data-row-value">' + value + '</span></div>';
  }
  function getAccent() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    return v || '#5eead4';
  }

  /* ======================================================================
     22 · FAVORITES + RECENTS + URL
     ====================================================================== */
  function getFavorites() {
    try { return JSON.parse(localStorage.getItem('earthStationFavorites') || '[]'); }
    catch (e) { return []; }
  }
  function saveFavorites(list) {
    try { localStorage.setItem('earthStationFavorites', JSON.stringify(list)); } catch (e) {}
  }
  function isFavorite(lat, lon) {
    var f = getFavorites();
    for (var i = 0; i < f.length; i++) {
      if (Math.abs(f[i].lat - lat) < 0.01 && Math.abs(f[i].lon - lon) < 0.01) return true;
    }
    return false;
  }
  function toggleFavorite(name, lat, lon) {
    var f = getFavorites();
    var idx = -1;
    for (var i = 0; i < f.length; i++) {
      if (Math.abs(f[i].lat - lat) < 0.01 && Math.abs(f[i].lon - lon) < 0.01) { idx = i; break; }
    }
    if (idx >= 0) f.splice(idx, 1); else f.push({ name:name, lat:lat, lon:lon });
    saveFavorites(f);
    return idx < 0;
  }
  function loadRecentSearches() {
    try { return JSON.parse(localStorage.getItem('earthStationRecent') || '[]'); }
    catch (e) { return []; }
  }
  function saveRecentSearch(entry) {
    var list = state.recentSearches.filter(function (x) {
      return !(Math.abs(x.lat - entry.lat) < 0.01 && Math.abs(x.lon - entry.lon) < 0.01);
    });
    list.unshift(entry);
    list = list.slice(0, 6);
    state.recentSearches = list;
    try { localStorage.setItem('earthStationRecent', JSON.stringify(list)); } catch (e) {}
  }
  function updateHash(lat, lon, name) {
    var hash = '#@' + lat.toFixed(3) + ',' + lon.toFixed(3) + (name ? ',' + encodeURIComponent(name) : '');
    try { history.replaceState(null, '', hash); } catch (e) { location.hash = hash; }
  }
  function parseHash() {
    var h = location.hash;
    if (!h || h.indexOf('#@') !== 0) return null;
    var parts = h.slice(2).split(',');
    if (parts.length < 2) return null;
    var lat = parseFloat(parts[0]), lon = parseFloat(parts[1]);
    if (isNaN(lat) || isNaN(lon)) return null;
    var name = parts.slice(2).join(',') || null;
    try { name = name ? decodeURIComponent(name) : null; } catch (e) {}
    return { lat:lat, lon:lon, name:name };
  }

    else if (tabId === 'places')loadPlacesTab(container, loc, key);
    else if (tabId === 'food')  loadFoodTab(container, loc, key);
