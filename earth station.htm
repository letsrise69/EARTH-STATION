<!DOCTYPE html>
<html lang="en" data-accent="cyan" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Earth Station — Live Planetary Readout</title>
<meta name="description" content="A cinematic, zoomable 3D Earth — live weather, radar, air quality, space weather, ISS, aircraft, quakes, aurora, and a 4D time machine." />
<meta name="theme-color" content="#04060b" id="themeColorMeta" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="preconnect" href="https://geocoding-api.open-meteo.com">
<link rel="preconnect" href="https://earthquake.usgs.gov">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Pre-paint theme restore (no flash) */
(function(){
  try{
    var t = localStorage.getItem('es_theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    var a = localStorage.getItem('es_accent');
    if (a) document.documentElement.setAttribute('data-accent', a);
  }catch(e){}
})();
</script>
<style>
/* ============================================================================
   EARTH STATION — DESIGN SYSTEM
   ============================================================================ */
:root{
  /* Palette — deep space */
  --void:#04060b;
  --void-2:#060a14;
  --glass:rgba(12,18,32,0.68);
  --glass-2:rgba(12,18,32,0.86);
  --glass-3:rgba(16,24,42,0.94);
  --overlay:rgba(4,6,11,0.82);
  --sheet:rgba(10,15,26,0.94);
  /* Hairlines */
  --hairline:rgba(255,255,255,0.06);
  --hairline-2:rgba(255,255,255,0.12);
  --hairline-3:rgba(255,255,255,0.18);
  /* Text */
  --t1:#eef2fa;
  --t2:#8b98b3;
  --t3:#4a5568;
  --t4:#2a3446;
  /* Accent (default cyan) */
  --accent:#5eead4;
  --accent-2:rgba(94,234,212,0.55);
  --accent-3:rgba(94,234,212,0.22);
  --accent-4:rgba(94,234,212,0.10);
  /* Semantic */
  --ok:#4ade80;
  --warn:#facc15;
  --danger:#f87171;
  /* Type */
  --f-display:'Instrument Serif', Georgia, serif;
  --f-ui:'Inter Tight', -apple-system, system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, monospace;
  /* Radii */
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:22px;
  /* Elevation shadows */
  --sh-1:0 1px 2px rgba(0,0,0,0.4);
  --sh-2:0 4px 12px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.4);
  --sh-3:0 12px 32px rgba(0,0,0,0.42), 0 2px 6px rgba(0,0,0,0.4);
  --sh-4:0 24px 60px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.45);
  --sh-5:0 40px 100px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.5);
  /* Motion */
  --ease-out:cubic-bezier(.19,1,.22,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  /* Runtime (set by JS) */
  --rail-bottom:60px;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --safe-left:env(safe-area-inset-left, 0px);
  --safe-right:env(safe-area-inset-right, 0px);
}
[data-accent="amber"]{
  --accent:#f5a94e;
  --accent-2:rgba(245,169,78,0.55);
  --accent-3:rgba(245,169,78,0.22);
  --accent-4:rgba(245,169,78,0.10);
}
[data-accent="violet"]{
  --accent:#a78bfa;
  --accent-2:rgba(167,139,250,0.55);
  --accent-3:rgba(167,139,250,0.22);
  --accent-4:rgba(167,139,250,0.10);
}
[data-accent="rose"]{
  --accent:#fb7185;
  --accent-2:rgba(251,113,133,0.55);
  --accent-3:rgba(251,113,133,0.22);
  --accent-4:rgba(251,113,133,0.10);
}
[data-accent="ion"]{
  --accent:#60a5fa;
  --accent-2:rgba(96,165,250,0.55);
  --accent-3:rgba(96,165,250,0.22);
  --accent-4:rgba(96,165,250,0.10);
}

[data-theme="light"]{
  --void:#e8eef7;
  --void-2:#dde5f0;
  --glass:rgba(255,255,255,0.72);
  --glass-2:rgba(255,255,255,0.88);
  --glass-3:rgba(255,255,255,0.96);
  --overlay:rgba(240,245,252,0.86);
  --sheet:rgba(255,255,255,0.97);
  --hairline:rgba(20,32,56,0.08);
  --hairline-2:rgba(20,32,56,0.14);
  --hairline-3:rgba(20,32,56,0.22);
  --t1:#0a1428;
  --t2:#4a5878;
  --t3:#7a86a0;
  --t4:#b8c2d4;
  --sh-1:0 1px 2px rgba(20,32,56,0.06);
  --sh-2:0 4px 12px rgba(20,32,56,0.08), 0 1px 2px rgba(20,32,56,0.06);
  --sh-3:0 12px 32px rgba(20,32,56,0.10), 0 2px 6px rgba(20,32,56,0.06);
  --sh-4:0 24px 60px rgba(20,32,56,0.12), 0 4px 12px rgba(20,32,56,0.08);
  --sh-5:0 40px 100px rgba(20,32,56,0.14), 0 8px 24px rgba(20,32,56,0.08);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{
  height:100%;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  height:100%;
  min-height:100dvh;
  background:var(--void);
  color:var(--t1);
  font-family:var(--f-ui);
  font-size:14px;
  line-height:1.5;
  letter-spacing:-0.01em;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .8s var(--ease-in-out), color .8s var(--ease-in-out);
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit;text-decoration:none}

::selection{background:var(--accent-3);color:var(--t1)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hairline-2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--hairline-3)}

/* ============================================================================
   BACKGROUND — 4-layer nebula
   ============================================================================ */
#bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 50% 22%, rgba(30,58,110,0.30), transparent 62%),
    radial-gradient(ellipse 70% 50% at 20% 80%, rgba(80,32,140,0.16), transparent 60%),
    radial-gradient(ellipse 80% 60% at 85% 70%, rgba(150,90,30,0.10), transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 110%, var(--void-2), var(--void) 70%);
  transition:background 1s var(--ease-in-out);
}
[data-theme="light"] #bg{
  background:
    radial-gradient(ellipse 90% 60% at 50% 22%, rgba(140,180,240,0.45), transparent 62%),
    radial-gradient(ellipse 70% 50% at 20% 80%, rgba(200,180,240,0.25), transparent 60%),
    radial-gradient(ellipse 80% 60% at 85% 70%, rgba(240,200,140,0.20), transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 110%, var(--void-2), var(--void) 70%);
}
#bg::after{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 15% 25%, rgba(255,255,255,0.3) 0.5px, transparent 1px),
    radial-gradient(circle at 78% 42%, rgba(255,255,255,0.22) 0.5px, transparent 1px),
    radial-gradient(circle at 45% 88%, rgba(255,255,255,0.18) 0.5px, transparent 1px);
  background-size:200px 200px, 350px 350px, 500px 500px;
  opacity:.4;
  animation:grain 60s linear infinite;
}
@keyframes grain{to{background-position:200px 200px, -350px 350px, 500px -500px}}

/* ============================================================================
   CANVAS
   ============================================================================ */
#canvas{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
#canvas.grabbing{cursor:grabbing}
#canvas canvas{display:block;touch-action:none;outline:none}

/* ============================================================================
   HUD CORNER BRACKETS
   ============================================================================ */
.bracket{
  position:fixed;width:36px;height:36px;z-index:5;pointer-events:none;
  opacity:.55;transition:opacity .5s var(--ease-out)
}
.bracket path{stroke:var(--accent);stroke-width:1.25;fill:none;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.bracket.drawn path{stroke-dashoffset:0;transition:stroke-dashoffset .8s var(--ease-out)}
.bracket.tl{top:calc(20px + var(--safe-top));left:calc(20px + var(--safe-left))}
.bracket.tr{top:calc(20px + var(--safe-top));right:calc(20px + var(--safe-right))}
.bracket.bl{bottom:calc(20px + var(--safe-bottom));left:calc(20px + var(--safe-left))}
.bracket.br{bottom:calc(20px + var(--safe-bottom));right:calc(20px + var(--safe-right))}
body.idle .bracket{opacity:.18;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.18}50%{opacity:.26}}

/* ============================================================================
   TOP RAIL
   ============================================================================ */
.toprail{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding-top:var(--safe-top);
  height:calc(60px + var(--safe-top));
  display:flex;align-items:center;justify-content:space-between;
  padding-left:calc(24px + var(--safe-left));
  padding-right:calc(24px + var(--safe-right));
  gap:16px;
  background:linear-gradient(180deg, var(--glass-2) 0%, var(--glass) 100%);
  backdrop-filter:blur(28px) saturate(1.4) brightness(1.05);
  -webkit-backdrop-filter:blur(28px) saturate(1.4) brightness(1.05);
  border-bottom:1px solid var(--hairline);
  box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.24);
  transform:translateY(-12px);opacity:0;
  transition:transform .8s var(--ease-out), opacity .8s var(--ease-out);
}
.toprail.in{transform:none;opacity:1}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0}
.brand-sigil{
  width:26px;height:26px;flex:0 0 auto;
  position:relative;
  animation:spinSigil 40s linear infinite;
}
@keyframes spinSigil{to{transform:rotate(360deg)}}
.brand-sigil svg{display:block;width:100%;height:100%}
.brand-sigil svg circle,.brand-sigil svg ellipse{fill:none;stroke:var(--accent);stroke-width:.9;opacity:.85}
.brand-sigil svg .dot{fill:var(--accent);opacity:1;filter:drop-shadow(0 0 4px var(--accent))}
.brand-text{display:flex;flex-direction:column;gap:1px;line-height:1;min-width:0}
.brand-title{
  font-family:var(--f-display);font-size:19px;font-weight:400;
  letter-spacing:.01em;color:var(--t1);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-sub{
  font-family:var(--f-mono);font-size:8.5px;font-weight:500;
  letter-spacing:.28em;color:var(--t2);text-transform:uppercase;opacity:.7;
  white-space:nowrap;
}

/* Center command bar */
.cmdbar{
  flex:1 1 auto;max-width:480px;margin:0 16px;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.025);
  border:1px solid var(--hairline);
  border-radius:12px;
  padding:0 12px;height:38px;
  transition:border-color .25s, background .25s, box-shadow .25s;
}
.cmdbar:focus-within{
  border-color:var(--accent-2);
  background:rgba(255,255,255,0.04);
  box-shadow:0 0 0 3px var(--accent-4), 0 0 24px var(--accent-4);
}
.cmdbar svg{flex:0 0 auto;opacity:.6;color:var(--t2)}
.cmdbar input{
  flex:1;height:100%;min-width:0;font-family:var(--f-mono);font-size:12px;
  color:var(--t1);background:none;border:none;outline:none;
  letter-spacing:0.005em;
  -webkit-appearance:none;appearance:none;
}
.cmdbar input::placeholder{color:var(--t3)}
.cmdbar .kbd{
  font-family:var(--f-mono);font-size:9.5px;font-weight:600;
  padding:3px 7px;border-radius:6px;color:var(--t2);
  border:1px solid var(--hairline-2);background:rgba(255,255,255,0.03);
  letter-spacing:.05em;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:3px;flex:0 0 auto;
}
.cmdbar .kbd:hover{color:var(--t1);border-color:var(--hairline-3);background:rgba(255,255,255,0.06)}

/* Right cluster */
.rail-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.rail-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);position:relative;
  border:1px solid transparent;
  transition:color .2s, background .2s, border-color .2s, transform .2s var(--ease-spring);
}
.rail-icon:hover{color:var(--t1);background:rgba(255,255,255,0.04);border-color:var(--hairline);transform:translateY(-1px) scale(1.02)}
.rail-icon:active{transform:scale(.94)}
.rail-icon.on{color:var(--accent);background:var(--accent-4);border-color:var(--accent-3)}
.rail-icon svg{width:16px;height:16px}

/* Accent dots */
.accent-cluster{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:10px;
  border:1px solid var(--hairline);background:rgba(255,255,255,0.02);
}
.accent-dot{
  width:12px;height:12px;border-radius:50%;
  cursor:pointer;position:relative;
  transition:transform .25s var(--ease-spring), box-shadow .25s;
  border:2px solid transparent;
}
.accent-dot:hover{transform:scale(1.35)}
.accent-dot.on{border-color:var(--t1);box-shadow:0 0 10px currentColor}
.accent-dot.cyan{background:#5eead4;color:#5eead4}
.accent-dot.amber{background:#f5a94e;color:#f5a94e}
.accent-dot.violet{background:#a78bfa;color:#a78bfa}
.accent-dot.rose{background:#fb7185;color:#fb7185}
.accent-dot.ion{background:#60a5fa;color:#60a5fa}

/* ============================================================================
   SEARCH DROPDOWN
   ============================================================================ */
.search-pop{
  position:fixed;z-index:25;
  top:calc(var(--rail-bottom) + 8px);left:50%;
  transform:translateX(-50%) translateY(-6px);
  width:min(480px, calc(100vw - 32px));
  background:var(--sheet);
  border:1px solid var(--hairline-2);
  border-radius:14px;
  box-shadow:var(--sh-4);
  backdrop-filter:blur(28px) saturate(1.5);
  -webkit-backdrop-filter:blur(28px) saturate(1.5);
  overflow:hidden;max-height:min(440px, 60dvh);overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .25s var(--ease-out), transform .25s var(--ease-out), visibility .25s;
}
.search-pop.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.search-item{
  padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  cursor:pointer;border-bottom:1px solid var(--hairline);
  transition:background .15s, padding .2s;
  animation:itemIn .3s var(--ease-out) backwards;
  min-height:48px;
}
@keyframes itemIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.search-item:last-child{border-bottom:none}
.search-item:hover,.search-item.hl{background:var(--accent-4);padding-left:20px}
.search-item:active{background:var(--accent-4)}
.search-item-name{font-size:13.5px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-item-region{font-family:var(--f-mono);font-size:10.5px;color:var(--t2);text-align:right;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.search-empty{padding:20px 16px;font-family:var(--f-mono);font-size:11px;color:var(--t2);text-align:center}
.search-label{padding:12px 16px 6px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--t3)}
.search-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 16px}
.search-chip{
  font-family:var(--f-mono);font-size:11px;padding:8px 13px;
  border-radius:20px;border:1px solid var(--hairline-2);
  color:var(--t2);background:rgba(255,255,255,0.02);cursor:pointer;
  transition:all .2s;letter-spacing:.03em;
  min-height:34px;display:inline-flex;align-items:center;
}
.search-chip:hover{color:var(--t1);border-color:var(--accent-2);background:var(--accent-4);transform:translateY(-1px)}
.search-chip:active{transform:scale(.96)}

/* ============================================================================
   LAYER STACK (left edge)
   ============================================================================ */
.layerstack{
  position:fixed;
  left:calc(20px + var(--safe-left));
  top:50%;transform:translateY(-50%) translateX(-12px);
  z-index:8;display:flex;flex-direction:column;gap:8px;
  width:200px;
  opacity:0;pointer-events:none;
  transition:opacity .6s var(--ease-out), transform .6s var(--ease-out);
}
.layerstack.in{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
.layerstack.idle{opacity:.35}
.layer-card{
  position:relative;
  background:var(--glass-2);
  border:1px solid var(--hairline);
  border-radius:12px;
  padding:10px 12px;
  display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  cursor:pointer;
  transition:all .25s var(--ease-out);
  box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,0.05);
  overflow:hidden;
}
.layer-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--accent);opacity:0;transition:opacity .25s;
}
.layer-card:hover{border-color:var(--hairline-2);transform:translateX(2px);box-shadow:var(--sh-3), inset 0 1px 0 rgba(255,255,255,0.06)}
.layer-card.on{border-color:var(--accent-3);background:var(--accent-4)}
.layer-card.on::before{opacity:1}
.layer-card:active{transform:scale(.97)}
.layer-icon{
  width:26px;height:26px;flex:0 0 auto;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.04);color:var(--t2);
  transition:color .25s, background .25s;
}
.layer-card.on .layer-icon{color:var(--accent);background:var(--accent-4)}
.layer-icon svg{width:13px;height:13px}
.layer-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.layer-label{font-size:11.5px;font-weight:500;color:var(--t1);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-stat{font-family:var(--f-mono);font-size:9.5px;color:var(--t2);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-spark{
  width:32px;height:14px;flex:0 0 auto;color:var(--accent);
  opacity:.6;transition:opacity .25s;
}
.layer-card.on .layer-spark{opacity:1}
.layer-spark svg{display:block;width:100%;height:100%}
.layer-spark polyline{fill:none;stroke:currentColor;stroke-width:1;stroke-linejoin:round}
.layer-spark polygon{fill:currentColor;opacity:.15}
.layer-toggle{
  width:6px;height:6px;border-radius:50%;background:var(--t3);flex:0 0 auto;
  transition:background .25s, box-shadow .25s;
}
.layer-card.on .layer-toggle{background:var(--accent);box-shadow:0 0 8px var(--accent-2)}

/* ============================================================================
   RIGHT PANEL / MOBILE SHEET
   ============================================================================ */
.panel{
  position:fixed;top:0;right:0;bottom:0;z-index:20;
  width:480px;max-width:100%;
  background:var(--sheet);
  border-left:1px solid var(--hairline);
  box-shadow:var(--sh-5);
  backdrop-filter:blur(28px) saturate(1.4);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);
  transform:translateX(24px);
  opacity:0;pointer-events:none;
  transition:transform .55s var(--ease-out), opacity .35s var(--ease-out);
  overflow:hidden;display:flex;flex-direction:column;
}
.panel.on{transform:none;opacity:1;pointer-events:auto}
.panel-grabber{display:none}
.panel-head{
  padding:calc(76px + var(--safe-top)) 26px 0;
  flex:0 0 auto;position:relative;
}
.panel-close{
  position:absolute;top:calc(20px + var(--safe-top));right:20px;
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);background:rgba(255,255,255,0.03);
  border:1px solid var(--hairline);
  transition:all .2s;
}
.panel-close:hover{color:var(--t1);background:rgba(255,255,255,0.06);border-color:var(--hairline-2);transform:scale(1.05)}
.panel-close:active{transform:scale(.9)}
.panel-fav{
  position:absolute;top:calc(20px + var(--safe-top));left:26px;
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);font-size:14px;
  border:1px solid var(--hairline);
  transition:all .25s var(--ease-spring);
}
.panel-fav:hover{transform:scale(1.1);color:var(--accent);border-color:var(--accent-2)}
.panel-fav:active{transform:scale(.9)}
.panel-fav.on{color:var(--accent);border-color:var(--accent);background:var(--accent-4);box-shadow:0 0 14px var(--accent-3)}
.panel-eyebrow{
  font-family:var(--f-mono);font-size:9px;font-weight:500;
  letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
  display:flex;align-items:center;gap:8px;margin-bottom:14px;opacity:.85;
}
.panel-eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulseDot 2.4s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.panel-title{
  font-family:var(--f-display);font-size:40px;font-weight:400;
  line-height:1.05;color:var(--t1);letter-spacing:-.015em;
  padding-right:44px;
  font-style:italic;
  overflow-wrap:anywhere;
}
.panel-coords{
  font-family:var(--f-mono);font-size:11px;color:var(--t2);
  letter-spacing:.06em;margin-top:10px;font-weight:500;
}
.panel-hero{
  margin-top:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
}
.panel-temp{
  font-family:var(--f-mono);font-weight:700;font-size:72px;line-height:.88;
  color:var(--t1);letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:2px;
}
.panel-temp .unit{
  font-size:22px;font-weight:500;color:var(--accent);
  cursor:pointer;padding:4px 8px;border-radius:8px;
  transition:background .2s;
}
.panel-temp .unit:hover{background:var(--accent-4)}
.panel-hero-right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.panel-hero-icon{font-size:36px;line-height:1}
.panel-hero-cond{
  font-family:var(--f-mono);font-size:10.5px;color:var(--t2);
  letter-spacing:.05em;text-transform:uppercase;max-width:150px;text-align:right
}
.panel-feels{
  font-family:var(--f-mono);font-size:11px;color:var(--t2);
  margin-top:14px;letter-spacing:.02em;
}

/* Tabs */
.panel-tabs{
  display:flex;gap:4px;overflow-x:auto;
  padding:22px 26px 0;
  scrollbar-width:none;
  border-bottom:1px solid var(--hairline);
  flex:0 0 auto;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}
.panel-tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex:0 0 auto;padding:9px 14px 13px;
  font-family:var(--f-mono);font-size:10px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--t2);
  position:relative;transition:color .25s;
  white-space:nowrap;scroll-snap-align:start;
}
.tab-btn:hover{color:var(--t1)}
.tab-btn.on{color:var(--accent)}
.tab-btn.on::after{
  content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:1.5px;
  background:var(--accent);border-radius:2px;
  box-shadow:0 0 12px var(--accent), 0 0 4px var(--accent);
  animation:tabUnderline .3s var(--ease-out);
}
@keyframes tabUnderline{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.panel-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:22px 26px calc(60px + var(--safe-bottom));
  scrollbar-width:thin;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

/* ============================================================================
   PANEL CONTENT BLOCKS
   ============================================================================ */
.sec{
  margin-bottom:30px;
  animation:secIn .4s var(--ease-out) backwards;
}
.sec:nth-child(1){animation-delay:0s}
.sec:nth-child(2){animation-delay:.04s}
.sec:nth-child(3){animation-delay:.08s}
.sec:nth-child(4){animation-delay:.12s}
.sec:nth-child(5){animation-delay:.16s}
.sec:nth-child(6){animation-delay:.2s}
@keyframes secIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-label{
  font-family:var(--f-mono);font-size:9px;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;color:var(--accent);
  opacity:.75;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.sec-label::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg, var(--hairline-2), transparent);
}
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--hairline);
}
.row:last-child{border-bottom:none}
.row-l{font-family:var(--f-mono);font-size:10.5px;color:var(--t2);letter-spacing:.02em;flex:0 1 auto;min-width:0}
.row-v{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--t1);letter-spacing:-.005em;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row-v.accent{color:var(--accent)}
.row-v.dim{color:var(--t2);font-weight:500}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{
  padding:12px 14px;border:1px solid var(--hairline);border-radius:12px;
  background:rgba(255,255,255,0.015);
  transition:all .25s var(--ease-out);
  min-width:0;
}
.stat:hover{border-color:var(--accent-3);background:var(--accent-4);transform:translateY(-2px)}
.stat-label{
  font-family:var(--f-mono);font-size:8.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--t2);
  margin-bottom:8px;opacity:.85;
}
.stat-v{font-family:var(--f-mono);font-size:17px;font-weight:600;color:var(--t1);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-v.accent{color:var(--accent)}

/* Nowcast */
.nowcast{
  padding:16px;border:1px solid var(--hairline);border-radius:14px;
  background:linear-gradient(180deg, var(--accent-4), transparent 60%);
}
.nowcast-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.nowcast-title{font-family:var(--f-mono);font-size:10px;color:var(--t2);letter-spacing:.05em;text-transform:uppercase}
.nowcast-amount{font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
.nowcast-bars{display:flex;align-items:flex-end;gap:3px;height:52px}
.nowcast-bar{
  flex:1;min-height:2px;border-radius:2px 2px 0 0;
  background:linear-gradient(180deg, var(--accent), var(--accent-3));
  transition:height .6s var(--ease-out);
}
.nowcast-legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--t2);margin-top:8px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}

/* Chart */
.chart{
  border:1px solid var(--hairline);border-radius:14px;padding:16px;
  background:rgba(255,255,255,0.015);
}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.chart-title{font-family:var(--f-mono);font-size:10px;color:var(--t2);letter-spacing:.05em;text-transform:uppercase}
.chart-peak{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--t1)}
.chart svg{display:block;width:100%;height:80px}
.chart-legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9.5px;color:var(--t2);margin-top:6px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}

/* Hourly */
.hourly{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.hourly::-webkit-scrollbar{height:4px}
.hourly::-webkit-scrollbar-thumb{background:var(--hairline-2);border-radius:3px}
.hour-card{
  flex:0 0 auto;width:62px;padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border:1px solid var(--hairline);border-radius:12px;
  background:rgba(255,255,255,0.015);
  transition:all .25s var(--ease-out);
  scroll-snap-align:start;
}
.hour-card:hover{border-color:var(--accent-3);transform:translateY(-2px)}
.hour-card.now{border-color:var(--accent-2);background:var(--accent-4);box-shadow:0 0 20px var(--accent-4)}
.hour-t{font-family:var(--f-mono);font-size:9px;color:var(--t2);letter-spacing:.05em;text-transform:uppercase}
.hour-i{font-size:18px;line-height:1}
.hour-v{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.hour-r{font-family:var(--f-mono);font-size:8.5px;color:var(--accent);letter-spacing:.02em}

/* Daily */
.daily-row{
  display:flex;align-items:center;gap:12px;padding:11px 4px;
  border-bottom:1px solid var(--hairline);
  transition:background .2s;
}
.daily-row:hover{background:rgba(255,255,255,0.02)}
.daily-row:last-child{border-bottom:none}
.daily-day{width:64px;flex:0 0 auto;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--t2);letter-spacing:.03em;text-transform:uppercase}
.daily-i{width:22px;text-align:center;font-size:15px;flex:0 0 auto}
.daily-r{width:38px;flex:0 0 auto;font-family:var(--f-mono);font-size:9.5px;color:var(--accent);text-align:right;letter-spacing:.02em}
.daily-temps{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.daily-min{width:26px;flex:0 0 auto;font-family:var(--f-mono);font-size:11px;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.daily-track{flex:1;height:3px;border-radius:3px;background:var(--hairline);position:relative;overflow:hidden}
.daily-fill{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg, var(--accent), var(--warn))}
.daily-max{width:26px;flex:0 0 auto;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}

/* AQI block */
.aqi{margin-top:4px}
.aqi-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.aqi-label{font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--t2)}
.aqi-val{font-family:var(--f-mono);font-size:20px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.aqi-tag{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-left:8px}
.aqi-track{height:5px;background:var(--hairline);border-radius:3px;overflow:hidden}
.aqi-fill{height:100%;border-radius:3px;transition:width 1s var(--ease-out)}

/* Sun arc */
.sunarc-wrap{padding:16px;border:1px solid var(--hairline);border-radius:14px;background:rgba(255,255,255,0.015)}
.sunarc-wrap svg{display:block;width:100%;height:80px}
.sunarc-times{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--t2);margin-top:6px;letter-spacing:.04em;text-transform:uppercase;gap:8px}
.sunarc-times strong{color:var(--t1);font-weight:600}

/* Compass */
.compass{
  display:flex;gap:16px;align-items:center;
  padding:14px;border:1px solid var(--hairline);border-radius:14px;
  background:rgba(255,255,255,0.015);
}
.compass svg{width:78px;height:78px;flex:0 0 auto}
.compass-v{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.compass-v small{font-size:10.5px;font-weight:500;color:var(--t2);margin-left:3px}
.compass-l{font-family:var(--f-mono);font-size:10.5px;color:var(--t2);margin-top:6px;letter-spacing:.03em}
.compass-g{font-family:var(--f-mono);font-size:10px;color:var(--t2);margin-top:4px;opacity:.85}

/* Sun/Moon grid */
.sm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sm-card{
  padding:16px;border:1px solid var(--hairline);border-radius:14px;
  background:rgba(255,255,255,0.015);text-align:center;
  transition:all .25s var(--ease-out);
  min-width:0;
}
.sm-card:hover{border-color:var(--accent-3);transform:translateY(-2px)}
.sm-i{font-size:24px;line-height:1}
.sm-l{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--t2);margin-top:10px}
.sm-v{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--t1);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Wiki hero */
.city-hero{
  position:relative;width:100%;height:180px;border-radius:14px;overflow:hidden;
  border:1px solid var(--hairline);
  background:linear-gradient(140deg, var(--accent-4), transparent);
}
.city-hero img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease-out)}
.city-hero:hover img{transform:scale(1.05)}
.city-hero-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;opacity:.4}
.city-hero-cap{
  position:absolute;left:0;right:0;bottom:0;padding:14px;
  background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#c9d3e4;
  text-transform:uppercase;
}
.city-extract{font-size:16px;line-height:1.72;color:var(--t1);opacity:.92;margin-top:16px;font-family:var(--f-display);font-style:italic}

/* Pop card */
.pop-card{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px;border:1px solid var(--hairline);border-radius:14px;
  background:linear-gradient(140deg, var(--accent-4), transparent 70%);
}
.pop-l{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--t2)}
.pop-v{font-family:var(--f-mono);font-size:26px;font-weight:700;color:var(--accent);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pop-i{font-size:32px;opacity:.55}

/* POI list */
.poi-group{margin-bottom:22px}
.poi-head{
  font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);opacity:.8;margin-bottom:10px;
}
.poi{
  display:flex;align-items:center;gap:14px;padding:11px 14px;
  border:1px solid var(--hairline);border-radius:12px;
  background:rgba(255,255,255,0.015);margin-bottom:6px;
  transition:all .22s var(--ease-out);
  min-height:56px;
}
.poi:hover{border-color:var(--accent-3);background:var(--accent-4);transform:translateX(3px)}
.poi:active{transform:scale(.98)}
.poi-i{width:40px;height:40px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);font-size:17px}
.poi-info{flex:1;min-width:0}
.poi-n{font-size:12.5px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poi-d{font-family:var(--f-mono);font-size:10px;color:var(--t2);margin-top:2px;letter-spacing:.02em}

/* Transport */
.tx{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--hairline);border-radius:12px;background:rgba(255,255,255,0.015);margin-bottom:8px;transition:all .22s;min-height:60px}
.tx:hover{border-color:var(--accent-3);background:var(--accent-4)}
.tx-i{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-4);font-size:16px;color:var(--accent)}
.tx-info{flex:1;min-width:0}
.tx-t{font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);opacity:.85}
.tx-n{font-size:12.5px;font-weight:500;color:var(--t1);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-d{font-family:var(--f-mono);font-size:10.5px;color:var(--t2);flex:0 0 auto;letter-spacing:.02em}

/* Info empty */
.empty{
  padding:18px;border:1px dashed var(--hairline-2);border-radius:12px;
  font-family:var(--f-mono);font-size:11px;color:var(--t2);
  line-height:1.7;text-align:center;letter-spacing:.02em;
}

/* Note card */
.note{
  padding:14px 16px;border:1px dashed var(--hairline-2);border-radius:12px;
  font-family:var(--f-mono);font-size:11px;color:var(--t2);line-height:1.7;
}
.note strong{color:var(--t1);font-weight:600}

/* Wiki link */
.wiki-link{
  display:inline-flex;align-items:center;gap:8px;margin-top:18px;
  font-family:var(--f-mono);font-size:11px;color:var(--accent);
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  border-bottom:1px dashed var(--accent-2);padding-bottom:3px;
  transition:all .2s;
  min-height:40px;
}
.wiki-link:hover{border-bottom-style:solid;gap:12px}

/* Space weather */
.sw-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw-card{
  padding:14px 8px;border:1px solid var(--hairline);border-radius:12px;
  background:rgba(255,255,255,0.015);text-align:center;
  transition:all .22s;min-width:0;
}
.sw-card:hover{border-color:var(--accent-3);background:var(--accent-4)}
.sw-l{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--t2);opacity:.8}
.sw-v{font-family:var(--f-mono);font-size:17px;font-weight:700;color:var(--t1);margin-top:8px;font-variant-numeric:tabular-nums}
.sw-v small{font-size:9px;color:var(--t2);font-weight:500}

/* Quake item */
.quake{
  padding:14px 16px;border:1px solid var(--hairline);border-radius:12px;
  background:rgba(255,255,255,0.015);margin-bottom:8px;
  border-left:3px solid var(--warn);
}
.quake-m{font-family:var(--f-mono);font-size:17px;font-weight:700;color:var(--warn);letter-spacing:-.01em}
.quake-p{font-size:12.5px;color:var(--t1);margin-top:5px;line-height:1.5}
.quake-t{font-family:var(--f-mono);font-size:10px;color:var(--t2);margin-top:5px;letter-spacing:.03em}

/* Tips */
.tip{
  display:flex;gap:12px;padding:14px 16px;border:1px solid var(--hairline);
  border-radius:12px;background:rgba(255,255,255,0.015);margin-bottom:8px;
  transition:all .22s;
}
.tip:hover{border-color:var(--accent-3);background:var(--accent-4)}
.tip-i{font-size:18px;flex:0 0 auto;line-height:1.3}
.tip-t{font-size:12.5px;line-height:1.65;color:var(--t1)}

/* Panel loading */
.p-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:60px 20px}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--hairline-2);border-top-color:var(--accent);
  animation:spin .9s linear infinite;
}
.spinner.sm{width:16px;height:16px;border-width:1.5px}
@keyframes spin{to{transform:rotate(360deg)}}
.p-loading .txt{font-family:var(--f-mono);font-size:10.5px;color:var(--t2);letter-spacing:.2em;text-transform:uppercase}

/* ============================================================================
   BOTTOM RAIL
   ============================================================================ */
.bottomrail{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(12px);
  z-index:12;width:min(760px, calc(100vw - 32px));
  padding-bottom:calc(12px + var(--safe-bottom));
  display:flex;flex-direction:column;gap:8px;
  opacity:0;pointer-events:none;
  transition:opacity .8s var(--ease-out) .4s, transform .8s var(--ease-out) .4s;
}
.bottomrail.in{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
body.idle .bottomrail{opacity:.35}

/* Mission ticker */
.ticker{
  height:34px;border-radius:10px;
  background:var(--glass-2);
  border:1px solid var(--hairline);
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  overflow:hidden;position:relative;
  display:flex;align-items:center;
  box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,0.04);
  mask-image:linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
}
.ticker-track{
  display:flex;align-items:center;gap:36px;padding:0 36px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;
  color:var(--t2);white-space:nowrap;
  animation:tickerScroll 60s linear infinite;
  will-change:transform;
}
.ticker:hover .ticker-track{animation-play-state:paused}
body.idle .ticker-track{animation-duration:120s}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick{display:flex;align-items:center;gap:8px;cursor:pointer;transition:color .2s}
.tick:hover{color:var(--t1)}
.tick-k{color:var(--accent);opacity:.7;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:9px}
.tick-v{color:var(--t1);font-weight:500;font-variant-numeric:tabular-nums}
.tick-sep{color:var(--t4)}

/* Time machine */
.tm{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:14px;
  background:var(--glass-2);
  border:1px solid var(--hairline);
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  box-shadow:var(--sh-3), inset 0 1px 0 rgba(255,255,255,0.05);
}
.tm-btn{
  width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);border:1px solid var(--hairline);
  background:rgba(255,255,255,0.02);
  transition:all .2s var(--ease-spring);
  font-size:13px;
}
.tm-btn:hover{color:var(--accent);border-color:var(--accent-2);background:var(--accent-4);transform:scale(1.05)}
.tm-btn:active{transform:scale(.92)}
.tm-btn.play{color:var(--accent);border-color:var(--accent-2)}
.tm-btn.playing{background:var(--accent-4);color:var(--accent);border-color:var(--accent-2)}
.tm-btn.now{
  width:auto;padding:0 12px;font-family:var(--f-mono);font-size:9.5px;
  font-weight:600;letter-spacing:.16em;text-transform:uppercase;
}
.tm-btn.now.armed{color:var(--warn);border-color:rgba(250,204,21,0.4);background:rgba(250,204,21,0.06)}
.tm-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tm-row{display:flex;align-items:center;gap:10px}
.tm-ico{width:14px;font-size:11px;opacity:.55;text-align:center;flex:0 0 auto}
.tm-slider{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:3px;border-radius:3px;
  background:var(--hairline-2);outline:none;cursor:pointer;
  touch-action:pan-y;
}
.tm-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2px solid var(--void);
  box-shadow:0 0 10px var(--accent-2);
  transition:transform .15s;
}
.tm-slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
.tm-slider::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;border:2px solid var(--void);
  background:var(--accent);box-shadow:0 0 10px var(--accent-2);
}
.tm-val{font-family:var(--f-mono);font-size:10px;color:var(--t1);width:56px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto;letter-spacing:.02em}
.tm-foot{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);opacity:.8;padding:0 2px;gap:8px}
.tm-foot .sim{color:var(--warn)}
#tmSub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================================================================
   RADIAL COMMAND WHEEL
   ============================================================================ */
.wheel-veil{
  position:fixed;inset:0;z-index:29;
  background:rgba(4,6,11,0.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s, visibility .3s;
}
.wheel-veil.on{opacity:1;visibility:visible;pointer-events:auto}
.wheel{
  position:fixed;z-index:30;left:50%;top:50%;
  width:440px;height:440px;
  transform:translate(-50%,-50%) scale(0.8);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s var(--ease-out), visibility .35s, transform .35s var(--ease-spring);
}
.wheel.on{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.wheel-hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:96px;height:96px;border-radius:50%;
  background:var(--glass-2);
  border:1px solid var(--hairline-2);
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:var(--sh-4), inset 0 1px 0 rgba(255,255,255,0.08);
}
.wheel-hub .hub-title{font-family:var(--f-display);font-size:15px;font-style:italic;color:var(--t1);line-height:1}
.wheel-hub .hub-hint{font-family:var(--f-mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--t2);opacity:.7}
.wedge{
  position:absolute;left:50%;top:50%;
  width:88px;height:88px;
  margin-left:-44px;margin-top:-44px;
  border-radius:50%;
  background:var(--glass-2);
  border:1px solid var(--hairline);
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;
  box-shadow:var(--sh-3), inset 0 1px 0 rgba(255,255,255,0.06);
  transform:translate(var(--x,0), var(--y,0)) scale(.6);
  opacity:0;
  transition:transform .4s var(--ease-spring), opacity .3s, background .2s, border-color .2s, box-shadow .2s;
}
.wheel.on .wedge{transform:translate(var(--x,0), var(--y,0)) scale(1);opacity:1;transition-delay:var(--d,0s)}
.wedge:hover{background:var(--accent-4);border-color:var(--accent-2);box-shadow:0 0 24px var(--accent-4), var(--sh-3)}
.wedge.on{background:var(--accent-4);border-color:var(--accent-2);color:var(--accent)}
.wedge-i{font-size:20px;line-height:1;color:var(--accent)}
.wedge-l{font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}
.wedge-s{font-family:var(--f-mono);font-size:9px;color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}

/* ============================================================================
   COMMAND PALETTE
   ============================================================================ */
.palette-veil{
  position:fixed;inset:0;z-index:199;
  background:rgba(4,6,11,0.6);
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s, visibility .3s;
}
.palette-veil.on{opacity:1;visibility:visible;pointer-events:auto}
.palette{
  position:fixed;z-index:200;left:50%;top:14vh;
  width:min(640px, calc(100vw - 32px));
  transform:translateX(-50%) translateY(-12px) scale(.98);
  opacity:0;visibility:hidden;pointer-events:none;
  background:var(--sheet);
  border:1px solid var(--hairline-2);
  border-radius:16px;
  box-shadow:var(--sh-5);
  backdrop-filter:blur(28px) saturate(1.5);
  -webkit-backdrop-filter:blur(28px) saturate(1.5);
  overflow:hidden;
  transition:opacity .3s var(--ease-out), transform .3s var(--ease-spring), visibility .3s;
}
.palette.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.palette-head{
  display:flex;align-items:center;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--hairline);
}
.palette-head svg{color:var(--t2);flex:0 0 auto}
.palette-head input{
  flex:1;min-width:0;font-size:16px;font-family:var(--f-ui);color:var(--t1);
  background:none;border:none;outline:none;font-weight:500;
  -webkit-appearance:none;appearance:none;
}
.palette-head input::placeholder{color:var(--t3)}
.palette-head .esc{
  font-family:var(--f-mono);font-size:9.5px;font-weight:600;
  padding:3px 7px;border-radius:6px;color:var(--t2);
  border:1px solid var(--hairline-2);background:rgba(255,255,255,0.03);
  letter-spacing:.06em;flex:0 0 auto;
}
.palette-list{max-height:min(460px, 56dvh);overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.palette-section{
  font-family:var(--f-mono);font-size:8.5px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;color:var(--t3);
  padding:12px 20px 6px;
}
.palette-item{
  padding:11px 20px;display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:background .12s;
  animation:itemIn .25s var(--ease-out) backwards;
  position:relative;min-height:52px;
}
.palette-item:hover,.palette-item.hl{background:var(--accent-4)}
.palette-item:active{background:var(--accent-4)}
.palette-item.hl::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--accent);border-radius:2px}
.palette-ico{
  width:28px;height:28px;flex:0 0 auto;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.04);font-size:13px;color:var(--accent);
}
.palette-body{flex:1;min-width:0}
.palette-name{font-size:13.5px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette-sub{font-family:var(--f-mono);font-size:10px;color:var(--t2);margin-top:2px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette-badge{font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);opacity:.7}
.palette-empty{padding:36px 20px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--t2);letter-spacing:.04em}

/* ============================================================================
   TOASTS
   ============================================================================ */
.toasts{
  position:fixed;bottom:calc(106px + var(--safe-bottom));right:calc(20px + var(--safe-right));z-index:100;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  pointer-events:none;max-width:calc(100vw - 40px);
}
.toast{
  position:relative;overflow:hidden;
  pointer-events:auto;
  min-width:240px;max-width:380px;
  padding:12px 16px 14px;
  background:var(--sheet);
  border:1px solid var(--hairline-2);
  border-left:2px solid var(--accent);
  border-radius:12px;
  box-shadow:var(--sh-4);
  font-family:var(--f-mono);font-size:11.5px;color:var(--t1);
  letter-spacing:.01em;line-height:1.5;
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  animation:toastIn .5s var(--ease-spring);
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .35s var(--ease-out) forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px) scale(.96)}}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger)}
.toast-prog{
  position:absolute;left:0;bottom:0;height:2px;
  background:var(--accent);opacity:.8;
  animation:toastProg linear forwards;
}
.toast.ok .toast-prog{background:var(--ok)}
.toast.warn .toast-prog{background:var(--warn)}
.toast.err .toast-prog{background:var(--danger)}
@keyframes toastProg{from{width:100%}to{width:0}}

/* ============================================================================
   BOOT VEIL
   ============================================================================ */
.boot{
  position:fixed;inset:0;z-index:999;
  background:var(--void);
  display:flex;align-items:center;justify-content:center;
  padding:var(--safe-top) 0 var(--safe-bottom);
  transition:opacity .8s var(--ease-in-out), visibility .8s;
}
.boot.out{opacity:0;visibility:hidden;pointer-events:none}
.boot-inner{
  width:min(520px, calc(100vw - 40px));
  display:flex;flex-direction:column;gap:28px;
}
.boot-logo{
  display:flex;align-items:center;gap:14px;
  opacity:0;animation:bootLogo .8s var(--ease-out) .15s forwards;
}
@keyframes bootLogo{to{opacity:1}}
.boot-sigil{width:36px;height:36px;position:relative;animation:spinSigil 20s linear infinite}
.boot-sigil svg{display:block;width:100%;height:100%}
.boot-sigil circle,.boot-sigil ellipse{fill:none;stroke:var(--accent);stroke-width:.8;opacity:.7}
.boot-sigil .dot{fill:var(--accent)}
.boot-title{
  font-family:var(--f-display);font-size:28px;font-style:italic;
  color:var(--t1);line-height:1;letter-spacing:.005em;
}
.boot-sub{
  font-family:var(--f-mono);font-size:9.5px;color:var(--accent);
  letter-spacing:.3em;text-transform:uppercase;margin-top:4px;opacity:.75;
}
.boot-log{
  font-family:var(--f-mono);font-size:10.5px;color:var(--t2);
  line-height:1.85;letter-spacing:.02em;
  min-height:130px;
}
.boot-log-line{white-space:nowrap;overflow:hidden}
.boot-log-line .ok{color:var(--ok);margin-left:6px}
.boot-log-line .arrow{color:var(--accent);margin-right:8px}
.boot-bar{
  height:1px;background:var(--hairline);position:relative;overflow:hidden;border-radius:2px;
}
.boot-bar::after{
  content:'';position:absolute;left:0;top:0;height:100%;width:30%;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  animation:bootSlide 1.8s ease-in-out infinite;
}
@keyframes bootSlide{from{transform:translateX(-100%)}to{transform:translateX(400%)}}

/* ============================================================================
   COORD READOUT (bottom-left)
   ============================================================================ */
.readout{
  position:fixed;left:calc(20px + var(--safe-left));bottom:calc(120px + var(--safe-bottom));z-index:6;
  font-family:var(--f-mono);font-size:10px;color:var(--t2);
  letter-spacing:.06em;line-height:2;pointer-events:none;
  transition:opacity .4s;
}
body.idle .readout{opacity:.3}
.readout .r-l{color:var(--accent);opacity:.7;margin-right:8px;font-weight:600}
.readout .r-v{color:var(--t1);font-weight:500;font-variant-numeric:tabular-nums}

/* Hint */
.hint{
  position:fixed;left:50%;bottom:220px;transform:translateX(-50%);
  z-index:6;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--t2);
  display:flex;align-items:center;gap:14px;
  pointer-events:none;opacity:.7;
  transition:opacity .8s var(--ease-out);
  white-space:nowrap;
}
.hint::before,.hint::after{content:'';width:32px;height:1px;background:linear-gradient(90deg,transparent,var(--hairline-2))}
.hint::after{background:linear-gradient(90deg,var(--hairline-2),transparent)}
.hint.gone{opacity:0}

/* ============================================================================
   RESPONSIVE — TABLET
   ============================================================================ */
@media (max-width:1180px) and (min-width:821px){
  .panel{width:430px}
  .layerstack{width:180px}
  .cmdbar{max-width:380px}
}

/* ============================================================================
   RESPONSIVE — MOBILE  (the important part)
   ============================================================================ */
@media (max-width:820px){

  /* ---------- Global typography bump ---------- */
  body{font-size:15px;line-height:1.55}

  /* ---------- TOP RAIL : two rows ---------- */
  .toprail{
    height:auto;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    row-gap:8px;
    padding:calc(var(--safe-top) + 9px) calc(12px + var(--safe-right)) 10px calc(12px + var(--safe-left));
    gap:0 8px;
  }
  .brand{order:1;flex:1 1 auto;gap:9px}
  .brand-sigil{width:23px;height:23px}
  .brand-title{font-size:18px}
  .brand-sub{display:none}

  .rail-right{order:2;gap:2px;flex:0 0 auto}
  .rail-icon{width:38px;height:38px;border-radius:11px}
  .rail-icon svg{width:18px;height:18px}
  .accent-cluster{display:none}

  .cmdbar{
    order:3;
    flex:1 1 100%;
    max-width:none;
    margin:0;
    height:44px;
    border-radius:13px;
    padding:0 14px;
    background:rgba(255,255,255,0.045);
  }
  .cmdbar svg{width:16px;height:16px;opacity:.75}
  .cmdbar input{font-size:16px;letter-spacing:0}  /* 16px stops iOS auto-zoom */
  .cmdbar input::placeholder{font-size:15px}
  .cmdbar .kbd{display:none}

  /* ---------- Search popover ---------- */
  .search-pop{
    left:12px;right:12px;width:auto;
    transform:translateY(-6px);
    border-radius:16px;
    max-height:62dvh;
  }
  .search-pop.on{transform:translateY(0)}
  .search-item{padding:14px 16px}
  .search-item-name{font-size:14.5px}
  .search-item-region{font-size:11px}
  .search-label{font-size:9.5px;padding:14px 16px 8px}
  .search-chip{font-size:12px;padding:9px 14px;min-height:38px}

  /* ---------- LAYER STACK : horizontal pills ---------- */
  .layerstack{
    left:0;right:0;
    top:calc(var(--rail-bottom) + 8px);
    bottom:auto;
    width:auto;
    transform:none;
    flex-direction:row;
    gap:8px;
    padding:0 calc(12px + var(--safe-right)) 6px calc(12px + var(--safe-left));
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 24px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 24px), transparent 100%);
  }
  .layerstack.in{transform:none}
  .layerstack::-webkit-scrollbar{display:none}
  .layer-card{
    flex:0 0 auto;
    padding:9px 13px 9px 11px;
    border-radius:13px;
    gap:9px;
    scroll-snap-align:start;
    min-height:46px;
  }
  .layer-card:hover{transform:none}
  .layer-card::before{display:none}
  .layer-icon{width:28px;height:28px;border-radius:9px}
  .layer-icon svg{width:15px;height:15px}
  .layer-meta{flex-direction:row;align-items:baseline;gap:8px}
  .layer-label{font-size:12.5px;font-weight:600}
  .layer-stat{font-size:10px;opacity:.85}
  .layer-spark{display:none}
  .layer-toggle{width:7px;height:7px}

  /* ---------- PANEL → bottom sheet ---------- */
  .panel{
    top:auto;left:0;right:0;bottom:0;
    width:100%;max-width:100%;
    height:auto;
    max-height:88vh;
    max-height:88dvh;
    border-left:none;
    border-top:1px solid var(--hairline-2);
    border-radius:26px 26px 0 0;
    transform:translateY(100%);
    transition:transform .5s var(--ease-out), opacity .3s;
    box-shadow:0 -20px 60px rgba(0,0,0,0.55);
  }
  .panel.on{transform:translateY(0)}

  .panel-grabber{
    display:block;
    position:absolute;top:0;left:0;right:0;height:30px;
    z-index:5;
    touch-action:none;
  }
  .panel-grabber::after{
    content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:40px;height:4px;border-radius:4px;
    background:var(--hairline-3);
  }

  .panel-head{padding:74px 20px 0}
  .panel-fav{top:36px;left:18px;width:36px;height:36px;font-size:15px}
  .panel-close{top:36px;right:18px;width:36px;height:36px}
  .panel-eyebrow{font-size:9.5px;margin-bottom:10px}
  .panel-title{font-size:29px;padding-right:0;line-height:1.1}
  .panel-coords{font-size:11.5px;margin-top:8px}
  .panel-hero{margin-top:14px;align-items:center}
  .panel-temp{font-size:54px}
  .panel-temp .unit{font-size:19px;padding:6px 10px}
  .panel-hero-icon{font-size:30px}
  .panel-hero-cond{font-size:11px;max-width:130px}
  .panel-feels{font-size:12px;margin-top:12px}

  .panel-tabs{padding:16px 20px 0;gap:2px}
  .tab-btn{font-size:11px;padding:11px 15px 14px;letter-spacing:.12em;min-height:44px}

  .panel-body{padding:18px 20px calc(48px + var(--safe-bottom))}

  /* ---------- Panel content scaling ---------- */
  .sec{margin-bottom:26px}
  .sec-label{font-size:10px;letter-spacing:.22em;margin-bottom:12px}
  .row{padding:13px 0}
  .row-l{font-size:11.5px}
  .row-v{font-size:13px}
  .grid2{gap:9px}
  .stat{padding:13px 14px}
  .stat-label{font-size:9.5px;letter-spacing:.14em;margin-bottom:7px}
  .stat-v{font-size:18px}
  .nowcast-title{font-size:11px}

  66:['Freezing rain','🌧️'],67:['Heavy freezing rain','🌨️'],
  71:['Slight snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow grains','❄️'],
  80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Violent showers','⛈️'],

  95:['Thunderstorm','⛈️'],96:['Thunderstorm, hail','⛈️'],99:['Severe thunderstorm','⛈️']
};
const MOON_NAMES = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];

/* ============================================================================

const $ = (s, c) => (c||document).querySelector(s);
const $$ = (s, c) => Array.from((c||document).querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => (n<10?'0':'')+n;

function latLonToVec3(lat, lon, radius){
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -(radius * Math.sin(phi) * Math.cos(theta)),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}
function vec3ToLatLon(v, radius){
  const phi = Math.acos(clamp(v.y/radius, -1, 1));
  const theta = Math.atan2(v.z, -v.x);
  let lat = 90 - (phi * 180 / Math.PI);
  let lon = (theta * 180 / Math.PI) - 180;
  if (lon < -180) lon += 360;
  if (lon > 180) lon -= 360;
  return { lat, lon };
}
function shortAngle(a, b){
  let d = (b - a) % (Math.PI*2);
  if (d > Math.PI) d -= Math.PI*2;
  if (d < -Math.PI) d += Math.PI*2;
  return d;
}
function frontRot(p){ return Math.atan2(-p.x, p.z); }

function getSubsolar(date){
  const dayMs = 86400000;
  const start = Date.UTC(date.getUTCFullYear(), 0, 0);
  const doy = Math.floor((date.getTime() - start) / dayMs);
  const h = date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
  const decl = -23.44 * Math.cos((2*Math.PI/365) * (doy + 10));
  const B = (2*Math.PI/365) * (doy - 81);
  const eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);
  let lon = -15 * (h - 12 + eot/60);
  while (lon < -180) lon += 360;
  while (lon > 180) lon -= 360;
  return { lat: decl, lon: lon };
}
function dayOfYearUTC(d){
  const start = Date.UTC(d.getUTCFullYear(), 0, 1);
  const today = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  return Math.floor((today - start) / 86400000) + 1;

  const Rk = 6371;
  const dLat = (c-a)*Math.PI/180, dLon = (d-b)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
  return Rk * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function moonPhase(date){
  const knownNew = Date.UTC(2000,0,6,18,14,0);
  const syn = 29.530588853;
  const diff = (date.getTime() - knownNew) / 86400000;
  let p = diff % syn;
  if (p < 0) p += syn;
  const illum = (1 - Math.cos((p/syn)*2*Math.PI)) / 2;
  const i = Math.floor((p/syn)*8 + 0.5) % 8;
  return { name: MOON_NAMES[i], icon: MOON_ICONS[i], illum: Math.round(illum*100) };
}
function timeAgo(ms){
  const s = Math.max(1, Math.floor((Date.now()-ms)/1000));
  if (s < 90) return s + 's ago';
  const m = Math.floor(s/60);
  if (m < 90) return m + ' min ago';
  const h = Math.floor(m/60);
  if (h < 36) return h + ' h ago';
  return Math.floor(h/24) + ' d ago';
}

    varying vec2 vUv;

    void main(){
      vUv = uv;
      vWN = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWP = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform sampler2D dayTexture;
    uniform sampler2D nightTexture;
    uniform sampler2D bumpTexture;
    uniform vec3 sunDirection;
    uniform float bumpScale;
    uniform float nightBoost;
    uniform float twilight;
    uniform float hasBump;
    uniform float rimPulse;
    uniform vec3 rimColor;
    varying vec2 vUv;
    varying vec3 vWN;
    varying vec3 vWP;
    void main(){
      vec3 N = normalize(vWN);
      vec3 S = normalize(sunDirection);
      vec3 up = abs(N.y) > 0.999 ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);
      vec3 T = normalize(cross(up, N));
      vec3 B = normalize(cross(N, T));
      float tx = 1.0/4096.0;
      float h  = texture2D(bumpTexture, vUv).r;
      float hL = texture2D(bumpTexture, vUv - vec2(tx,0.0)).r;
      float hR = texture2D(bumpTexture, vUv + vec2(tx,0.0)).r;
      float hD = texture2D(bumpTexture, vUv - vec2(0.0,tx)).r;
      float hU = texture2D(bumpTexture, vUv + vec2(0.0,tx)).r;
      vec3 Np = normalize(N - hasBump * bumpScale * ((hR-hL)*T + (hU-hD)*B));
      vec3 dayCol = texture2D(dayTexture, vUv).rgb;
      vec3 nightCol = texture2D(nightTexture, vUv).rgb;
      float cosFlat = dot(N, S);
      float cosPert = dot(Np, S);
      float diff = clamp(cosPert, 0.0, 1.0);
      vec3 lit = dayCol * (0.055 + 1.02 * pow(diff, 0.82));
      float water = 1.0 - smoothstep(0.03, 0.16, h);
      vec3 V = normalize(cameraPosition - vWP);
      vec3 H = normalize(S + V);
      float spec = pow(max(dot(Np, H), 0.0), 72.0) * water * 0.85;
      lit += vec3(1.0, 0.95, 0.85) * spec * smoothstep(0.0, 0.25, cosFlat);
      float cityGlow = pow(max(nightCol.r - 0.045, 0.0), 1.15);
      vec3 nightLit = nightCol * nightBoost;
      nightLit += vec3(1.0, 0.66, 0.28) * cityGlow * 1.35;
      nightLit += vec3(0.02, 0.035, 0.07);
      float dayMix = smoothstep(-0.14, 0.20, cosFlat);
      vec3 col = mix(nightLit, lit, dayMix);
      float tw = exp(-pow((cosFlat - 0.0) * 5.4, 2.0));
      col += tw * vec3(0.20, 0.09, 0.05) * twilight;
      float rim = pow(1.0 - abs(dot(N, V)), 3.0);
      col += rimColor * rim * rimPulse * 0.8;
      gl_FragColor = vec4(col, 1.0);
    }
  `

function shell(radius, colorHex, power, strength, sunBias){

    power:        { value: power },

      }
    `,
    fragmentShader: `
      uniform vec3 glowColor;
      uniform vec3 sunDirection;
      uniform float power;
      uniform float strength;
      uniform float sunBias;
      varying vec3 vWN;
      varying vec3 vWP;
      void main(){
        vec3 N = normalize(vWN);
        vec3 V = normalize(cameraPosition - vWP);
        float rim = pow(clamp(1.0 - abs(dot(N, V)), 0.0, 1.0), power);
        float sunFace = smoothstep(-0.5, 0.55 + sunBias, dot(normalize(vWP), normalize(sunDirection)));
        vec3 col = glowColor * (0.18 + 1.05 * sunFace);
        float a = rim * strength;
        gl_FragColor = vec4(col * a, a);
      }
    `,
    transparent:true,
    depthWrite:false,
    side:THREE.BackSide,
    blending:THREE.AdditiveBlending
  });
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48), m);
}

/* ---- Marker ---- */
let markerGroup = null;

function clearMarker(){
  if (markerGroup){
    earth.remove(markerGroup);
    markerGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    markerGroup = null;
  }
}
function placeMarker(localPoint){
  clearMarker();
  const normal = localPoint.clone().normalize();
  const g = new THREE.Group();
  g.position.copy(normal.clone().multiplyScalar(R * 1.008));
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), normal);
  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 16, 16),
    new THREE.MeshBasicMaterial({ color:0xf5a94e })
  ));
  const rings = [];
  for (let i = 0; i < 3; i++){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.10, 0.12, 48),
      new THREE.MeshBasicMaterial({ color:0xf5a94e, transparent:true, opacity:0, side:THREE.DoubleSide })
    );
    ring.userData.delay = i * 0.4;
    g.add(ring);
    rings.push(ring);
  }
  g.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0.22)]),
    new THREE.LineBasicMaterial({ color:0xf5a94e, transparent:true, opacity:0.5 })
  ));
  g.userData.rings = rings;
  earth.add(g);
  markerGroup = g;
  markerTime = 0;
}
function updateMarker(dt){
  if (!markerGroup) return;
  markerTime += dt;
  const rings = markerGroup.userData.rings || [];
  rings.forEach(ring => {
    const t = (markerTime - ring.userData.delay) / 1.6;
    if (t < 0 || t > 1){ ring.material.opacity = 0; return; }
    const s = 1 + t * 3.2;
    ring.scale.set(s, s, s);
    ring.material.opacity = 0.85 * (1 - t);
  });
}

      float a = c.a;

function buildISS(){
  const g = new THREE.Group();
  const white = new THREE.MeshPhongMaterial({ color:0xe8eef8, shininess:70, specular:0x9fb4d0 });
  const grey = new THREE.MeshPhongMaterial({ color:0x9aa7ba, shininess:40, specular:0x66788f });
  const gold = new THREE.MeshPhongMaterial({ color:0xd9a441, shininess:90, specular:0xffd88a });
  const panel = new THREE.MeshPhongMaterial({ color:0x13234a, emissive:0x0a1630, shininess:120, specular:0x6f95d8 });
  const panelTr = new THREE.MeshBasicMaterial({ color:0x3c5f9e, wireframe:true, transparent:true, opacity:0.5 });
  const truss = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.62, 8), grey);
  truss.rotation.z = Math.PI/2;
  g.add(truss);
  for (let i = -3; i <= 3; i++){
    const rib = new THREE.Mesh(new THREE.TorusGeometry(0.017, 0.004, 6, 12), grey);
    rib.rotation.y = Math.PI/2;
    rib.position.x = i * 0.088;
    g.add(rib);
  }
  const mods = [
    { y:0,    r:0.032, h:0.14, m:white },
    { y:0.10, r:0.030, h:0.10, m:gold },
    { y:-0.10,r:0.030, h:0.10, m:white },
    { y:0.19, r:0.024, h:0.07, m:grey },
    { y:-0.19,r:0.024, h:0.07, m:grey }
  ];
  mods.forEach(md => {
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(md.r, md.r, md.h, 12), md.m);
    cyl.position.y = md.y;
    g.add(cyl);
  });
  const node = new THREE.Mesh(new THREE.SphereGeometry(0.030, 12, 10), gold);
  node.position.y = 0.23;
  g.add(node);
  function makeWing(sign, offset){
    const wing = new THREE.Group();
    const pw = 0.20, ph = 0.115, gap = 0.006;
    for (let k = 0; k < 2; k++){
      const pnl = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, 0.0035), panel);
      pnl.position.set(sign*(pw/2 + 0.012), 0, (k === 0 ? 1 : -1)*(ph/2 + gap));
      wing.add(pnl);
      const grid = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), panelTr);
      grid.position.copy(pnl.position);
      grid.position.z += 0.0026;
      wing.add(grid);
      const g2 = grid.clone();
      g2.position.z -= 0.0052;
      wing.add(g2);
    }
    const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, 0.05, 6), grey);
    boom.rotation.z = Math.PI/2;
    boom.position.x = sign * 0.026;
    wing.add(boom);
    const joint = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.014, 10), grey);
    joint.rotation.x = Math.PI/2;
    wing.add(joint);
    wing.position.x = offset;
    return wing;
  }
  [-0.24,-0.10,0.10,0.24].forEach(off => {
    g.add(makeWing(1, off));
    g.add(makeWing(-1, off));
  });
  return g;
}

function makePlane(){

function renderAircraft(list){

    const dir = north.clone().multiplyScalar(Math.cos(hdg)).add(east.clone().multiplyScalar(Math.sin(hdg))).normalize();

function buildQuakes(list){

let flyState = null;
function flyTo(lat, lon, distance){
  const targetR = distance || FOCUS_DIST;
  const localPoint = latLonToVec3(lat, lon, 1);
  const rotY = frontRot(localPoint);
  const startRot = earth.rotation.y;
  const deltaRot = shortAngle(startRot, rotY);
  const startSph = new THREE.Spherical().setFromVector3(camera.position.clone());
  let targetPhi = Math.acos(clamp(localPoint.y, -1, 1));
  targetPhi = clamp(targetPhi, 0.42, Math.PI - 0.42);
  const startTheta = startSph.theta;
  const dTheta = shortAngle(startTheta, 0);
  flyState = {
    t:0, dur: IS_MOBILE ? 1.5 : 1.35,
    startRot, deltaRot,
    r0:startSph.radius, r1:targetR,
    p0:startSph.phi, p1:targetPhi,
    t0:startTheta, dt:dTheta
  };
  controls.enabled = false;
  state.autoRotate = false;
}
function updateFly(dt){
  if (!flyState) return false;
  flyState.t += dt / flyState.dur;
  const k = Math.min(1, flyState.t);
  const e = 1 - Math.pow(1-k, 3);
  earth.rotation.y = flyState.startRot + flyState.deltaRot * e;
  const sph = new THREE.Spherical(
    flyState.r0 + (flyState.r1 - flyState.r0) * e,
    flyState.p0 + (flyState.p1 - flyState.p0) * e,
    flyState.t0 + flyState.dt * e
  );
  camera.position.setFromSpherical(sph);
  camera.lookAt(0,0,0);
  if (k >= 1){
    flyState = null;
    controls.enabled = true;
    controls.update();
  }
  return true;
}

let clock = new THREE.Clock();
let cloudPhase = 0;
let lastT = performance.now();
let fpsSample = performance.now(), frameCount = 0, currentDPR = baseDPR;
let rimPulseT = 0;

function animate(){
  requestAnimationFrame(animate);
  if (state.paused) return;
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  frameCount++;
  if (now - fpsSample > 1500){
    const fps = frameCount / ((now - fpsSample)/1000);
    frameCount = 0; fpsSample = now;
    if (fps < 32 && currentDPR > 1){
      currentDPR = Math.max(1, currentDPR - 0.25);
      renderer.setPixelRatio(currentDPR);
    }
  }
  const flying = updateFly(dt);
  if (!flying){
    if (state.autoRotate && !state.panelOpen && !state.dragging && !state.timeTravel.playing){
      earth.rotation.y += ROT_SPEED * dt * 60;
    }
    controls.update();
  }
  cloudPhase += 0.00016;
  clouds.rotation.y = earth.rotation.y + cloudPhase;
  if (issGroup.visible){
    issModel.rotation.y += dt * 0.22;
    const breathe = 1 + 0.05 * Math.sin(clock.getElapsedTime() * 2.4);
    issHalo.scale.setScalar(breathe);
    issHalo.material.opacity = 0.045 + 0.02 * Math.sin(clock.getElapsedTime() * 1.8);
  }
  if (aircraftGroup.visible && !REDUCED){
    const p = 0.75 + 0.25 * Math.sin(clock.getElapsedTime() * 3.2);
    aircraftMarkers.forEach(m => { m.material.opacity = p; });
  }
  if (quakeGroup.visible){
    const t = now / 1000;
    quakeGroup.children.forEach(g => {
      const s = 1 + 0.16 * Math.sin(t * 2.2 + g.userData.phase);
      g.scale.setScalar(s);
    });
  }
  if (aurora.visible){
    auroraU.time.value = clock.getElapsedTime();
    auroraU.kp.value = state.kp;
  }
  if (rimPulseT > 0){
    rimPulseT -= dt;
    earthU.rimPulse.value = Math.max(0, rimPulseT / 0.4);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5eead4';
    earthU.rimColor.value.set(accent);
  } else {
    earthU.rimPulse.value = 0;
  }
  updateMarker(dt);
  renderer.render(scene, camera);
}

/* ============================================================================

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downPos = null;
let hoverPos = { x:0, y:0 };
let consumeTap = false;

renderer.domElement.addEventListener('pointerdown', e => {
  downPos = { x:e.clientX, y:e.clientY };
  state.dragging = false;
});
renderer.domElement.addEventListener('pointermove', e => {
  hoverPos = { x:e.clientX, y:e.clientY };
  if (downPos){
    const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    if (Math.sqrt(dx*dx + dy*dy) > (IS_TOUCH ? 10 : 6)){
      state.dragging = true;
      container.classList.add('grabbing');
    }
  }
});
addEventListener('pointerup', e => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  const d = Math.sqrt(dx*dx + dy*dy);
  downPos = null;
  container.classList.remove('grabbing');
  if (d < (IS_TOUCH ? 10 : 6) && !consumeTap) handleTap(e.clientX, e.clientY);
  consumeTap = false;
  setTimeout(() => state.dragging = false, 50);
});
renderer.domElement.addEventListener('pointercancel', () => {
  downPos = null;
  container.classList.remove('grabbing');
});
if (!IS_TOUCH){
  renderer.domElement.addEventListener('pointermove', () => {
    if (state.dragging || flyState) return;
    const now = performance.now();
    if (now - (handleHover._last || 0) < 40) return;
    handleHover._last = now;
    handleHover();
  });
}
function handleHover(){
  const rect = renderer.domElement.getBoundingClientRect();
  ptr.x = ((hoverPos.x - rect.left) / rect.width) * 2 - 1;
  ptr.y = -((hoverPos.y - rect.top) / rect.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObject(earth, false);
  if (hits.length){
    const local = earth.worldToLocal(hits[0].point.clone());
    const geo = vec3ToLatLon(local, R);
    $('#rdLat').textContent = fmtLatLonShort(geo.lat, 0).split(' ')[0];
    $('#rdLon').textContent = Math.abs(geo.lon).toFixed(2) + '°' + (geo.lon >= 0 ? 'E' : 'W');
  }
}
function handleTap(x, y){
  const rect = renderer.domElement.getBoundingClientRect();
  ptr.x = ((x - rect.left) / rect.width) * 2 - 1;
  ptr.y = -((y - rect.top) / rect.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  if (quakeGroup.visible && quakeGroup.children.length){
    const qh = ray.intersectObjects(quakeGroup.children, true);
    const eh = ray.intersectObject(earth, false);
    if (qh.length && (!eh.length || qh[0].distance < eh[0].distance)){
      let g = qh[0].object;
      while (g && g.parent !== quakeGroup) g = g.parent;
      if (g){
        const idx = quakeGroup.children.indexOf(g);
        const q = state.quakes[idx];
        if (q){
          buzz(18);
          toast(`M${q.mag.toFixed(1)} · ${q.place || 'unknown'} · ${timeAgo(q.time)}`, 'warn', 5000);
          return;
        }
      }
    }
  }
  const hits = ray.intersectObject(earth, false);
  if (!hits.length) return;
  const local = earth.worldToLocal(hits[0].point.clone());
  const geo = vec3ToLatLon(local, R);
  placeMarker(local);
  hideHint();
  hideSearchPop();
  rimPulseT = 0.4;
  buzz(14);
  fetchLocationData(geo.lat, geo.lon, null, null);
}
