let audioCtx = null, soundGain = null, soundNodes = null;
function initSound(){
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ return; }
  soundGain = audioCtx.createGain();
  soundGain.gain.value = 0;
  soundGain.connect(audioCtx.destination);
  const bufSize = audioCtx.sampleRate * 2;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) d[i] = Math.random()*2 - 1;
  const rainSrc = audioCtx.createBufferSource();
  rainSrc.buffer = buf; rainSrc.loop = true;
  const rainFilt = audioCtx.createBiquadFilter();
  rainFilt.type = 'bandpass'; rainFilt.frequency.value = 2400; rainFilt.Q.value = 0.6;
  const rainGain = audioCtx.createGain();
  rainGain.gain.value = 0.15;
  rainSrc.connect(rainFilt).connect(rainGain).connect(soundGain);
  rainSrc.start();
  const windSrc = audioCtx.createBufferSource();
  windSrc.buffer = buf; windSrc.loop = true;
  const windFilt = audioCtx.createBiquadFilter();
  windFilt.type = 'lowpass'; windFilt.frequency.value = 320;
  const windGain = audioCtx.createGain();
  windGain.gain.value = 0.08;
  windSrc.connect(windFilt).connect(windGain).connect(soundGain);
  windSrc.start();
  const lfo = audioCtx.createOscillator();
  const lfoG = audioCtx.createGain();
  lfo.frequency.value = 0.08;
  lfoG.gain.value = 80;
  lfo.connect(lfoG).connect(windFilt.frequency);
  lfo.start();
  soundNodes = { rainSrc, windSrc, rainFilt, windFilt, rainGain, windGain };
}
const ACCENT_NOTES = { cyan:880, amber:740, violet:988, rose:660, ion:1046 };
function uiTick(freq){
  if (!state.soundOn || !audioCtx || REDUCED) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = freq || ACCENT_NOTES[state.accent] || 880;
  g.gain.setValueAtTime(0.06, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.2);
}
function dataChime(){
  if (!state.soundOn || !audioCtx) return;
  [1200, 1800].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    const t = audioCtx.currentTime + i * 0.08;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.04, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.3);
  });
}
function markerPing(){
  if (!state.soundOn || !audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = 1600;
  g.gain.setValueAtTime(0.05, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.8);
}
function toggleSound(){
  if (!audioCtx) initSound();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  state.soundOn = !state.soundOn;
  const btn = $('#soundBtn');
  if (state.soundOn){
    soundGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 1.5);
    btn.classList.add('on');
    toast('Ambient soundscape on', 'ok', 1400);
  } else {
    soundGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
    btn.classList.remove('on');
    toast('Soundscape off', 'ok', 1100);
  }
  updateWheelStats();
}

function typeLine(el, text, cb){

function dollyCamera(){
  const start = performance.now();
  const dur = IS_MOBILE ? 2400 : 3000;
  const z0 = HOME_DIST * 4.2, z1 = HOME_DIST;
  function step(){
    const t = Math.min(1, (performance.now() - start) / dur);
    const e = 1 - Math.pow(1-t, 3);
    camera.position.z = z0 + (z1 - z0) * e;
    camera.lookAt(0,0,0);
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

function layoutWheel(){

  w.style.height = size + 'px';

    el.style.marginTop = (-half) + 'px';

    el.style.setProperty('--x', (Math.cos(a) * radius).toFixed(1) + 'px');

function fuzzy(hay, needle){
  if (!needle) return 1;
  hay = hay.toLowerCase(); needle = needle.toLowerCase();
  let hi = 0, score = 0, streak = 0;
  for (let ni = 0; ni < needle.length; ni++){
    const c = needle[ni];
    let found = -1;
    for (let i = hi; i < hay.length; i++){
      if (hay[i] === c){ found = i; break; }
    }
    if (found === -1) return 0;
    streak = (found === hi) ? streak + 1 : 1;
    score += streak * 2 - (found - hi) * 0.1;
    hi = found + 1;
  }
  return score;
}
function renderPalette(q){
  const all = buildPaletteItems();
  let results;
  if (!q.trim()){
    results = all.slice(0, 20);

    results = all.map(item => ({
      item, score: fuzzy(item.label + ' ' + (item.sub||'') + ' ' + (item.keywords||''), q)
    })).filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 30)
      .map(x => x.item);
  }
  paletteItems = results;
  paletteHL = results.length ? 0 : -1;
  if (!results.length){
    paletteList.innerHTML = '<div class="palette-empty">No results</div>';
    return;
  }
  const groups = {};
  results.forEach(it => {
    const key = it.type === 'action' ? 'Actions' : (it.sub || 'Places');
    (groups[key] = groups[key] || []).push(it);
  });
  let html = '';
  Object.keys(groups).forEach(gk => {
    html += `<div class="palette-section">${gk}</div>`;
    groups[gk].forEach(it => {
      const gi = results.indexOf(it);
      html += `<div class="palette-item${gi === paletteHL ? ' hl' : ''}" data-idx="${gi}" style="animation-delay:${gi * 0.012}s">
        <div class="palette-ico">${it.icon || '◇'}</div>
        <div class="palette-body">
          <div class="palette-name">${escapeHtml(it.label)}</div>
          <div class="palette-sub">${escapeHtml(it.sub || '')}</div>
        </div>
      </div>`;
    });
  });
  paletteList.innerHTML = html;
  $$('.palette-item', paletteList).forEach(el => {
    el.addEventListener('click', () => executePaletteItem(parseInt(el.dataset.idx, 10)));
    el.addEventListener('mouseenter', () => {
      paletteHL = parseInt(el.dataset.idx, 10);
      $$('.palette-item', paletteList).forEach(e => e.classList.toggle('hl', parseInt(e.dataset.idx,10) === paletteHL));
    });
  });
}
function executePaletteItem(idx){
  const item = paletteItems[idx];
  if (!item) return;
  uiTick();
  buzz(10);
  closePalette();
  if (item.type === 'action'){
    switch(item.id){
      case 'radar': case 'quakes': case 'aircraft': case 'iss': case 'aurora': case 'grid':
        toggleLayer(item.id); break;
      case 'sound': toggleSound(); break;
      case 'theme': toggleTheme(); break;
      case 'share': shareLocation(); break;
      case 'jump': doRandomJump(); break;
      case 'poster': capturePoster(); break;
      case 'tour': startTour(); break;
      case 'now': goLiveTime(); break;
    }
  } else if (item.type === 'place'){
    hideHint();
    placeMarker(latLonToVec3(item.lat, item.lon, R));
    flyTo(item.lat, item.lon);
    if (item.fact) pendingFact = { icon:item.icon || '🧭', title:item.label, text:item.fact };
    fetchLocationData(item.lat, item.lon, item.name || item.label, null);
  }
}

paletteInput.addEventListener('keydown', e => {

    e.preventDefault();
    if (paletteItems.length){
      paletteHL = (paletteHL + 1) % paletteItems.length;
      $$('.palette-item', paletteList).forEach(el => el.classList.toggle('hl', parseInt(el.dataset.idx,10) === paletteHL));
      const hl = paletteList.querySelector('.palette-item.hl');
      if (hl) hl.scrollIntoView({ block:'nearest' });
    }
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    if (paletteItems.length){
      paletteHL = (paletteHL - 1 + paletteItems.length) % paletteItems.length;
      $$('.palette-item', paletteList).forEach(el => el.classList.toggle('hl', parseInt(el.dataset.idx,10) === paletteHL));
      const hl = paletteList.querySelector('.palette-item.hl');
      if (hl) hl.scrollIntoView({ block:'nearest' });
    }
  } else if (e.key === 'Enter'){
    if (paletteHL >= 0) executePaletteItem(paletteHL);
  } else if (e.key === 'Escape'){
    closePalette();
  }
});

function shareLocation(){
  const name = state.currentName || 'Earth Station';
  const lat = state.currentLat, lon = state.currentLon;
  const url = location.origin + location.pathname + (lat !== null ? '#@' + lat.toFixed(3) + ',' + lon.toFixed(3) : '');
  const text = lat !== null
    ? `${name} · ${fmtLatLonShort(lat, lon)}`
    : 'Earth Station — live planetary readout';
  if (navigator.share){
    navigator.share({ title:'Earth Station', text, url }).catch(() => {});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(url).then(() => toast('Link copied', 'ok', 1600)).catch(() => toast('Share unavailable', 'warn', 1800));
  } else {
    toast('Share not supported here', 'warn', 1800);
  }
}

   TIME MACHINE
   ============================================================================ */
const tmTime = $('#tmTime'), tmDay = $('#tmDay');
const tmTimeVal = $('#tmTimeVal'), tmDayVal = $('#tmDayVal');
const tmSub = $('#tmSub'), tmState = $('#tmState');
const tmPlay = $('#tmPlay'), tmNow = $('#tmNow');
const tt = state.timeTravel;

function timeTravelDate(){
  const d = new Date(Date.UTC(new Date().getUTCFullYear(), 0, 1, 0, 0, 0, 0));
  d.setUTCDate(tt.dayOfYear);
  d.setUTCMinutes(tt.minutes);
  return d;
}
function pushSun(){
  const d = timeTravelDate();
  const sub = getSubsolar(d);
  sunDir.copy(latLonToVec3(sub.lat, sub.lon, 1)).normalize();
  return { d, sub };
}
function syncTMReadouts(d, sub){
  const t = pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
  tmTimeVal.textContent = t;
  tmDayVal.textContent = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  tmSub.textContent = 'subsolar ' + fmtLatLonShort(sub.lat, sub.lon);
  const label = tt.active ? 'SIM' : 'LIVE';
  tmState.textContent = label;
  tmState.classList.toggle('sim', tt.active);
  tmNow.classList.toggle('armed', tt.active);
  $('#rdUtc').textContent = t + ' UTC' + (tt.active ? ' · SIM' : '');
}
function engageTT(){
  tt.active = true;
  const r = pushSun();
  syncTMReadouts(r.d, r.sub);
}
function goLiveTime(){
  tt.active = false;
  tt.playing = false;
  tmPlay.textContent = '▶';
  tmPlay.classList.remove('playing');
  const now = new Date();
  tt.minutes = now.getUTCHours()*60 + now.getUTCMinutes();
  tt.dayOfYear = dayOfYearUTC(now);
  tmTime.value = tt.minutes;
  tmDay.value = tt.dayOfYear;
  const r = pushSun();
  syncTMReadouts(r.d, r.sub);
  toast('Back to real time', 'ok', 1200);
}
tmTime.addEventListener('input', () => {
  tt.minutes = parseInt(tmTime.value, 10);
  tt.playing = false;
  tmPlay.textContent = '▶';
  tmPlay.classList.remove('playing');
  engageTT();
});
tmDay.addEventListener('input', () => {
  tt.dayOfYear = parseInt(tmDay.value, 10);
  engageTT();
});
tmNow.addEventListener('click', () => { uiTick(); buzz(12); goLiveTime(); });
tmPlay.addEventListener('click', () => {
  tt.playing = !tt.playing;
  tmPlay.textContent = tt.playing ? '⏸' : '▶';
  tmPlay.classList.toggle('playing', tt.playing);
  buzz(12);
  if (tt.playing){
    tt.active = true;
    uiTick();
    toast('Simulating day–night cycle', 'ok', 1600);
  } else {
    engageTT();
  }
});
setInterval(() => {
  if (tt.active || tt.playing) return;
  const now = new Date();
  const m = now.getUTCHours()*60 + now.getUTCMinutes();
  const dy = dayOfYearUTC(now);
  if (m !== tt.minutes){ tt.minutes = m; tmTime.value = m; }
  if (dy !== tt.dayOfYear){ tt.dayOfYear = dy; tmDay.value = dy; }
}, 5000);
goLiveTime();

function buildTickerItems(){
  const items = [];
  const now = new Date();
  items.push({ k:'UTC', v: pad2(now.getUTCHours()) + ':' + pad2(now.getUTCMinutes()) + ':' + pad2(now.getUTCSeconds()) });
  const sub = getSubsolar(now);
  items.push({ k:'Subsolar', v: fmtLatLonShort(sub.lat, sub.lon) });
  items.push({ k:'Kp', v: (state.kp || 0).toFixed(1) });
  if (state.currentName) items.push({ k:'Locked', v: state.currentName.slice(0, 40) });
  if (state.quakes.length){
    const latest = state.quakes[0];
    items.push({ k:'Last quake', v: 'M' + latest.mag.toFixed(1) + ' · ' + (latest.place||'').slice(0, 40) });
  }
  if (state.aircraft.length) items.push({ k:'Aircraft', v: state.aircraft.length + ' nearby' });
  if (state.iss){
    items.push({ k:'ISS', v: fmtLatLonShort(state.iss.latitude, state.iss.longitude) + ' · ' + Math.round(state.iss.altitude) + ' km' });
  }
  if (state.precipTotal) items.push({ k:'Precip', v: state.precipTotal.toFixed(1) + ' mm nowcast' });
  return items;
}
function updateTicker(){
  const items = buildTickerItems();
  const build = () => items.map(it => `<span class="tick"><span class="tick-k">${escapeHtml(it.k)}</span><span class="tick-v">${escapeHtml(it.v)}</span></span>`).join('<span class="tick-sep">·</span>');
  const html = build() + '<span class="tick-sep">·</span>' + build() + '<span class="tick-sep">·</span>';
  const track = $('#tickerTrack');
  track.innerHTML = html;
}
setInterval(updateTicker, 5000);
updateTicker();

const searchInput = $('#searchInput');
const searchPop = $('#searchPop');
let searchDebounce = null;
let searchResults = [];
let searchHL = -1;
function hideSearchPop(){ searchPop.classList.remove('on'); }
function showRecent(){
  if (!state.recent.length){ hideSearchPop(); return; }
  let html = '<div class="search-label">Recent</div><div class="search-chips">';
  state.recent.forEach((r, i) => {
    html += `<span class="search-chip" data-i="${i}">${escapeHtml(r.name)}</span>`;
  });
  html += '</div>';
  searchPop.innerHTML = html;
  searchPop.classList.add('on');
  $$('.search-chip', searchPop).forEach(el => {
    el.addEventListener('click', () => {
      const r = state.recent[parseInt(el.dataset.i, 10)];
      searchInput.value = r.name;
      hideSearchPop();
      searchInput.blur();
      selectPlace(r.lat, r.lon, r.name, null);
    });
  });
}
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  clearTimeout(searchDebounce);
  searchHL = -1;
  if (q.length < 2){ showRecent(); return; }
  searchDebounce = setTimeout(() => runSearch(q), 320);
});
searchInput.addEventListener('focus', () => {
  if (!searchInput.value.trim()) showRecent();
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ hideSearchPop(); searchInput.blur(); }
  else if (e.key === 'ArrowDown'){
    e.preventDefault();
    if (!searchResults.length) return;
    searchHL = (searchHL + 1) % searchResults.length;
    updateSearchHL();
  }
  else if (e.key === 'ArrowUp'){
    e.preventDefault();
    if (!searchResults.length) return;
    searchHL = (searchHL - 1 + searchResults.length) % searchResults.length;
    updateSearchHL();
  }
  else if (e.key === 'Enter'){
    if (searchHL >= 0 && searchResults[searchHL]){
      const r = searchResults[searchHL];
      selectPlace(r.latitude, r.longitude, r.name + ', ' + (r.admin1 || r.country || ''), {
        countryCode: r.country_code, countryName: r.country, adminRegion: r.admin1
      });
      hideSearchPop();
      searchInput.blur();
    }
  }
});
function updateSearchHL(){
  $$('.search-item', searchPop).forEach((el, i) => {
    el.classList.toggle('hl', i === searchHL);
  });
}
document.addEventListener('click', e => {
  if (!searchPop.contains(e.target) && e.target !== searchInput) hideSearchPop();
});
function runSearch(q){
  fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`)
    .then(r => r.json())
    .then(d => {
      searchResults = (d && d.results) || [];
      if (!searchResults.length){
        searchPop.innerHTML = '<div class="search-empty">No matches found.</div>';
        searchPop.classList.add('on');
        return;
      }
      let html = '';
      searchResults.forEach((r, i) => {
        const region = [r.admin1, r.country].filter(Boolean).join(', ');
        html += `<div class="search-item" data-i="${i}" style="animation-delay:${i * 0.02}s">
          <span class="search-item-name">${escapeHtml(r.name)}</span>
          <span class="search-item-region">${escapeHtml(region)}</span>
        </div>`;
      });
      searchPop.innerHTML = html;
      searchPop.classList.add('on');
      searchHL = -1;
      $$('.search-item', searchPop).forEach(el => {
        el.addEventListener('click', () => {
          const r = searchResults[parseInt(el.dataset.i, 10)];
          const name = r.name + ', ' + [r.admin1, r.country].filter(Boolean).join(', ');
          selectPlace(r.latitude, r.longitude, name, {
            countryCode: r.country_code, countryName: r.country, adminRegion: r.admin1
          });
          searchInput.value = r.name;
          hideSearchPop();
          searchInput.blur();
        });
      });
    })
    .catch(() => {
      searchPop.innerHTML = '<div class="search-empty">Search unavailable.</div>';
      searchPop.classList.add('on');
    });
}
function selectPlace(lat, lon, name, info){
  hideHint();

  placeMarker(latLonToVec3(lat, lon, R));

  fetchLocationData(lat, lon, name, info);
}

/* --- Swipe-down-to-dismiss sheet (mobile) --- */
(function sheetDrag(){
  const panel = $('#panel');
  const grab = $('#panelGrabber');
  if (!panel || !grab) return;
  let startY = 0, dy = 0, dragging = false;
  grab.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    dragging = true; startY = e.touches[0].clientY; dy = 0;
    panel.style.transition = 'none';
  }, { passive:true });
  grab.addEventListener('touchmove', e => {
    if (!dragging) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    panel.style.transform = 'translateY(' + dy + 'px)';
  }, { passive:true });
  grab.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';
    panel.style.transform = '';
    if (dy > 90) closePanel();
  }, { passive:true });
})();

function fetchLocationData(lat, lon, presetName, presetInfo){
  state.currentLat = lat;
  state.currentLon = lon;
  showPanelLoading();
  const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,cloud_cover,is_day' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,relative_humidity_2m,uv_index,visibility,dew_point_2m,wind_speed_10m,wind_direction_10m,cloud_cover,snowfall' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max,snowfall_sum,wind_speed_10m_max' +
    '&minutely_15=precipitation' +
    '&forecast_days=16&timezone=auto';
  const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}` +
    '&current=us_aqi,pm2_5,pm10,european_aqi,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto';
  const geoUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`;
  const elevUrl = `https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;

  const weatherP = fetch(weatherUrl).then(r => r.ok ? r.json() : null).catch(() => null);
  const aqiP = fetch(aqiUrl).then(r => r.ok ? r.json() : null).catch(() => null);
  const geoP = presetName ? Promise.resolve(null)
    : fetch(geoUrl).then(r => r.ok ? r.json() : null).catch(() => null);
  const elevP = fetch(elevUrl).then(r => r.ok ? r.json() : null).then(d => d && d.elevation ? d.elevation[0] : null).catch(() => null);

  Promise.all([weatherP, aqiP, geoP, elevP]).then(res => {
    const [weather, aqi, geo, elev] = res;
    if (!weather && !aqi && !presetName && !geo){
      $('#panelBody').innerHTML = `<div class="empty">Signal lost. Could not reach the weather network for this point.</div>`;
      toast('Weather network unreachable', 'err');
      return;
    }
    let name = presetName;
    let countryCode = presetInfo && presetInfo.countryCode;
    let countryName = presetInfo && presetInfo.countryName;
    let adminRegion = presetInfo && presetInfo.adminRegion;
    if (!name){
      if (geo){
        const city = geo.city || geo.locality;
        countryName = geo.countryName;
        countryCode = geo.countryCode;
        adminRegion = geo.principalSubdivision;
        if (city && countryName) name = city + ', ' + countryName;
        else if (countryName) name = countryName;
        else name = 'Open Ocean';
      } else {
        name = 'Unnamed Point';
      }
    }
    const loc = {
      name, lat, lon,
      cityQuery: (name || '').split(',')[0].trim(),
      countryCode: countryCode || null,
      countryName: countryName || null,
      adminRegion: adminRegion || null,
      timezone: weather ? weather.timezone : null,
      timezoneAbbr: weather ? weather.timezone_abbreviation : null,
      localTime: (weather && weather.current && weather.current.time) ? weather.current.time.replace('T',' ') : null,
      elevation: elev,
      weather, aqiCurrent: aqi ? aqi.current : null, aqiRaw: aqi
    };
    state.currentName = name;
    state.currentLoc = loc;
    renderPanel(loc);
    saveRecentEntry({ name, lat, lon });
    updateHash(lat, lon, name);
    updateTicker();
    updateWheelStats();
  });
}
function saveRecentEntry(entry){
  state.recent = state.recent.filter(x => !(Math.abs(x.lat - entry.lat) < 0.01 && Math.abs(x.lon - entry.lon) < 0.01));
  state.recent.unshift(entry);
  state.recent = state.recent.slice(0, 8);
  saveRecent();
}
function updateHash(lat, lon, name){
  const hash = '#@' + lat.toFixed(3) + ',' + lon.toFixed(3) + (name ? ',' + encodeURIComponent(name) : '');
  try { history.replaceState(null, '', hash); } catch(e){ location.hash = hash; }
}
function parseHash(){
  const h = location.hash;
  if (!h || h.indexOf('#@') !== 0) return null;
  const parts = h.slice(2).split(',');
  if (parts.length < 2) return null;
  const lat = parseFloat(parts[0]), lon = parseFloat(parts[1]);
  if (isNaN(lat) || isNaN(lon)) return null;
  let name = parts.slice(2).join(',') || null;
  try { name = name ? decodeURIComponent(name) : null; } catch(e){}
  return { lat, lon, name };
}

function isFav(lat, lon){
  return state.favorites.some(f => Math.abs(f.lat - lat) < 0.01 && Math.abs(f.lon - lon) < 0.01);
}
function toggleFav(name, lat, lon){
  const i = state.favorites.findIndex(f => Math.abs(f.lat - lat) < 0.01 && Math.abs(f.lon - lon) < 0.01);
  if (i >= 0){ state.favorites.splice(i, 1); saveFavs(); return false; }
  state.favorites.push({ name, lat, lon });
  saveFavs();
  return true;
}
function renderActiveTab(){
  const loc = state.currentLoc;
  if (!loc) return;
  const body = $('#panelBody');
  const key = loc.lat.toFixed(3) + ',' + loc.lon.toFixed(3);
  const cacheKey = key + ':' + activeTab;
  if (state.tabCache[cacheKey]){

    postRenderTab(activeTab, loc);
    return;
  }
  body.innerHTML = `<div class="p-loading"><div class="spinner sm"></div><div class="txt">Fetching ${activeTab}</div></div>`;
  switch(activeTab){
    case 'weather': renderWeatherTab(loc, cacheKey); break;
    case 'ocean':   renderOceanTab(loc, cacheKey); break;
    case 'city':    renderCityTab(loc, cacheKey); break;
    case 'places':  renderPlacesTab(loc, cacheKey); break;
    case 'food':    renderFoodTab(loc, cacheKey); break;
    case 'transport': renderTransportTab(loc, cacheKey); break;
    case 'more':    renderMoreTab(loc, cacheKey); break;

}

}

function renderWeatherTab(loc, cacheKey){
  const w = loc.weather;
  const body = $('#panelBody');
  if (!w){
    body.innerHTML = '<div class="empty">Weather data unavailable.</div>';
    return;
  }
  const cur = w.current;
  const hourly = w.hourly;
  const daily = w.daily;
  const minutely = w.minutely_15;

  html += '<div class="sec"><div class="sec-label">Next 2 Hours · Live Nowcast</div>';
  html += renderNowcast(minutely, cur && cur.time);
  html += '</div>';

  html += '<div class="sec"><div class="sec-label">Temperature Trend</div>';
  html += renderSparkline(hourly, cur && cur.time);
  html += '</div>';

  html += '<div class="sec"><div class="sec-label">Hourly · Next 48h</div>';
  html += renderHourly(hourly, cur && cur.time);
  html += '</div>';

  html += '</div>';

  const sunset = daily && daily.sunset ? daily.sunset[0] : null;

  html += '</div>';

  html += '<div class="sec"><div class="sec-label">Wind</div>';

    daily && daily.wind_speed_10m_max ? daily.wind_speed_10m_max[0] : null);
  html += '</div>';

  const uvNow = hourly && hourly.uv_index ? hourly.uv_index[0] : null;
  const visNow = hourly && hourly.visibility ? hourly.visibility[0] : null;
  const dewNow = hourly && hourly.dew_point_2m ? hourly.dew_point_2m[0] : null;
  const rainProb = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
  const snowToday = daily && daily.snowfall_sum ? daily.snowfall_sum[0] : null;
  html += '<div class="sec"><div class="sec-label">Conditions</div>';
  html += '<div class="grid2">';
  html += stat('Humidity', cur && cur.relative_humidity_2m != null ? Math.round(cur.relative_humidity_2m) + '%' : '—');
  html += stat('Wind', cur && cur.wind_speed_10m != null ? cur.wind_speed_10m.toFixed(1) + ' km/h ' + windDir(cur.wind_direction_10m) : '—');
  html += stat('Pressure', cur && cur.surface_pressure != null ? Math.round(cur.surface_pressure) + ' hPa' : '—');
  html += stat('Rain Chance', rainProb != null ? rainProb + '%' : '—');
  html += stat('UV Index', uvNow != null ? uvNow.toFixed(1) : '—');
  html += stat('Visibility', visNow != null ? (visNow/1000).toFixed(1) + ' km' : '—');
  html += stat('Cloud Cover', cur && cur.cloud_cover != null ? Math.round(cur.cloud_cover) + '%' : '—');
  html += stat('Dew Point', dewNow != null ? Math.round(state.unit === 'C' ? dewNow : cToF(dewNow)) + '°' + state.unit : '—');
  html += stat('Snowfall', snowToday != null ? snowToday.toFixed(1) + ' cm' : '0 cm');
  html += stat('Elevation', loc.elevation != null ? Math.round(loc.elevation) + ' m' : '—');
  html += '</div></div>';

  const moon = moonPhase(new Date());
  html += '<div class="sec"><div class="sec-label">Sun & Moon</div>';
  html += '<div class="sm-grid">';
  html += `<div class="sm-card"><div class="sm-i">🌅</div><div class="sm-l">Sunrise</div><div class="sm-v">${fmtTimeIso(sunrise)}</div></div>`;
  html += `<div class="sm-card"><div class="sm-i">🌇</div><div class="sm-l">Sunset</div><div class="sm-v">${fmtTimeIso(sunset)}</div></div>`;
  html += `<div class="sm-card"><div class="sm-i">${moon.icon}</div><div class="sm-l">Moon Phase</div><div class="sm-v">${moon.name}</div></div>`;
  html += `<div class="sm-card"><div class="sm-i">✨</div><div class="sm-l">Illumination</div><div class="sm-v">${moon.illum}%</div></div>`;
  html += '</div></div>';

  html += '<div class="sec"><div class="sec-label">Air Quality & Pollen</div>';
  const aqiData = loc.aqiCurrent;
  const aqiVal = aqiData && aqiData.us_aqi != null ? Math.round(aqiData.us_aqi) : null;
  if (aqiVal !== null){
    const cat = aqiCat(aqiVal);
    const pct = Math.min(100, (aqiVal / 300) * 100);
    html += `<div class="aqi">
      <div class="aqi-head"><span class="aqi-label">US AQI</span>
      <div><span class="aqi-val">${aqiVal}</span><span class="aqi-tag" style="color:${cat.color};border:1px solid ${cat.color}55;background:${cat.color}1a">${cat.label}</span></div></div>
      <div class="aqi-track"><div class="aqi-fill" style="width:${pct}%;background:${cat.color}"></div></div>
    </div>`;
    const extra = [];
    if (aqiData.pm2_5 != null) extra.push(stat('PM2.5', Math.round(aqiData.pm2_5) + ' µg/m³'));
    if (aqiData.pm10 != null) extra.push(stat('PM10', Math.round(aqiData.pm10) + ' µg/m³'));
    if (aqiData.european_aqi != null) extra.push(stat('EU AQI', Math.round(aqiData.european_aqi)));
    if (extra.length) html += `<div class="grid2" style="margin-top:12px">${extra.join('')}</div>`;
  } else {
    html += '<div class="empty">No air-quality station covers this point.</div>';
  }
  const pollenFields = [['alder_pollen','Alder'],['birch_pollen','Birch'],['grass_pollen','Grass'],['mugwort_pollen','Mugwort'],['olive_pollen','Olive'],['ragweed_pollen','Ragweed']];
  const pollenCards = [];
  pollenFields.forEach(p => {
    const v = aqiData ? aqiData[p[0]] : null;
    if (v != null) pollenCards.push(stat(p[1] + ' Pollen', Math.round(v) + ' gr/m³'));
  });
  if (pollenCards.length) html += `<div class="grid2" style="margin-top:12px">${pollenCards.join('')}</div>`;
  html += '</div>';

  body.innerHTML = html;
  if (minutely && minutely.precipitation){
    state.precipTotal = minutely.precipitation.slice(0, 8).reduce((a,b) => a + (b || 0), 0);
  }
  cacheIt(cacheKey, html);
}
function stat(label, value, accent){
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-v${accent ? ' accent' : ''}">${value}</div></div>`;
}
function renderNowcast(minutely, curIso){
  if (!minutely || !minutely.time || !minutely.time.length){
    return '<div class="empty">15-minute nowcast not available.</div>';
  }
  let start = curIso ? minutely.time.indexOf(curIso) : 0;
  if (start < 0){
    const ct = curIso ? new Date(curIso).getTime() : Date.now();
    let best = 0, bestD = Infinity;
    for (let i = 0; i < minutely.time.length; i++){
      const d = Math.abs(new Date(minutely.time[i]).getTime() - ct);
      if (d < bestD){ bestD = d; best = i; }
    }
    start = best;
  }
  const end = Math.min(start + 8, minutely.time.length);
  const vals = [];
  for (let i = start; i < end; i++){
    const v = minutely.precipitation ? minutely.precipitation[i] : 0;
    vals.push(v == null ? 0 : v);
  }
  if (!vals.length) return '<div class="empty">No nowcast data.</div>';
  const maxV = Math.max(...vals);
  const scale = maxV > 0 ? maxV : 1;
  const bars = vals.map(v => `<div class="nowcast-bar" style="height:${Math.max(4, (v/scale)*100)}%"></div>`).join('');
  const total = vals.reduce((a,b) => a + b, 0);
  const headline = total < 0.05 ? 'Dry for the next two hours'
    : maxV < 0.8 ? 'Light precipitation expected'
    : 'Meaningful precipitation expected';
  return `<div class="nowcast">
    <div class="nowcast-head"><div class="nowcast-title">${headline}</div><div class="nowcast-amount">${total.toFixed(1)} mm</div></div>
    <div class="nowcast-bars">${bars}</div>
    <div class="nowcast-legend"><span>now</span><span>+30m</span><span>+1h</span><span>+2h</span></div>
  </div>`;
}
function renderSparkline(hourly, curIso){
  if (!hourly || !hourly.time || !hourly.time.length) return '<div class="empty">Trend unavailable.</div>';
  let start = hourly.time.indexOf(curIso);
  if (start < 0) start = 0;
  const end = Math.min(start + 24, hourly.time.length);
  const temps = [], times = [];
  for (let i = start; i < end; i++){
    const t = hourly.temperature_2m ? hourly.temperature_2m[i] : null;
    if (t == null) continue;
    temps.push(state.unit === 'C' ? t : cToF(t));
    times.push(hourly.time[i]);
  }
  if (temps.length < 2) return '<div class="empty">Not enough data.</div>';
  const minT = Math.min(...temps), maxT = Math.max(...temps);
  const range = Math.max(1, maxT - minT);
  const W = 300, H = 80, pad = 8;
  const pts = temps.map((t, i) => [
    pad + (i/(temps.length-1))*(W-pad*2),
    H - pad - ((t - minT)/range)*(H-pad*2)
  ]);
  const line = 'M ' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ');
  const area = line + ` L ${pts[pts.length-1][0].toFixed(1)} ${H-pad} L ${pts[0][0].toFixed(1)} ${H-pad} Z`;
  const gid = 'g' + Math.random().toString(36).slice(2, 8);
  const peak = temps.indexOf(maxT), trough = temps.indexOf(minT);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5eead4';
  return `<div class="chart">
    <div class="chart-head"><div class="chart-title">Next 24h · ${state.unit === 'C' ? '°C' : '°F'}</div><div class="chart-peak">${Math.round(maxT)}° / ${Math.round(minT)}°</div></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${accent}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${pts[peak][0].toFixed(1)}" cy="${pts[peak][1].toFixed(1)}" r="3" fill="#f5a94e"/>
      <circle cx="${pts[trough][0].toFixed(1)}" cy="${pts[trough][1].toFixed(1)}" r="3" fill="#7dd3fc"/>
    </svg>
    <div class="chart-legend"><span>${fmtHourIso(times[0])}</span><span>${fmtHourIso(times[times.length-1])}</span></div>
  </div>`;
}
function renderHourly(hourly, curIso){
  if (!hourly || !hourly.time) return '<div class="empty">Hourly unavailable.</div>';
  let start = hourly.time.indexOf(curIso);
  if (start < 0) start = 0;
  const end = Math.min(start + 48, hourly.time.length);
  let html = '<div class="hourly">';
  for (let i = start; i < end; i++){
    const label = i === start ? 'Now' : fmtHourIso(hourly.time[i]);
    const wc = hourly.weather_code ? hourly.weather_code[i] : null;
    const info = WCODES[wc] || ['','🌡️'];
    const t = hourly.temperature_2m ? hourly.temperature_2m[i] : null;
    const temp = t == null ? '—' : Math.round(state.unit === 'C' ? t : cToF(t));
    const rain = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
    html += `<div class="hour-card${i === start ? ' now' : ''}">
      <div class="hour-t">${label}</div>
      <div class="hour-i">${info[1]}</div>
      <div class="hour-v">${temp}°</div>
      <div class="hour-r">${rain != null ? '💧' + rain + '%' : '&nbsp;'}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}
function renderDaily(daily){
  if (!daily || !daily.time) return '<div class="empty">Forecast unavailable.</div>';
  const minAll = Math.min(...daily.temperature_2m_min);
  const maxAll = Math.max(...daily.temperature_2m_max);
  const range = Math.max(1, maxAll - minAll);
  let html = '';
  for (let i = 0; i < daily.time.length; i++){
    const d = new Date(daily.time[i] + 'T12:00:00');
    const dayLabel = i === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday:'short', day:'numeric' });
    const wc = daily.weather_code ? daily.weather_code[i] : null;
    const info = WCODES[wc] || ['','🌡️'];
    const tmin = daily.temperature_2m_min[i], tmax = daily.temperature_2m_max[i];
    const tminD = Math.round(state.unit === 'C' ? tmin : cToF(tmin));
    const tmaxD = Math.round(state.unit === 'C' ? tmax : cToF(tmax));
    const leftPct = ((tmin - minAll) / range) * 100;
    const widthPct = Math.max(4, ((tmax - tmin) / range) * 100);
    const rain = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
    html += `<div class="daily-row">
      <div class="daily-day">${dayLabel}</div>
      <div class="daily-i">${info[1]}</div>
      <div class="daily-r">${rain != null ? '💧' + rain + '%' : ''}</div>
      <div class="daily-temps">
        <div class="daily-min">${tminD}°</div>
        <div class="daily-track"><div class="daily-fill" style="left:${leftPct}%;width:${widthPct}%"></div></div>
        <div class="daily-max">${tmaxD}°</div>
      </div>
    </div>`;
  }
  return html;
}
function renderSunArc(sunrise, sunset, nowIso){
  if (!sunrise || !sunset) return '<div class="empty">Sun path unavailable.</div>';
  const sr = new Date(sunrise).getTime(), ss = new Date(sunset).getTime();
  const now = nowIso ? new Date(nowIso).getTime() : Date.now();
  const t = clamp((now - sr) / Math.max(1, ss - sr), 0, 1);
  const theta = Math.PI * (1 - t);
  const cx = 150, cy = 72, rx = 140, ry = 62;
  const x = cx + rx * Math.cos(theta);
  const y = cy - ry * Math.sin(theta);
  const isDay = now >= sr && now <= ss;
  const col = isDay ? '#f5a94e' : '#7d8aa3';
  const op = isDay ? 1 : 0.5;
  return `<div class="sunarc-wrap">
    <svg viewBox="0 0 300 80" preserveAspectRatio="none">
      <defs><linearGradient id="arcgrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#5eead4" stop-opacity="0.4"/>
        <stop offset="50%" stop-color="#f5a94e" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#5eead4" stop-opacity="0.4"/>
      </linearGradient></defs>
      <path d="M 10 72 A 140 62 0 0 1 290 72" fill="none" stroke="url(#arcgrad)" stroke-width="1.5" stroke-dasharray="3 4"/>
      <path d="M 10 72 A 140 62 0 0 1 ${cx} 10" fill="none" stroke="${col}" stroke-width="2" opacity="${op}"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${col}" opacity="${op}"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="${col}" opacity="0.2"/>
      <line x1="10" y1="72" x2="290" y2="72" stroke="rgba(125,138,163,0.25)" stroke-width="1"/>
    </svg>
    <div class="sunarc-times">
      <span>Rise <strong>${fmtTimeIso(sunrise)}</strong></span>
      <span>${isDay ? 'Daytime' : 'Nighttime'}</span>
      <span>Set <strong>${fmtTimeIso(sunset)}</strong></span>
    </div>
  </div>`;
}
function renderCompass(speed, dir, gust){
  if (speed == null) return '<div class="empty">Wind data unavailable.</div>';
  dir = dir || 0;
  const cx = 37, cy = 37, r = 30;
  const a = (dir - 90) * Math.PI / 180;
  const ax = cx + r * Math.cos(a);
  const ay = cy + r * Math.sin(a);
  const tx = cx - 8 * Math.cos(a);
  const ty = cy - 8 * Math.sin(a);
  return `<div class="compass">
    <svg viewBox="0 0 74 74">
      <circle cx="37" cy="37" r="30" fill="none" stroke="rgba(125,138,163,0.25)" stroke-width="1"/>

function renderOceanTab(loc, cacheKey){
  const body = $('#panelBody');
  const lat = loc.lat, lon = loc.lon;
  Promise.all([
    fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,wave_direction,wave_period,swell_wave_height,sea_surface_temperature,ocean_current_velocity&hourly=wave_height,wave_period&forecast_days=2&timezone=auto`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`https://flood-api.open-meteo.com/v1/flood?latitude=${lat}&longitude=${lon}&daily=river_discharge&forecast_days=7`).then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([marine, flood]) => {
    let html = '';
    html += '<div class="sec"><div class="sec-label">Sea State</div>';
    if (marine && marine.current){
      const c = marine.current;
      html += '<div class="grid2">';
      html += stat('Wave Height', c.wave_height != null ? c.wave_height.toFixed(2) + ' m' : '—');
      html += stat('Wave Period', c.wave_period != null ? c.wave_period.toFixed(1) + ' s' : '—');
      html += stat('Wave Direction', c.wave_direction != null ? windDir(c.wave_direction) + ' · ' + Math.round(c.wave_direction) + '°' : '—');
      html += stat('Swell Height', c.swell_wave_height != null ? c.swell_wave_height.toFixed(2) + ' m' : '—');
      html += stat('SST', c.sea_surface_temperature != null ? c.sea_surface_temperature.toFixed(1) + '°C' : '—');
      html += stat('Current', c.ocean_current_velocity != null ? c.ocean_current_velocity.toFixed(2) + ' km/h' : '—');
      html += '</div>';
      if (marine.hourly && marine.hourly.wave_height){
        html += '<div style="margin-top:16px">' + renderSeries(marine.hourly.time, marine.hourly.wave_height, 24, 'm') + '</div>';
      }
    } else {
      html += '<div class="empty">No marine model covers this point — likely inland or far from a modelled sea grid cell.</div>';
    }
    html += '</div>';

    html += '<div class="sec"><div class="sec-label">River Discharge & Flood Risk</div>';
    if (flood && flood.daily && flood.daily.river_discharge){
      const rd = flood.daily.river_discharge;
      let latest = null;
      for (let i = rd.length - 1; i >= 0; i--){
        if (rd[i] != null){ latest = rd[i]; break; }
      }
      const max7 = Math.max(...rd.filter(v => v != null), 0);
      html += '<div class="grid2">';
      html += stat('Current Discharge', latest != null ? latest.toFixed(2) + ' m³/s' : '—');
      html += stat('7-Day Peak', max7 > 0 ? max7.toFixed(2) + ' m³/s' : '—');
      html += '</div>';
      html += '<div style="margin-top:16px">' + renderSeries(flood.daily.time, rd, 7, 'm³/s') + '</div>';
      html += '<div class="note" style="margin-top:12px">River discharge is modelled from GloFAS. Low values mean no large river at this exact point.</div>';
    } else {
      html += '<div class="empty">No modelled river at this coordinate.</div>';
    }
    html += '</div>';

    html += '<div class="sec"><div class="sec-label">Terrain</div>';
    html += `<div class="rows">
      <div class="row"><span class="row-l">Elevation</span><span class="row-v">${loc.elevation != null ? Math.round(loc.elevation) + ' m' : '—'}</span></div>
    </div></div>`;

    body.innerHTML = html;
    cacheIt(cacheKey, html);
  });
}
function renderSeries(times, values, count, unit){
  const pts = [], labels = [];
  for (let i = 0; i < Math.min(count, times.length); i++){
    const v = values[i];
    if (v == null) continue;
    pts.push(v);
    labels.push(times[i]);
  }
  if (pts.length < 2) return '<div class="empty">Not enough data.</div>';
  const minV = Math.min(...pts), maxV = Math.max(...pts);
  const range = Math.max(0.0001, maxV - minV);
  const W = 300, H = 80, pad = 8;
  const xy = pts.map((v, i) => [
    pad + (i/(pts.length-1))*(W-pad*2),
    H - pad - ((v - minV)/range)*(H-pad*2)
  ]);
  const line = 'M ' + xy.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ');
  const area = line + ` L ${xy[xy.length-1][0].toFixed(1)} ${H-pad} L ${xy[0][0].toFixed(1)} ${H-pad} Z`;
  const gid = 'g' + Math.random().toString(36).slice(2, 8);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5eead4';
  return `<div class="chart">
    <div class="chart-head"><div class="chart-title">${unit}</div><div class="chart-peak">${maxV.toFixed(2)} peak</div></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${accent}" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    <div class="chart-legend"><span>${(labels[0]||'').slice(5)}</span><span>${(labels[labels.length-1]||'').slice(5)}</span></div>
  </div>`;
}

function renderCityTab(loc, cacheKey){

  ]).then(([summary, wd, country]) => {
    const curCode = (country && country.currencies) ? Object.keys(country.currencies)[0] : null;
    const ratePromise = curCode && curCode !== 'USD'
      ? fetch(`https://api.frankfurter.app/latest?from=USD&to=${curCode}`).then(r => r.ok ? r.json() : null).then(d => d && d.rates ? d.rates[curCode] : null).catch(() => null)

    ratePromise.then(rate => {

      html += '<div class="sec"><div class="sec-label">City Snapshot</div>';
      const img = summary && (summary.originalimage || summary.thumbnail);
      html += '<div class="city-hero">';

        html += `<img src="${img.source}" alt="${escapeHtml((summary && summary.title) || cityQ)}" loading="lazy" onerror="this.style.display='none';this.parentNode.innerHTML='<div class=&quot;city-hero-fallback&quot;>🏙️</div>'">`;
      } else {
        html += '<div class="city-hero-fallback">🏙️</div>';
      }
      html += `<div class="city-hero-cap">${escapeHtml((summary && summary.title) || cityQ)}</div></div>`;
      if (summary && summary.extract){
        let ex = summary.extract;
        if (ex.length > 380) ex = ex.slice(0, 380).replace(/\s+\S*$/, '') + '…';
        html += `<div class="city-extract">${escapeHtml(ex)}</div>`;
      }
      html += '</div>';

      const population = wd ? wd.population : null;
      const areaKm2 = wd ? wd.areaKm2 : null;

      html += '<div class="sec"><div class="sec-label">Population & Geography</div>';

        html += `<div class="pop-card"><div><div class="pop-l">Population (Wikidata)</div><div class="pop-v">${fmtNum(population)}</div></div><div class="pop-i">👥</div></div>`;
      }

      html += row('Coordinates', fmtCoord(loc.lat, loc.lon));
      html += row('Time Zone', loc.timezone ? loc.timezone + (loc.timezoneAbbr ? ' (' + loc.timezoneAbbr + ')' : '') : '—');
      html += '</div></div>';

      html += '<div class="sec"><div class="sec-label">Country & Region</div>';

}
function row(label, value){
  return `<div class="row"><span class="row-l">${escapeHtml(label)}</span><span class="row-v">${escapeHtml(value)}</span></div>`;
}
async function getWikidata(query){
  try {
    const sr = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=en&format=json&origin=*&type=item&limit=1`);
    const sd = await sr.json();
    const id = sd && sd.search && sd.search[0] && sd.search[0].id;
    if (!id) return null;
    const cr = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=${id}&format=json&origin=*`);
    const cd = await cr.json();
    const claims = cd && cd.claims;
    if (!claims) return null;
    const num = (prop) => {
      const c = claims[prop];
      if (!c || !c.length) return null;
      const snak = c[c.length-1].mainsnak;
      const v = snak && snak.datavalue && snak.datavalue.value;
      return v && v.amount !== undefined ? parseFloat(String(v.amount).replace('+','')) : null;
    };
    return {
      population: num('P1082'),
      areaKm2: num('P2046'),
      elevationM: num('P2044')
    };
  } catch(e){ return null; }
}

function renderPlacesTab(loc, cacheKey){
  const body = $('#panelBody');
  const lat = loc.lat, lon = loc.lon;
  const q = `[out:json][timeout:25];(
    node["tourism"~"^(attraction|viewpoint|museum|theme_park|zoo|aquarium)$"](around:18000,${lat},${lon});
    node["leisure"~"^(park|garden)$"](around:10000,${lat},${lon});
    node["amenity"="place_of_worship"](around:9000,${lat},${lon});
    node["natural"="beach"](around:35000,${lat},${lon});
    node["natural"="peak"](around:45000,${lat},${lon});
    node["natural"="water"](around:15000,${lat},${lon});
    node["shop"="mall"](around:12000,${lat},${lon});
    node["amenity"="marketplace"](around:9000,${lat},${lon});
  );out center 200;`;
  Promise.all([
    fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q)).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}%7C${lon}&gsradius=10000&gslimit=20&format=json&origin=*`).then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([ov, wiki]) => {
    const buckets = {};
    const catMap = {
      'museum': ['Museums','🏛️'],
      'attraction': ['Attractions','📸'],
      'viewpoint': ['Attractions','🔭'],
      'theme_park': ['Theme Parks','🎢'],
      'zoo': ['Zoos','🦁'],
      'aquarium': ['Aquariums','🐠'],
      'park': ['Parks','🌳'],
      'garden': ['Gardens','🌷'],
      'beach': ['Beaches','🏖️'],
      'peak': ['Mountains','⛰️'],
      'water': ['Lakes','🏞️'],
      'mall': ['Malls','🛍️'],
      'marketplace': ['Markets','🧺']
    };
    function catFor(t){
      if (t.tourism && catMap[t.tourism]) return catMap[t.tourism];
      if (t.leisure && catMap[t.leisure]) return catMap[t.leisure];
      if (t.natural && catMap[t.natural]) return catMap[t.natural];
      if (t.shop === 'mall') return catMap['mall'];
      if (t.amenity === 'marketplace') return catMap['marketplace'];
      if (t.amenity === 'place_of_worship'){
        if (t.religion === 'christian') return ['Churches','⛪'];
        if (t.religion === 'muslim') return ['Mosques','🕌'];
        if (t.religion === 'hindu' || t.religion === 'buddhist') return ['Temples','🛕'];
        if (t.religion === 'jewish') return ['Synagogues','🕍'];
        return ['Worship','🙏'];
      }
      return null;
    }
    (ov && ov.elements || []).forEach(el => {
      const t = el.tags || {};
      if (!t.name) return;
      const cat = catFor(t);
      if (!cat) return;
      const la = el.lat !== undefined ? el.lat : (el.center && el.center.lat);
      const lo = el.lon !== undefined ? el.lon : (el.center && el.center.lon);
      if (la === undefined) return;
      const d = haversineKm(lat, lon, la, lo);
      (buckets[cat[0]] = buckets[cat[0]] || []).push({ name:t.name, dist:d, emoji:cat[1], type:el.type, id:el.id });
    });

    let html = '';
    const order = ['Attractions','Museums','Parks','Gardens','Beaches','Mountains','Lakes','Churches','Mosques','Temples','Zoos','Aquariums','Theme Parks','Malls','Markets','Worship'];
    let any = false;
    order.forEach(cat => {
      if (!buckets[cat] || !buckets[cat].length) return;
      any = true;
      const items = buckets[cat].sort((a,b) => a.dist - b.dist).slice(0, 5);
      html += `<div class="poi-group"><div class="poi-head">${cat}</div>`;
      items.forEach(p => {
        html += `<a class="poi" href="https://www.openstreetmap.org/${p.type}/${p.id}" target="_blank" rel="noopener noreferrer">
          <div class="poi-i">${p.emoji}</div>
          <div class="poi-info"><div class="poi-n">${escapeHtml(p.name)}</div><div class="poi-d">${fmtDist(p.dist)} away</div></div>
        </a>`;
      });
      html += '</div>';
    });
    if (!any) html = '<div class="empty">No points of interest found within the search radii.</div>';

    if (wiki && wiki.query && wiki.query.geosearch && wiki.query.geosearch.length){
      html += '<div class="poi-group"><div class="poi-head">Encyclopedic Landmarks Nearby</div>';
      wiki.query.geosearch.slice(0, 12).forEach(w => {
        html += `<a class="poi" href="https://en.wikipedia.org/?curid=${w.pageid}" target="_blank" rel="noopener noreferrer">
          <div class="poi-i">📖</div>
          <div class="poi-info"><div class="poi-n">${escapeHtml(w.title)}</div><div class="poi-d">${fmtDist(w.dist)} · Wikipedia</div></div>
        </a>`;
      });
      html += '</div>';
    }

    body.innerHTML = html;
    cacheIt(cacheKey, html);
  });
}

        fetch(`https://aviationweather.gov/api/data/metar?ids=${icao}&format=raw&hours=2`)
          .then(r => r.ok ? r.text() : null)
          .then(txt => {
            if (!txt) return;
            const line = txt.trim().split('\n')[0];
            if (!line || line.length < 8) return;
            const block = document.createElement('div');
            block.className = 'sec';
            block.innerHTML = `<div class="sec-label">Live METAR · ${icao}</div><div class="note" style="border-style:solid;color:var(--t1)">${escapeHtml(line)}</div>`;
            body.appendChild(block);
            cacheIt(cacheKey, body.innerHTML);
          }).catch(() => {});
      }
    });
}

/* ============================================================================
   MORE TAB
   ============================================================================ */
function renderMoreTab(loc, cacheKey){
  const body = $('#panelBody');
  const lat = loc.lat, lon = loc.lon;
  const endDate = new Date(); endDate.setDate(endDate.getDate() - 3);
  const startDate = new Date(endDate); startDate.setFullYear(startDate.getFullYear() - 3);
  const fmtD = d => d.toISOString().slice(0,10);

  Promise.all([
    fetch(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=${lat}&longitude=${lon}&maxradiuskm=300&minmagnitude=3&orderby=time&limit=5`).then(r => r.ok ? r.json() : null).catch(() => null),
    loc.countryCode ? fetch(`https://date.nager.at/api/v3/NextPublicHolidays/${loc.countryCode}`).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null),
    fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${fmtD(startDate)}&end_date=${fmtD(endDate)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`).then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([quakes, holidays, archive]) => {
    let html = '';

    const tips = computeTips(loc);
    if (tips.length){
      html += '<div class="sec"><div class="sec-label">Smart Tips</div>';
      tips.forEach(t => {
        html += `<div class="tip"><div class="tip-i">${t.icon}</div><div class="tip-t">${escapeHtml(t.text)}</div></div>`;
      });
      html += '</div>';
    }

    html += '<div class="sec"><div class="sec-label">Space Weather</div>';
    html += `<div class="sw-row">
      <div class="sw-card"><div class="sw-l">Kp Index</div><div class="sw-v">${state.kp.toFixed(1)}</div></div>
      <div class="sw-card"><div class="sw-l">Solar Wind</div><div class="sw-v">${state.windSpeed != null ? Math.round(state.windSpeed) + '<small> km/s</small>' : '—'}</div></div>
      <div class="sw-card"><div class="sw-l">Bz</div><div class="sw-v">${state.bz != null ? state.bz.toFixed(1) + '<small> nT</small>' : '—'}</div></div>
    </div>`;
    const auroraMsg = state.kp >= 5 ? 'Geomagnetic storm — aurora likely at high latitudes'
      : state.kp >= 4 ? 'Active conditions — aurora possible at high latitudes'
      : 'Quiet conditions — aurora unlikely';
    html += `<div class="note" style="margin-top:12px">${auroraMsg}.</div>`;
    html += '</div>';

    html += '<div class="sec"><div class="sec-label">International Space Station</div>';
    if (state.iss){
      html += `<div class="tx"><div class="tx-i">🛰</div>
        <div class="tx-info"><div class="tx-t">Live Position</div>
        <div class="tx-n">${fmtLatLonShort(state.iss.latitude, state.iss.longitude)}</div>
        <div class="poi-d" style="margin-top:4px">Alt ${Math.round(state.iss.altitude)} km · ${Math.round(state.iss.velocity)} km/h</div></div></div>`;
    } else {
      html += '<div class="empty">Enable the ISS layer to see live position.</div>';
    }
    html += '</div>';

    if (state.layers.aircraft.on){
      html += '<div class="sec"><div class="sec-label">Live Aircraft</div>';
      html += `<div class="note">${state.aircraft.length} aircraft plotted within ${FLIGHT_RADIUS} nm of this location.</div></div>`;
    }

    html += '<div class="sec"><div class="sec-label">Recent Nearby Earthquakes</div>';
    if (quakes && quakes.features && quakes.features.length){
      quakes.features.forEach(f => {
        const p = f.properties;
        const d = new Date(p.time);
        html += `<div class="quake">
          <div class="quake-m">M${p.mag.toFixed(1)}</div>
          <div class="quake-p">${escapeHtml(p.place)}</div>
          <div class="quake-t">${d.toLocaleDateString()} · ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
        </div>`;
      });
    } else {
      html += '<div class="empty">No M3+ earthquakes within 300 km in the last 30 days.</div>';
    }
    html += '</div>';

    html += '<div class="sec"><div class="sec-label">Upcoming Public Holidays</div>';
    if (holidays && holidays.length){
      holidays.slice(0, 4).forEach(h => {
        html += `<div class="row"><span class="row-l">${escapeHtml(h.name)}</span><span class="row-v dim">${h.date}</span></div>`;
      });
    } else {
      html += '<div class="empty">No holiday data available.</div>';
    }
    html += '</div>';

    html += '<div class="sec"><div class="sec-label">Historical Weather Extremes</div>';
    if (archive && archive.daily && archive.daily.time){
      let maxT = -Infinity, maxD = null, minT = Infinity, minD = null, total = 0;
      const byYear = {};
      for (let i = 0; i < archive.daily.time.length; i++){
        const tmax = archive.daily.temperature_2m_max[i];
        const tmin = archive.daily.temperature_2m_min[i];
        const p = archive.daily.precipitation_sum[i] || 0;
        if (tmax != null && tmax > maxT){ maxT = tmax; maxD = archive.daily.time[i]; }
        if (tmin != null && tmin < minT){ minT = tmin; minD = archive.daily.time[i]; }
        const y = archive.daily.time[i].slice(0, 4);
        byYear[y] = (byYear[y] || 0) + p;
        total += p;
      }
      const years = Object.keys(byYear);
      const best = years.reduce((a,b) => byYear[a] > byYear[b] ? a : b, years[0]);
      html += '<div class="rows">';
      html += row('Hottest Day', Math.round(state.unit === 'C' ? maxT : cToF(maxT)) + '°' + state.unit + ' · ' + maxD);
      html += row('Coldest Day', Math.round(state.unit === 'C' ? minT : cToF(minT)) + '°' + state.unit + ' · ' + minD);
      html += row('Rainiest Year', best + ' · ' + fmtNum(byYear[best]) + ' mm');
      html += row('Avg Annual Rain', fmtNum(total / years.length) + ' mm');
      html += '</div>';
    } else {
      html += '<div class="empty">Historical archive unavailable.</div>';
    }
    html += '</div>';

    html += '<div class="sec"><div class="sec-label">Favorites</div>';
    if (state.favorites.length){
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      state.favorites.forEach(f => {
        html += `<button class="search-chip fav-chip" data-lat="${f.lat}" data-lon="${f.lon}" data-name="${escapeHtml(f.name)}">${escapeHtml(f.name)}</button>`;
      });
      html += '</div>';
    } else {
      html += '<div class="empty">Tap ☆ next to a location name to save it here.</div>';
    }
    html += '</div>';

    body.innerHTML = html;
    cacheIt(cacheKey, html);
    postRenderTab('more', loc);
  });
}
function computeTips(loc){
  const tips = [];
  const w = loc.weather;
  const daily = w && w.daily;
  const cur = w && w.current;
  const rainProb = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
  if (rainProb != null && rainProb >= 40){
    tips.push({ icon:'☂️', text:`Rain probability is ${rainProb}% today — worth carrying an umbrella.` });
  }
  const uv = daily && daily.uv_index_max ? daily.uv_index_max[0] : null;
  if (uv != null && uv >= 6){
    tips.push({ icon:'🧴', text:`UV index peaks near ${uv.toFixed(1)} — sunscreen and shade help around midday.` });
  }
  const aqiVal = loc.aqiCurrent && loc.aqiCurrent.us_aqi;
  if (aqiVal != null && aqiVal > 100){
    tips.push({ icon:'😷', text:`Air quality is elevated (AQI ${Math.round(aqiVal)}) — sensitive groups should limit outdoor exertion.` });
  }
  const wind = cur && cur.wind_speed_10m;
  if (wind != null && wind >= 30){
    tips.push({ icon:'💨', text:`Winds around ${Math.round(wind)} km/h — secure loose items outdoors.` });
  }
  if (daily && daily.sunset && daily.sunset[0]){
    tips.push({ icon:'📷', text:`Golden hour is the hour before sunset (${fmtTimeIso(daily.sunset[0])}) — great light for photography.` });
  }
  if (!tips.length){
    tips.push({ icon:'✅', text:'Conditions look calm and clear — a good day to be outside.' });
  }
  return tips;
}

/* ============================================================================
   THEME / ACCENT
   ============================================================================ */
function syncThemeColor(){
  const meta = $('#themeColorMeta');
  if (!meta) return;
  meta.setAttribute('content', state.theme === 'light' ? '#e8eef7' : '#04060b');
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  if (window.__starPoints){
    window.__starPoints.material.opacity = state.theme === 'dark' ? 0.9 : 0.1;
  }
  try { localStorage.setItem('es_theme', state.theme); } catch(e){}
  syncThemeColor();
  uiTick();
  buzz(10);
  toast(state.theme === 'light' ? 'Day mode' : 'Night mode', 'ok', 1200);
}
$('#themeBtn').addEventListener('click', toggleTheme);
$$('.accent-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    const a = dot.dataset.accent;
    state.accent = a;
    document.documentElement.setAttribute('data-accent', a);
    $$('.accent-dot').forEach(d => d.classList.toggle('on', d.dataset.accent === a));
    try { localStorage.setItem('es_accent', a); } catch(e){}
    uiTick(ACCENT_NOTES[a]);
    buzz(8);
  });
});
$('#soundBtn').addEventListener('click', toggleSound);
syncThemeColor();

/* ============================================================================
   POSTER
   ============================================================================ */
function capturePoster(){
  const scale = IS_MOBILE ? 1.5 : 2;
  const prevPR = renderer.getPixelRatio();
  let dataUrl = null;
  try {
    renderer.setPixelRatio(scale);
    renderer.render(scene, camera);
    const src = renderer.domElement;
    const out = document.createElement('canvas');
    out.width = src.width; out.height = src.height;
    const ctx = out.getContext('2d');
    ctx.drawImage(src, 0, 0);
    const W = out.width, H = out.height;
    const barH = Math.round(Math.min(H * 0.14, 150 * scale));
    const grad = ctx.createLinearGradient(0, H - barH*1.7, 0, H);
    grad.addColorStop(0, 'rgba(4,6,11,0)');
    grad.addColorStop(1, 'rgba(4,6,11,0.94)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H - barH*1.7, W, barH*1.7);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5eead4';
    const pad = Math.round(30*scale);
    ctx.fillStyle = accent;
    ctx.fillRect(pad, H - barH + 16*scale, 48*scale, 2*scale);
    ctx.fillStyle = '#eef2fa';
    ctx.font = `700 ${Math.round(24*scale)}px "Instrument Serif", serif`;
    ctx.fillText('Earth Station', pad, H - barH + 52*scale);
    ctx.fillStyle = 'rgba(238,242,250,0.72)';
    ctx.font = `${Math.round(12*scale)}px "JetBrains Mono", monospace`;
    const label = state.currentName || 'Global view';
    ctx.fillText(label, pad, H - barH + 80*scale);
    const lat = state.currentLat, lon = state.currentLon;
    const coordTxt = (lat !== null && lon !== null) ? fmtLatLonShort(lat, lon) + '   ·   ' : '';
    const stamp = new Date().toISOString().replace('T',' ').slice(0,16) + ' UTC';
    ctx.fillText(coordTxt + stamp, pad, H - barH + 100*scale);
    dataUrl = out.toDataURL('image/png');
  } catch(e){ dataUrl = null; }
  finally {
    renderer.setPixelRatio(prevPR);
    renderer.render(scene, camera);
  }
  if (!dataUrl){ toast('Poster failed — try again', 'err', 2600); return; }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'earth-station-' + Date.now() + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Poster saved', 'ok', 2000);
}

/* ============================================================================
   TOUR
   ============================================================================ */
let tourState = null;
function startTour(){
  if (!state.favorites.length){
    toast('Add favorites first (tap ☆ in the panel)', 'warn', 3000);
    return;
  }
  tourState = { idx:0, startTime:0 };
  toast(`Cinematic tour · ${state.favorites.length} stops`, 'ok', 2400);
  nextTourStop();
}
function nextTourStop(){
  if (!tourState || tourState.idx >= state.favorites.length){
    tourState = null;
    toast('Tour complete', 'ok', 1800);
    return;
  }
  const f = state.favorites[tourState.idx];
  placeMarker(latLonToVec3(f.lat, f.lon, R));
  markerPing();
  flyTo(f.lat, f.lon, FOCUS_DIST * 0.82);
  fetchLocationData(f.lat, f.lon, f.name, null);
  tourState.idx++;
  setTimeout(nextTourStop, 8000);
}
$('#tourBtn').addEventListener('click', startTour);

/* ============================================================================
   KEYBOARD SHORTCUTS
   ============================================================================ */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey || e.altKey){
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      paletteOpen ? closePalette() : openPalette();
    }
    return;
  }
  if (e.key === '/'){ e.preventDefault(); searchInput.focus(); searchInput.select(); }
  else if (e.key === 'Escape'){
    if (paletteOpen) closePalette();
    else if (wheelOpen) closeWheel();
    else if (state.panelOpen) closePanel();
    else hideSearchPop();
  }
  else if (e.key === 'r' || e.key === 'R'){ state.autoRotate = !state.autoRotate; toast(state.autoRotate ? 'Rotation on' : 'Rotation paused', 'ok', 1000); }
  else if (e.key === 'g' || e.key === 'G') toggleLayer('grid');
  else if (e.key === 'p' || e.key === 'P') toggleLayer('radar');
  else if (e.key === 'i' || e.key === 'I') toggleLayer('iss');
  else if (e.key === 'f' || e.key === 'F') toggleLayer('aircraft');
  else if (e.key === 'q' || e.key === 'Q') toggleLayer('quakes');
  else if (e.key === 'j' || e.key === 'J') doRandomJump();
  else if (e.key === 't' || e.key === 'T') tmPlay.click();
  else if (e.key === 's' || e.key === 'S') toggleSound();
  else if (e.key === 'n' || e.key === 'N') toggleTheme();
});

/* ============================================================================
   LIVE READOUT
   ============================================================================ */
setInterval(() => {
  if (state.timeTravel.active) return;
  const now = new Date();
  $('#rdUtc').textContent = pad2(now.getUTCHours()) + ':' + pad2(now.getUTCMinutes()) + ' UTC';
  const sub = getSubsolar(now);
  if (!state.timeTravel.active){
    sunDir.copy(latLonToVec3(sub.lat, sub.lon, 1)).normalize();
  }
}, 1000);

/* ============================================================================
   INITIAL RENDER
   ============================================================================ */
renderLayerStack();
updateLayerUI();
updateWheelStats();
syncRailVar();
setTimeout(syncRailVar, 400);

/* Restore saved prefs */
try {
  const savedTheme = localStorage.getItem('es_theme');
  if (savedTheme === 'light'){
    state.theme = 'dark';
    toggleTheme();
  }
  const savedAccent = localStorage.getItem('es_accent');
  if (savedAccent && ACCENTS.includes(savedAccent)){
    state.accent = savedAccent;
    document.documentElement.setAttribute('data-accent', savedAccent);
    $$('.accent-dot').forEach(d => d.classList.toggle('on', d.dataset.accent === savedAccent));
  }
} catch(e){}

/* Auto-hide the hint on phones after a while */
if (IS_MOBILE){
  setTimeout(hideHint, 9000);
}

/* Expose for debugging */
window.ES = {
  state, scene, camera, renderer, earth, sunDir,
  latLonToVec3, flyTo, placeMarker, toast,
  toggleLayer, doRandomJump, capturePoster
};

})();
