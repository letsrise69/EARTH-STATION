  /* ======================================================================
     24 · WEATHER TAB
     ====================================================================== */
  function renderWeatherTab(container, weatherData, aqiData, loc) {
    if (!container) return;
    var current = weatherData ? weatherData.current : null;
    var hourly  = weatherData ? weatherData.hourly  : null;
    var daily   = weatherData ? weatherData.daily   : null;
    var minutely= weatherData ? weatherData.minutely_15 : null;

    var html = '';

    // ---- nowcast ----
    html += '<div class="section-title"><span>Next 2 Hours · Live Nowcast</span><span class="stitch"></span></div>';
    html += renderNowcast(minutely, current && current.time);

    // ---- trend ----
    html += '<div class="section-title"><span>Temperature Trend</span><span class="stitch"></span></div>';
    html += renderSparkline(hourly, current && current.time);

    // ---- hourly ----
    html += '<div class="section-title"><span>Hourly · Next 48h</span><span class="stitch"></span></div>';
    html += renderHourlyStrip(hourly, current && current.time);

    // ---- daily ----
    html += '<div class="section-title"><span>16-Day Forecast</span><span class="stitch"></span></div>';
    html += renderDailyList(daily);

    // ---- sun arc ----
    var sunrise = daily && daily.sunrise ? daily.sunrise[0] : null;
    var sunset  = daily && daily.sunset  ? daily.sunset[0]  : null;
    html += '<div class="section-title"><span>Sun Path</span><span class="stitch"></span></div>';
    html += renderSunArc(sunrise, sunset, current && current.time);

    // ---- wind ----
    var windSpeed = current ? current.wind_speed_10m : null;
    var windDir   = current ? current.wind_direction_10m : null;
    var windGust  = daily && daily.wind_speed_10m_max ? daily.wind_speed_10m_max[0] : null;
    html += '<div class="section-title"><span>Wind</span><span class="stitch"></span></div>';
    html += renderWindCompass(windSpeed, windDir, windGust);

    // ---- conditions ----
    var uvNow   = hourly && hourly.uv_index ? hourly.uv_index[0] : null;
    var visNow  = hourly && hourly.visibility ? hourly.visibility[0] : null;
    var dewNow  = hourly && hourly.dew_point_2m ? hourly.dew_point_2m[0] : null;
    var rainProbToday = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
    var snowToday = daily && daily.snowfall_sum ? daily.snowfall_sum[0] : null;
    var windDirTxt = current ? windCompass(current.wind_direction_10m) : '';

    html += '<div class="section-title"><span>Conditions</span><span class="stitch"></span></div>';
    html += '<div class="stat-grid">' +
      statCard('Humidity', (current && current.relative_humidity_2m !== undefined) ? Math.round(current.relative_humidity_2m) + '%' : '—') +
      statCard('Wind', (current && current.wind_speed_10m !== undefined) ? current.wind_speed_10m.toFixed(1) + ' km/h ' + windDirTxt : '—') +
      statCard('Pressure', (current && current.surface_pressure !== undefined) ? Math.round(current.surface_pressure) + ' hPa' : '—') +
      statCard('Rain Chance', (rainProbToday !== null && rainProbToday !== undefined) ? rainProbToday + '%' : '—') +
      statCard('UV Index', (uvNow !== null && uvNow !== undefined) ? uvNow.toFixed(1) : '—') +
      statCard('Visibility', (visNow !== null && visNow !== undefined) ? (visNow / 1000).toFixed(1) + ' km' : '—') +
      statCard('Cloud Cover', (current && current.cloud_cover !== undefined) ? Math.round(current.cloud_cover) + '%' : '—') +
      statCard('Dew Point', (dewNow !== null && dewNow !== undefined) ? Math.round(state.unit === 'C' ? dewNow : cToF(dewNow)) + '°' + state.unit : '—') +
      statCard('Snowfall', (snowToday !== null && snowToday !== undefined) ? snowToday.toFixed(1) + ' cm' : '0 cm') +
      statCard('Elevation', loc && loc.elevation !== undefined && loc.elevation !== null ? Math.round(loc.elevation) + ' m' : '—') +
      '</div>';

    // ---- sun & moon ----
    var moon = getMoonPhase(new Date());
    html += '<div class="section-title"><span>Sun &amp; Moon</span><span class="stitch"></span></div>';
    html += '<div class="sunmoon-grid">' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">🌅</div><div class="sunmoon-label">Sunrise</div><div class="sunmoon-value">' + formatTimeFromIso(sunrise) + '</div></div>' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">🌇</div><div class="sunmoon-label">Sunset</div><div class="sunmoon-value">' + formatTimeFromIso(sunset) + '</div></div>' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">' + moon.icon + '</div><div class="sunmoon-label">Moon Phase</div><div class="sunmoon-value">' + moon.name + '</div></div>' +
      '<div class="sunmoon-card"><div class="sunmoon-icon">✨</div><div class="sunmoon-label">Illumination</div><div class="sunmoon-value">' + moon.illumination + '%</div></div>' +
      '</div>';

    // ---- air quality ----
    var aqiValue = (aqiData && aqiData.us_aqi !== undefined && aqiData.us_aqi !== null) ? Math.round(aqiData.us_aqi) : null;
    html += '<div class="section-title"><span>Air Quality &amp; Pollen</span><span class="stitch"></span></div>';
    if (aqiValue !== null) {
      var cat = aqiCategory(aqiValue);
      var pct = Math.min(100, (aqiValue / 300) * 100);
      html += '<div class="aqi-block">' +
        '<div class="aqi-head"><span class="aqi-label">US AQI</span>' +
        '<div class="aqi-value-wrap"><span class="aqi-value">' + aqiValue + '</span>' +
        '<span class="aqi-tag" style="color:' + cat.color + ';border:1px solid ' + cat.color + '55;background:' + cat.color + '1a;">' + cat.label + '</span></div></div>' +
        '<div class="aqi-bar-track"><div class="aqi-bar-fill" style="width:' + pct + '%;background:' + cat.color + ';"></div></div></div>';

      var extra = '';
      if (aqiData.pm2_5 !== undefined && aqiData.pm2_5 !== null) extra += statCard('PM2.5', Math.round(aqiData.pm2_5) + ' µg/m³');
      if (aqiData.pm10 !== undefined && aqiData.pm10 !== null) extra += statCard('PM10', Math.round(aqiData.pm10) + ' µg/m³');
      if (aqiData.european_aqi !== undefined && aqiData.european_aqi !== null) extra += statCard('European AQI', Math.round(aqiData.european_aqi));
      if (extra) html += '<div class="stat-grid" style="margin-top:10px;">' + extra + '</div>';
    } else {
      html += '<div class="info-empty">No air-quality station covers this point.</div>';
    }

    var pollenFields = [
      ['alder_pollen','Alder'],['birch_pollen','Birch'],['grass_pollen','Grass'],
      ['mugwort_pollen','Mugwort'],['olive_pollen','Olive'],['ragweed_pollen','Ragweed']
    ];
    var pollenCards = '', hasPollen = false;
    pollenFields.forEach(function (p) {
      var v = aqiData ? aqiData[p[0]] : null;
      if (v !== null && v !== undefined) { hasPollen = true; pollenCards += statCard(p[1] + ' Pollen', Math.round(v) + ' gr/m³'); }
    });
    if (hasPollen) html += '<div class="stat-grid" style="margin-top:10px;">' + pollenCards + '</div>';

    // ---- storm context ----
    html += '<div class="section-title"><span>Storm Context</span><span class="stitch"></span></div>';
    html += '<div class="note-card">Switch on <strong>☂ precipitation radar</strong> in the top bar — the globe renders RainViewer\'s live global rain composite, mapped onto the planet in real time.</div>';

    container.innerHTML = html;
  }

  /* -------------------- nowcast -------------------- */
  function renderNowcast(minutely, currentTimeIso) {
    if (!minutely || !minutely.time || !minutely.time.length) {
      return '<div class="info-empty">15-minute nowcast not available for this point.</div>';
    }
    var startIdx = currentTimeIso ? minutely.time.indexOf(currentTimeIso) : 0;
    if (startIdx < 0) {
      // find closest
      var best = 0, bestD = Infinity;
      var ct = currentTimeIso ? new Date(currentTimeIso).getTime() : Date.now();
      for (var i = 0; i < minutely.time.length; i++) {
        var d = Math.abs(new Date(minutely.time[i]).getTime() - ct);
        if (d < bestD) { bestD = d; best = i; }
      }
      startIdx = best;
    }
    var end = Math.min(startIdx + 8, minutely.time.length);
    var vals = [];
    for (var j = startIdx; j < end; j++) {
      var v = minutely.precipitation ? minutely.precipitation[j] : 0;
      vals.push(v === null || v === undefined ? 0 : v);
    }
    if (!vals.length) return '<div class="info-empty">No nowcast data.</div>';
    var maxV = Math.max.apply(null, vals);
    var scale = maxV > 0 ? maxV : 1;
    var bars = '';
    vals.forEach(function (v) {
      var h = Math.max(2, (v / scale) * 100);
      bars += '<div class="nowcast-bar" style="height:' + h + '%"></div>';
    });
    var total = vals.reduce(function (a, b) { return a + b; }, 0);
    var headline = total < 0.05 ? 'Dry for the next two hours' :
      (maxV < 0.8 ? 'Light precipitation expected' : 'Meaningful precipitation expected');
    return '<div class="nowcast-wrap">' +
      '<div class="chart-title"><span>' + headline + '</span><strong>' + total.toFixed(1) + ' mm</strong></div>' +
      '<div class="nowcast-bars">' + bars + '</div>' +
      '<div class="nowcast-legend"><span>now</span><span>+30 min</span><span>+1h</span><span>+2h</span></div>' +
      '</div>';
  }

  /* -------------------- sparkline -------------------- */
  function renderSparkline(hourly, currentTimeIso) {
    if (!hourly || !hourly.time || !hourly.time.length) return '<div class="info-empty">Trend unavailable.</div>';
    var startIdx = hourly.time.indexOf(currentTimeIso);
    if (startIdx < 0) startIdx = 0;
    var end = Math.min(startIdx + 24, hourly.time.length);
    var temps = [], times = [];
    for (var i = startIdx; i < end; i++) {
      var t = hourly.temperature_2m ? hourly.temperature_2m[i] : null;
      if (t === null || t === undefined) continue;
      temps.push(state.unit === 'C' ? t : cToF(t));
      times.push(hourly.time[i]);
    }
    if (temps.length < 2) return '<div class="info-empty">Not enough data for a trend.</div>';

    var minT = Math.min.apply(null, temps);
    var maxT = Math.max.apply(null, temps);
    var range = Math.max(1, maxT - minT);
    var W = 300, H = 80, pad = 8;
    var pts = temps.map(function (t, i) {
      var x = pad + (i / (temps.length - 1)) * (W - pad * 2);
      var y = H - pad - ((t - minT) / range) * (H - pad * 2);
      return [x, y];
    });
    var pathLine = 'M ' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L ');
    var areaPath = pathLine + ' L ' + pts[pts.length-1][0].toFixed(1) + ' ' + (H - pad) +
                   ' L ' + pts[0][0].toFixed(1) + ' ' + (H - pad) + ' Z';
    var gid = 'grad' + Math.random().toString(36).slice(2, 8);
    var peakIdx = temps.indexOf(maxT);
    var troughIdx = temps.indexOf(minT);

    return '<div class="chart-wrap">' +
      '<div class="chart-title"><span>Next 24h · ' + (state.unit === 'C' ? '°C' : '°F') + '</span><strong>' +
      Math.round(maxT) + '° / ' + Math.round(minT) + '°</strong></div>' +
      '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + getAccent() + '" stop-opacity="0.35"/>' +
      '<stop offset="100%" stop-color="' + getAccent() + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + areaPath + '" fill="url(#' + gid + ')" />' +
      '<path d="' + pathLine + '" fill="none" stroke="' + getAccent() + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + pts[peakIdx][0].toFixed(1) + '" cy="' + pts[peakIdx][1].toFixed(1) + '" r="3" fill="#f5a94e"/>' +
      '<circle cx="' + pts[troughIdx][0].toFixed(1) + '" cy="' + pts[troughIdx][1].toFixed(1) + '" r="3" fill="#7dd3fc"/>' +
      '</svg>' +
      '<div class="chart-legend"><span>' + formatHourFromIso(times[0]) + '</span><span>' +
      formatHourFromIso(times[times.length-1]) + '</span></div>' +
      '</div>';
  }

  /* -------------------- sun arc -------------------- */
  function renderSunArc(sunriseIso, sunsetIso, nowIso) {
    if (!sunriseIso || !sunsetIso) return '<div class="info-empty">Sun path unavailable.</div>';
    var sr = new Date(sunriseIso).getTime();
    var ss = new Date(sunsetIso).getTime();
    var now = nowIso ? new Date(nowIso).getTime() : Date.now();
    var t = Math.max(0, Math.min(1, (now - sr) / Math.max(1, ss - sr)));
    var theta = Math.PI * (1 - t);
    var cx = 150, cy = 72, rx = 140, ry = 62;
    var x = cx + rx * Math.cos(theta);
    var y = cy - ry * Math.sin(theta);
    var isDay = now >= sr && now <= ss;
    var sunColor = isDay ? '#f5a94e' : '#7d8aa3';
    var op = isDay ? 1 : 0.5;

    return '<div class="sun-arc-wrap">' +
      '<svg class="sun-arc-svg" viewBox="0 0 300 80" preserveAspectRatio="none">' +
      '<defs><linearGradient id="arcgrad" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0%" stop-color="#5eead4" stop-opacity="0.4"/>' +
      '<stop offset="50%" stop-color="#f5a94e" stop-opacity="0.7"/>' +
      '<stop offset="100%" stop-color="#5eead4" stop-opacity="0.4"/>' +
      '</linearGradient></defs>' +
      '<path d="M 10 72 A 140 62 0 0 1 290 72" fill="none" stroke="url(#arcgrad)" stroke-width="1.5" stroke-dasharray="3 4"/>' +
      '<path d="M 10 72 A 140 62 0 0 1 ' + cx + ' 10" fill="none" stroke="' + sunColor + '" stroke-width="2" opacity="' + op + '"/>' +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4.5" fill="' + sunColor + '" opacity="' + op + '"/>' +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="8" fill="' + sunColor + '" opacity="0.2"/>' +
      '<line x1="10" y1="72" x2="290" y2="72" stroke="rgba(125,138,163,0.25)" stroke-width="1"/>' +
      '</svg>' +
      '<div class="sun-arc-times">' +
      '<span>Rise <strong>' + formatTimeFromIso(sunriseIso) + '</strong></span>' +
      '<span>' + (isDay ? 'Daytime' : 'Nighttime') + '</span>' +
      '<span>Set <strong>' + formatTimeFromIso(sunsetIso) + '</strong></span>' +
      '</div></div>';
  }

  /* -------------------- wind compass -------------------- */
  function renderWindCompass(speed, dirDeg, gust) {
    if (speed === null || speed === undefined) return '<div class="info-empty">Wind data unavailable.</div>';
    dirDeg = dirDeg || 0;
    var cx = 37, cy = 37, r = 30;
    var a = (dirDeg - 90) * Math.PI / 180;
    var ax = cx + r * Math.cos(a);
    var ay = cy + r * Math.sin(a);
    var tx = cx - 8 * Math.cos(a);
    var ty = cy - 8 * Math.sin(a);

    return '<div class="compass-wrap">' +
      '<svg class="compass-svg" viewBox="0 0 74 74">' +
      '<circle cx="37" cy="37" r="30" fill="none" stroke="rgba(125,138,163,0.25)" stroke-width="1"/>' +
      '<circle cx="37" cy="37" r="22" fill="none" stroke="rgba(125,138,163,0.12)" stroke-width="1"/>' +
      '<text x="37" y="10" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#7d8aa3">N</text>' +
      '<text x="69" y="40" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#7d8aa3">E</text>' +
      '<text x="37" y="71" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#7d8aa3">S</text>' +
      '<text x="6" y="40" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#7d8aa3">W</text>' +
      '<line x1="' + tx.toFixed(1) + '" y1="' + ty.toFixed(1) + '" x2="' + ax.toFixed(1) + '" y2="' + ay.toFixed(1) + '" stroke="#f5a94e" stroke-width="2" stroke-linecap="round"/>' +
      '<circle cx="' + ax.toFixed(1) + '" cy="' + ay.toFixed(1) + '" r="3" fill="#f5a94e"/>' +
      '<circle cx="37" cy="37" r="2.5" fill="#e8edf6"/>' +
      '</svg>' +
      '<div class="compass-info">' +
      '<div class="compass-value">' + speed.toFixed(1) + ' <span style="font-size:11px;color:var(--mist)">km/h</span></div>' +
      '<div class="compass-label">From ' + windCompass(dirDeg) + ' · ' + Math.round(dirDeg) + '°</div>' +
      (gust !== null && gust !== undefined ? '<div class="compass-gust">Gusts up to ' + gust.toFixed(1) + ' km/h</div>' : '') +
      '</div></div>';
  }

  /* -------------------- hourly strip -------------------- */
  function renderHourlyStrip(hourly, currentTimeIso) {
    if (!hourly || !hourly.time || !hourly.time.length) return '<div class="info-empty">Hourly data unavailable.</div>';
    var startIdx = hourly.time.indexOf(currentTimeIso);
    if (startIdx < 0) startIdx = 0;
    var end = Math.min(startIdx + 48, hourly.time.length);
    var items = '';
    for (var i = startIdx; i < end; i++) {
      var label = i === startIdx ? 'Now' : formatHourFromIso(hourly.time[i]);
      var wc = hourly.weather_code ? hourly.weather_code[i] : null;
      var info = WEATHER_CODES[wc] || ['', '🌡️'];
      var t = hourly.temperature_2m ? hourly.temperature_2m[i] : null;
      var temp = (t === null || t === undefined) ? '—' : Math.round(state.unit === 'C' ? t : cToF(t));
      var rain = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
      items += '<div class="hourly-item' + (i === startIdx ? ' is-now' : '') + '">' +
        '<div class="hourly-time">' + label + '</div>' +
        '<div class="hourly-icon">' + info[1] + '</div>' +
        '<div class="hourly-temp">' + temp + '°</div>' +
        '<div class="hourly-rain">' + (rain !== null && rain !== undefined ? '💧' + rain + '%' : '&nbsp;') + '</div>' +
        '</div>';
    }
    return '<div class="hourly-scroll">' + items + '</div>';
  }

  /* -------------------- daily list -------------------- */
  function renderDailyList(daily) {
    if (!daily || !daily.time || !daily.time.length) return '<div class="info-empty">Forecast unavailable.</div>';
    var minAll = Math.min.apply(null, daily.temperature_2m_min);
    var maxAll = Math.max.apply(null, daily.temperature_2m_max);
    var range = Math.max(1, maxAll - minAll);
    var html = '';
    for (var i = 0; i < daily.time.length; i++) {
      var d = new Date(daily.time[i] + 'T12:00:00');
      var dayLabel = i === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday:'short', day:'numeric' });
      var wc = daily.weather_code ? daily.weather_code[i] : null;
      var info = WEATHER_CODES[wc] || ['', '🌡️'];
      var tmin = daily.temperature_2m_min[i], tmax = daily.temperature_2m_max[i];
      var tminD = Math.round(state.unit === 'C' ? tmin : cToF(tmin));
      var tmaxD = Math.round(state.unit === 'C' ? tmax : cToF(tmax));
      var leftPct = ((tmin - minAll) / range) * 100;
      var widthPct = Math.max(4, ((tmax - tmin) / range) * 100);
      var rain = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
      html += '<div class="daily-row">' +
        '<div class="daily-day">' + dayLabel + '</div>' +
        '<div class="daily-icon">' + info[1] + '</div>' +
        '<div class="daily-rain">' + (rain !== null && rain !== undefined ? '💧' + rain + '%' : '') + '</div>' +
        '<div class="daily-temps">' +
        '<div class="daily-min">' + tminD + '°</div>' +
        '<div class="daily-bar-track"><div class="daily-bar-fill" style="left:' + leftPct + '%;width:' + widthPct + '%;"></div></div>' +
        '<div class="daily-max">' + tmaxD + '°</div>' +
        '</div></div>';
    }
    return html;
  }

  /* ======================================================================
     25 · OCEAN & RIVER TAB
     ====================================================================== */
  function loadOceanTab(container, loc, key) {
    Promise.all([
      getMarine(loc.lat, loc.lon),
      getFlood(loc.lat, loc.lon)
    ]).then(function (r) {
      renderOceanTab(container, loc, r[0], r[1]);
      cacheTab(key, 'ocean', container);
    });
  }

  function renderOceanTab(container, loc, marine, flood) {
    var html = '';

    html += '<div class="live-badge"><span class="pulse"></span>Open-Meteo Marine · live model</div>';
    html += '<div class="section-title"><span>Sea State</span><span class="stitch"></span></div>';

    if (marine && marine.current) {
      var c = marine.current;
      html += '<div class="stat-grid">' +
        statCard('Wave Height', c.wave_height !== undefined && c.wave_height !== null ? c.wave_height.toFixed(2) + ' m' : '—') +
        statCard('Wave Period', c.wave_period !== undefined && c.wave_period !== null ? c.wave_period.toFixed(1) + ' s' : '—') +
        statCard('Wave Direction', c.wave_direction !== undefined && c.wave_direction !== null ? windCompass(c.wave_direction) + ' · ' + Math.round(c.wave_direction) + '°' : '—') +
        statCard('Swell Height', c.swell_wave_height !== undefined && c.swell_wave_height !== null ? c.swell_wave_height.toFixed(2) + ' m' : '—') +
        statCard('Sea Surface Temp', c.sea_surface_temperature !== undefined && c.sea_surface_temperature !== null ? c.sea_surface_temperature.toFixed(1) + '°C' : '—') +
        statCard('Ocean Current', c.ocean_current_velocity !== undefined && c.ocean_current_velocity !== null ? c.ocean_current_velocity.toFixed(2) + ' km/h' : '—') +
        '</div>';

      if (marine.hourly && marine.hourly.time && marine.hourly.wave_height) {
        html += '<div class="section-title"><span>Wave Height · Next 24h</span><span class="stitch"></span></div>';
        html += renderSimpleSeries(marine.hourly.time, marine.hourly.wave_height, 24, 'm');
      }
    } else {
      html += '<div class="info-empty">No marine model covers this point — it is likely inland or far from a modelled sea grid cell.</div>';
    }

    html += '<div class="section-title"><span>River Discharge &amp; Flood Risk</span><span class="stitch"></span></div>';
    if (flood && flood.daily && flood.daily.time && flood.daily.river_discharge) {
      var latest = null;
      for (var i = flood.daily.river_discharge.length - 1; i >= 0; i--) {
        if (flood.daily.river_discharge[i] !== null && flood.daily.river_discharge[i] !== undefined) {
          latest = flood.daily.river_discharge[i];
          break;
        }
      }
      var max7 = 0;
      flood.daily.river_discharge.forEach(function (v) { if (v !== null && v !== undefined && v > max7) max7 = v; });
      html += '<div class="stat-grid">' +
        statCard('Current Discharge', latest !== null ? latest.toFixed(2) + ' m³/s' : '—') +
        statCard('7-Day Peak', max7 > 0 ? max7.toFixed(2) + ' m³/s' : '—') +
        '</div>';
      html += '<div class="section-title"><span>Discharge · 7 Days</span><span class="stitch"></span></div>';
      html += renderSimpleSeries(flood.daily.time, flood.daily.river_discharge, 7, 'm³/s');
      html += '<div class="note-card">River discharge is modelled from the GloFAS reanalysis/forecast. Low values simply mean no large river is modelled at this exact point.</div>';
    } else {
      html += '<div class="info-empty">No modelled river at this coordinate.</div>';
    }

    html += '<div class="section-title"><span>Terrain</span><span class="stitch"></span></div>';
    html += '<div class="data-list">' +
      dataRow('Elevation', loc.elevation !== undefined && loc.elevation !== null ? Math.round(loc.elevation) + ' m' : '—') +
      dataRow('Coast Distance', '<span style="color:var(--mist)">not derivable from a single point</span>') +
      '</div>';

    container.innerHTML = html;
  }

  function renderSimpleSeries(times, values, count, unit) {
    var pts = [], labels = [];
    for (var i = 0; i < Math.min(count, times.length); i++) {
      var v = values[i];
      if (v === null || v === undefined) continue;
      pts.push(v);
      labels.push(times[i]);
    }
    if (pts.length < 2) return '<div class="info-empty">Not enough data.</div>';

    var minV = Math.min.apply(null, pts);
    var maxV = Math.max.apply(null, pts);
    var range = Math.max(0.0001, maxV - minV);
    var W = 300, H = 80, pad = 8;
    var xy = pts.map(function (v, i) {
      return [
        pad + (i / (pts.length - 1)) * (W - pad * 2),
        H - pad - ((v - minV) / range) * (H - pad * 2)
      ];
    });
    var line = 'M ' + xy.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L ');
    var area = line + ' L ' + xy[xy.length-1][0].toFixed(1) + ' ' + (H - pad) +
               ' L ' + xy[0][0].toFixed(1) + ' ' + (H - pad) + ' Z';
    var gid = 'g' + Math.random().toString(36).slice(2, 8);

    return '<div class="chart-wrap">' +
      '<div class="chart-title"><span>' + unit + '</span><strong>' + maxV.toFixed(2) + ' peak</strong></div>' +
      '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + getAccent() + '" stop-opacity="0.35"/>' +
      '<stop offset="100%" stop-color="' + getAccent() + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
      '<path d="' + line + '" fill="none" stroke="' + getAccent() + '" stroke-width="1.8" stroke-linejoin="round"/>' +
      '</svg>' +
      '<div class="chart-legend"><span>' + (labels[0] || '').slice(5) + '</span><span>' + (labels[labels.length-1] || '').slice(5) + '</span></div>' +
      '</div>';
  }

  /* ======================================================================
     26 · CITY TAB
     ====================================================================== */
  function loadCityTab(container, loc, key) {
    var cityQuery = loc.cityQuery;
    Promise.all([
      getWikiSummary(cityQuery),
      getWikidataDetails(cityQuery),
      getCountryInfo(loc.countryCode)
    ]).then(function (results) {
      var summary = results[0], wd = results[1], country = results[2];
      var currencyCode = (country && country.currencies) ? Object.keys(country.currencies)[0] : null;
      getCurrencyRate(currencyCode).then(function (rate) {
        renderCityTab(container, cityQuery, loc, summary, wd, country, currencyCode, rate);
        cacheTab(key, 'city', container);
      });
    });
  }

  function renderCityTab(container, cityQuery, loc, summary, wd, country, currencyCode, rate) {
    var html = '';

    var img = summary && (summary.originalimage || summary.thumbnail);
    html += '<div class="section-title"><span>City Snapshot</span><span class="stitch"></span></div>';
    html += '<div class="city-hero">';
    if (img && img.source) {
      html += '<img src="' + img.source + '" alt="' + escapeHtml((summary && summary.title) || cityQuery) + '" loading="lazy" />';
    } else {
      html += '<div class="city-hero-fallback">🏙️</div>';
    }
    html += '<div class="city-hero-caption">' + escapeHtml((summary && summary.title) || cityQuery) + '</div></div>';

    if (summary && summary.extract) {
      var ex = summary.extract;
      if (ex.length > 360) ex = ex.slice(0, 360).replace(/\s+\S*$/, '') + '…';
      html += '<div class="city-extract">' + escapeHtml(ex) + '</div>';
    }
    if (wd && wd.nickname) {
      html += '<div class="note-card">Nicknamed <strong>' + escapeHtml(wd.nickname) + '</strong></div>';
    }

    var population = wd ? wd.population : null;
    var areaKm2 = wd ? wd.areaKm2 : null;
    var elevationM = wd ? wd.elevationM : null;
    var density = (population && areaKm2) ? (population / areaKm2) : null;

    html += '<div class="section-title"><span>Population &amp; Geography</span><span class="stitch"></span></div>';
    if (population) {
      html += '<div class="pop-card"><div><div class="pop-label">Population (Wikidata)</div><div class="pop-value">' +
        formatNumber(population) + '</div></div><div class="pop-icon">👥</div></div>';
    }
    html += '<div class="data-list" style="margin-top:10px;">' +
      dataRow('Area', areaKm2 ? formatNumber(areaKm2) + ' km²' : '—') +
      dataRow('Population Density', density ? formatNumber(density) + ' /km²' : '—') +
      dataRow('Elevation', (elevationM !== null && elevationM !== undefined) ? formatNumber(elevationM) + ' m' :
        (loc.elevation !== undefined && loc.elevation !== null ? Math.round(loc.elevation) + ' m' : '—')) +
      dataRow('Coordinates', formatCoord(loc.lat, loc.lon)) +
      dataRow('Time Zone', loc.timezone ? loc.timezone + (loc.timezoneAbbr ? ' (' + loc.timezoneAbbr + ')' : '') : '—') +
      dataRow('Local Time', loc.localTime || '—') +
      '</div>';

    html += '<div class="section-title"><span>Country &amp; Region</span><span class="stitch"></span></div>';
    html += '<div class="data-list">' +
      dataRow('Country', (country && country.name && country.name.common) ? escapeHtml(country.name.common) : (loc.countryName || '—')) +
      dataRow('State / Province', loc.adminRegion || '—') +
      dataRow('Capital', (country && country.capital) ? escapeHtml(country.capital[0]) : '—') +
      dataRow('Region', (country && country.region) ? escapeHtml(country.region + (country.subregion ? ' · ' + country.subregion : '')) : '—') +
      dataRow('Language(s)', (country && country.languages) ? escapeHtml(Object.values(country.languages).join(', ')) : '—') +
      dataRow('Currency', currencyCode ? escapeHtml(currencyCode) + (rate ? ' · 1 USD ≈ ' + rate.toFixed(2) + ' ' + currencyCode : '') : '—') +
      dataRow('Calling Code', (country && country.idd && country.idd.root) ? country.idd.root + (country.idd.suffixes ? country.idd.suffixes[0] : '') : '—') +
      dataRow('Drives On', (country && country.car && country.car.side) ? country.car.side : '—') +
      dataRow('Country Population', (country && country.population) ? formatNumber(country.population) : '—') +
      dataRow('Country Area', (country && country.area) ? formatNumber(country.area) + ' km²' : '—') +
      '</div>';

    html += '<div class="section-title"><span>History</span><span class="stitch"></span></div>';
    var founded = null;
    if (wd && wd.inceptionRaw) {
      var m = /^\+?(-?\d+)-/.exec(wd.inceptionRaw);
      if (m) founded = m[1];
    }
    html += '<div class="data-list">' +
      dataRow('Founded / Established', founded || '—') +
      dataRow('Founder', (wd && wd.founder) ? escapeHtml(wd.founder) : '—') +
      '</div>';

    if (summary && summary.content_urls && summary.content_urls.desktop && summary.content_urls.desktop.page) {
      html += '<a class="wiki-link" href="' + summary.content_urls.desktop.page + '" target="_blank" rel="noopener noreferrer">Read full article on Wikipedia →</a>';
    }

    container.innerHTML = html;
  }

  /* ======================================================================
     27 · DATA HELPERS
     ====================================================================== */
  function getWikiSummary(title) {
    if (!title) return Promise.resolve(null);
    var url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title);
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('nf'); return r.json(); })
      .catch(function () { return null; });
  }

  function resolveEntityLabel(qid) {
    var url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + qid +
      '&props=labels&languages=en&format=json&origin=*';
    return fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      var e = d && d.entities && d.entities[qid];
      return (e && e.labels && e.labels.en) ? e.labels.en.value : null;
    }).catch(function () { return null; });
  }

  function getWikidataDetails(query) {
    if (!query) return Promise.resolve(null);
    var searchUrl = 'https://www.wikidata.org/w/api.php?action=wbsearchentities&search=' +
      encodeURIComponent(query) + '&language=en&format=json&origin=*&type=item&limit=1';
    return fetch(searchUrl).then(function (r) { return r.json(); }).then(function (d) {
      var id = d && d.search && d.search[0] && d.search[0].id;
      if (!id) return null;
      var url = 'https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=' + id + '&format=json&origin=*';
      return fetch(url).then(function (r) { return r.json(); }).then(function (cd) {
        var claims = cd && cd.claims;
        if (!claims) return null;
        function num(prop) {
          var c = claims[prop];
          if (!c || !c.length) return null;
          var snak = c[c.length - 1].mainsnak;
          var v = snak && snak.datavalue && snak.datavalue.value;
          return (v && v.amount !== undefined) ? parseFloat(String(v.amount).replace('+', '')) : null;
        }
        function time(prop) {
          var c = claims[prop];
          if (!c || !c.length) return null;
          var snak = c[0].mainsnak;
          var v = snak && snak.datavalue && snak.datavalue.value;
          return (v && v.time) ? v.time : null;
        }
        function str(prop) {
          var c = claims[prop];
          if (!c || !c.length) return null;
          var v = c[0].mainsnak && c[0].mainsnak.datavalue && c[0].mainsnak.datavalue.value;
          return typeof v === 'string' ? v : null;
        }
        var result = {
          population: num('P1082'),
          areaKm2: num('P2046'),
          elevationM: num('P2044'),
          inceptionRaw: time('P571'),
          nickname: str('P1449'),
          founder: null
        };
        var fc = claims.P112 && claims.P112[0];
        var fv = fc && fc.mainsnak && fc.mainsnak.datavalue && fc.mainsnak.datavalue.value;
        var fid = fv && fv.id;
        if (fid) {
          return resolveEntityLabel(fid).then(function (label) { result.founder = label; return result; });
        }
        return result;
      });
    }).catch(function () { return null; });
  }

  function getCountryInfo(countryCode) {
    if (!countryCode) return Promise.resolve(null);
    var url = 'https://restcountries.com/v3.1/alpha/' + countryCode +
      '?fields=name,capital,region,subregion,languages,currencies,idd,population,area,cca2,car';
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  function getCurrencyRate(code) {
    if (!code) return Promise.resolve(null);
    if (code === 'USD') return Promise.resolve(1);
    var url = 'https://api.frankfurter.app/latest?from=USD&to=' + code;
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      return (d && d.rates && d.rates[code]) ? d.rates[code] : null;
    }).catch(function () { return null; });
  }

  function getMarine(lat, lon) {
    var url = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + lat + '&longitude=' + lon +
      '&current=wave_height,wave_direction,wave_period,swell_wave_height,sea_surface_temperature,ocean_current_velocity' +
      '&hourly=wave_height,wave_period&forecast_days=2&timezone=auto';
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  function getFlood(lat, lon) {
    var url = 'https://flood-api.open-meteo.com/v1/flood?latitude=' + lat + '&longitude=' + lon +
      '&daily=river_discharge&forecast_days=7';
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  function getElevation(lat, lon) {
    var url = 'https://api.open-meteo.com/v1/elevation?latitude=' + lat + '&longitude=' + lon;
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      return (d && d.elevation && d.elevation.length) ? d.elevation[0] : null;
    }).catch(function () { return null; });
  }

  function getNearbyWikipedia(lat, lon) {
    var url = 'https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=' +
      lat + '%7C' + lon + '&gsradius=10000&gslimit=40&format=json&origin=*';
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      return (d && d.query && d.query.geosearch) ? d.query.geosearch : [];
    }).catch(function () { return []; });
  }

  /* ======================================================================
     28 · PLACES TAB
     ====================================================================== */
  var PLACE_CATEGORY_ORDER = ['Tourist Attractions','Museums','Parks & Gardens','Zoos','Aquariums',
    'Adventure & Theme Parks','Churches','Mosques','Temples','Synagogues','Places of Worship',
    'Beaches','Mountains','Lakes','National Parks','Shopping Malls','Markets'];

  function overpassFetch(query) {
    var url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('ov'); return r.json(); })
      .then(function (d) { return (d && d.elements) || []; })
      .catch(function () { return []; });
  }

  function categorizePlaceElement(t) {
    if (t.tourism === 'museum') return { cat:'Museums', emoji:'🏛️' };
    if (t.tourism === 'attraction' || t.tourism === 'viewpoint') return { cat:'Tourist Attractions', emoji:'📸' };
    if (t.tourism === 'theme_park') return { cat:'Adventure & Theme Parks', emoji:'🎢' };
    if (t.leisure === 'park' || t.leisure === 'garden') return { cat:'Parks & Gardens', emoji:'🌳' };
    if (t.tourism === 'zoo') return { cat:'Zoos', emoji:'🦁' };
    if (t.tourism === 'aquarium') return { cat:'Aquariums', emoji:'🐠' };
    if (t.amenity === 'place_of_worship') {
      var r = t.religion;
      if (r === 'christian') return { cat:'Churches', emoji:'⛪' };
      if (r === 'muslim') return { cat:'Mosques', emoji:'🕌' };
      if (r === 'hindu' || r === 'buddhist') return { cat:'Temples', emoji:'🛕' };
      if (r === 'jewish') return { cat:'Synagogues', emoji:'🕍' };
      return { cat:'Places of Worship', emoji:'🙏' };
    }
    if (t.natural === 'beach') return { cat:'Beaches', emoji:'🏖️' };
    if (t.natural === 'peak') return { cat:'Mountains', emoji:'⛰️' };
    if (t.natural === 'water') return { cat:'Lakes', emoji:'🏞️' };
    if (t.boundary === 'national_park') return { cat:'National Parks', emoji:'🌲' };
    if (t.shop === 'mall') return { cat:'Shopping Malls', emoji:'🛍️' };
    if (t.amenity === 'marketplace') return { cat:'Markets', emoji:'🧺' };
    return null;
  }

  function loadPlacesTab(container, loc, key) {
    var q = '[out:json][timeout:25];(' +
      'node["tourism"~"^(attraction|viewpoint|theme_park|museum|zoo|aquarium)$"](around:18000,' + loc.lat + ',' + loc.lon + ');' +
      'node["leisure"~"^(park|garden)$"](around:10000,' + loc.lat + ',' + loc.lon + ');' +
      'node["amenity"="place_of_worship"](around:9000,' + loc.lat + ',' + loc.lon + ');' +
      'node["natural"="beach"](around:35000,' + loc.lat + ',' + loc.lon + ');' +
      'node["natural"="peak"](around:45000,' + loc.lat + ',' + loc.lon + ');' +
      'node["natural"="water"](around:15000,' + loc.lat + ',' + loc.lon + ');' +
      'way["boundary"="national_park"](around:70000,' + loc.lat + ',' + loc.lon + ');' +
      'node["shop"="mall"](around:12000,' + loc.lat + ',' + loc.lon + ');' +
      'node["amenity"="marketplace"](around:9000,' + loc.lat + ',' + loc.lon + ');' +
      ');out center 200;';

    Promise.all([overpassFetch(q), getNearbyWikipedia(loc.lat, loc.lon)]).then(function (res) {
      var elements = res[0], wiki = res[1];

      var buckets = {};
      elements.forEach(function (el) {
        var tags = el.tags || {};
        if (!tags.name) return;
        var info = categorizePlaceElement(tags);
        if (!info) return;
        var lat = el.lat !== undefined ? el.lat : (el.center && el.center.lat);
        var lon = el.lon !== undefined ? el.lon : (el.center && el.center.lon);
        if (lat === undefined || lon === undefined) return;
        var dist = haversineKm(loc.lat, loc.lon, lat, lon);
        if (!buckets[info.cat]) buckets[info.cat] = [];
        buckets[info.cat].push({ name:tags.name, dist:dist, emoji:info.emoji, id:el.id, type:el.type });
      });

      var html = '';
      var any = false;
      PLACE_CATEGORY_ORDER.forEach(function (cat) {
        if (!buckets[cat] || !buckets[cat].length) return;
        any = true;
        var items = buckets[cat].sort(function (a, b) { return a.dist - b.dist; }).slice(0, 5);
        html += '<div class="category-block"><div class="category-heading">' + cat + '</div><div class="poi-list">';
        items.forEach(function (p) {
          html += '<a class="poi-item" href="https://www.openstreetmap.org/' + p.type + '/' + p.id + '" target="_blank" rel="noopener noreferrer">' +
            '<div class="poi-thumb-fallback">' + p.emoji + '</div>' +
            '<div class="poi-info"><div class="poi-name">' + escapeHtml(p.name) + '</div>' +
            '<div class="poi-dist">' + formatDistance(p.dist) + ' away</div></div></a>';
        });
        html += '</div></div>';
      });

      if (!any) html = '<div class="info-empty">No categorized points of interest found within the search radii.</div>';

      // ---- Wikipedia geosearch landmarks (real, live) ----
      if (wiki.length) {
        html += '<div class="category-block"><div class="category-heading">Encyclopedic Landmarks Nearby</div><div class="poi-list">';
        wiki.slice(0, 12).forEach(function (w) {
          html += '<a class="poi-item" href="https://en.wikipedia.org/?curid=' + w.pageid + '" target="_blank" rel="noopener noreferrer">' +
            '<div class="poi-thumb-fallback">📖</div>' +
            '<div class="poi-info"><div class="poi-name">' + escapeHtml(w.title) + '</div>' +
            '<div class="poi-dist">' + formatDistance(w.dist) + ' away · Wikipedia</div></div></a>';
        });
        html += '</div></div>';
      }

      container.innerHTML = html;
      cacheTab(key, 'places', container);
    });
  }

  /* ======================================================================
     29 · FOOD & STAY TAB
     ====================================================================== */
  var FOOD_CATEGORY_ORDER = ['Restaurants','Cafes','Fast Food & Street Food','Hotels','Hostels & Guesthouses','Camping'];

  function categorizeFoodElement(t) {
    if (t.amenity === 'restaurant') return { cat:'Restaurants', emoji:'🍽️' };
    if (t.amenity === 'cafe') return { cat:'Cafes', emoji:'☕' };
    if (t.amenity === 'fast_food') return { cat:'Fast Food & Street Food', emoji:'🌭' };
    if (t.tourism === 'hotel') return { cat:'Hotels', emoji:'🏨' };
    if (t.tourism === 'hostel' || t.tourism === 'guest_house') return { cat:'Hostels & Guesthouses', emoji:'🛏️' };
    if (t.tourism === 'camp_site') return { cat:'Camping', emoji:'⛺' };
    return null;
  }

  function loadFoodTab(container, loc, key) {
    var q = '[out:json][timeout:25];(' +
      'node["amenity"~"^(restaurant|cafe|fast_food)$"](around:6000,' + loc.lat + ',' + loc.lon + ');' +
      'node["tourism"="hotel"](around:8000,' + loc.lat + ',' + loc.lon + ');' +
      'node["tourism"~"^(hostel|guest_house)$"](around:8000,' + loc.lat + ',' + loc.lon + ');' +
      'node["tourism"="camp_site"](around:25000,' + loc.lat + ',' + loc.lon + ');' +
      ');out center 200;';

    overpassFetch(q).then(function (elements) {
      var buckets = {};
      elements.forEach(function (el) {
        var tags = el.tags || {};
        if (!tags.name) return;
        var info = categorizeFoodElement(tags);
        if (!info) return;
        if (el.lat === undefined || el.lon === undefined) return;
        var dist = haversineKm(loc.lat, loc.lon, el.lat, el.lon);
        var label = tags.name + (tags.cuisine ? ' — ' + tags.cuisine.replace(/_/g, ' ') : '');
        var veg = tags['diet:vegetarian'] === 'yes' || tags['diet:vegan'] === 'yes';
        if (!buckets[info.cat]) buckets[info.cat] = [];
        buckets[info.cat].push({ name:label, dist:dist, emoji:info.emoji, id:el.id, veg:veg });
      });

      var html = '';
      var any = false;
      FOOD_CATEGORY_ORDER.forEach(function (cat) {
        if (!buckets[cat] || !buckets[cat].length) return;
        any = true;
        var items = buckets[cat].sort(function (a, b) { return a.dist - b.dist; }).slice(0, 6);
        html += '<div class="category-block"><div class="category-heading">' + cat + '</div><div class="poi-list">';
        items.forEach(function (p) {
          html += '<a class="poi-item" href="https://www.openstreetmap.org/node/' + p.id + '" target="_blank" rel="noopener noreferrer">' +
            '<div class="poi-thumb-fallback">' + p.emoji + '</div>' +
            '<div class="poi-info"><div class="poi-name">' + escapeHtml(p.name) + (p.veg ? ' 🌱' : '') + '</div>' +
            '<div class="poi-dist">' + formatDistance(p.dist) + ' away</div></div></a>';
        });
        html += '</div></div>';
      });

      if (!any) html = '<div class="info-empty">No restaurants or places to stay found nearby.</div>';
      html += '<div class="note-card">🌱 marks venues tagged vegetarian- or vegan-friendly on OpenStreetMap.</div>';

      container.innerHTML = html;
      cacheTab(key, 'food', container);
    });
  }

  /* ======================================================================
     30 · TRANSPORT TAB (+ live METAR at the nearest airport)
     ====================================================================== */
  function loadTransportTab(container, loc, key) {
    var lat = loc.lat, lon = loc.lon;
    var q = '[out:json][timeout:20];(' +
      'node["aeroway"="aerodrome"](around:60000,' + lat + ',' + lon + ');' +
      'node["railway"="station"](around:15000,' + lat + ',' + lon + ');' +
      'node["station"="subway"](around:14000,' + lat + ',' + lon + ');' +
      'node["amenity"="bus_station"](around:8000,' + lat + ',' + lon + ');' +
      'node["amenity"="taxi"](around:6000,' + lat + ',' + lon + ');' +
      'node["amenity"="bicycle_rental"](around:6000,' + lat + ',' + lon + ');' +
      'node["amenity"="charging_station"](around:9000,' + lat + ',' + lon + ');' +
      ');out center 150;';

    overpassFetch(q).then(function (elements) {
      function dist(el) { return haversineKm(lat, lon, el.lat, el.lon); }
      function sorted(pred) { return elements.filter(pred).sort(function (a, b) { return dist(a) - dist(b); }); }

      var airports = sorted(function (e) { return e.tags && e.tags.aeroway === 'aerodrome'; });
      var metro    = sorted(function (e) { return e.tags && e.tags.station === 'subway'; });
      var rail     = sorted(function (e) { return e.tags && e.tags.railway === 'station' && e.tags.station !== 'subway'; });
      var bus      = sorted(function (e) { return e.tags && e.tags.amenity === 'bus_station'; });
      var taxi     = sorted(function (e) { return e.tags && e.tags.amenity === 'taxi'; });
      var bike     = sorted(function (e) { return e.tags && e.tags.amenity === 'bicycle_rental'; });
      var ev       = sorted(function (e) { return e.tags && e.tags.amenity === 'charging_station'; });

      var rows = [
        { list:airports, type:'Nearest Airport', icon:'✈️' },
        { list:metro,    type:'Nearest Metro Station', icon:'🚇' },
        { list:rail,     type:'Nearest Railway Station', icon:'🚆' },
        { list:bus,      type:'Nearest Bus Station', icon:'🚌' },
        { list:taxi,     type:'Nearest Taxi Stand', icon:'🚕' },
        { list:bike,     type:'Nearest Bike Rental', icon:'🚲' },
        { list:ev,       type:'Nearest EV Charging', icon:'🔌' }
      ];

      var html = '<div class="section-title"><span>Getting Around</span><span class="stitch"></span></div><div class="transport-list">';
      var any = false;
      rows.forEach(function (r) {
        if (!r.list.length) return;
        any = true;
        var el = r.list[0];
        var name = (el.tags && el.tags.name) || r.type.replace('Nearest ', '');
        html += '<div class="transport-item"><div class="transport-icon">' + r.icon + '</div>' +
          '<div class="transport-info"><div class="transport-type">' + r.type + '</div>' +
          '<div class="transport-name">' + escapeHtml(name) + '</div></div>' +
          '<div class="transport-dist">' + formatDistance(dist(el)) + '</div></div>';
      });
      html += '</div>';
      if (!any) html = '<div class="info-empty">No transport hubs found nearby.</div>';

      // ---- METAR at the nearest airport (real live aviation weather) ----
      var icao = null;
      for (var i = 0; i < airports.length && i < 6; i++) {
        var t = airports[i].tags;
        if (t && t.icao && /^[A-Z0-9]{4}$/.test(t.icao)) { icao = t.icao; break; }
      }

      container.innerHTML = html;
      cacheTab(key, 'transport', container);

      if (icao) {
        var holder = document.createElement('div');
        getMetar(icao).then(function (metar) {
          if (!metar) return;
          var block = document.createElement('div');
          block.innerHTML = '<div class="section-title"><span>Live Aviation Weather · ' + icao + '</span><span class="stitch"></span></div>' +
            '<div class="note-card" style="font-size:11px;color:var(--ink);border-style:solid;">' + escapeHtml(metar) + '</div>';
          container.appendChild(block);
          cacheTab(key, 'transport', container);
        });
      }
    });
  }

  function getMetar(icao) {
    var url = 'https://aviationweather.gov/api/data/metar?ids=' + icao + '&format=raw&hours=2';
    return fetch(url).then(function (r) { return r.ok ? r.text() : null; })
      .then(function (txt) {
        if (!txt) return null;
        var line = txt.trim().split('\n')[0];
        return line && line.length > 8 ? line : null;
      })
      .catch(function () { return null; });
  }

  function loadMoreTab(container, loc, key) {
    Promise.all([
      getEarthquakes(loc.lat, loc.lon),
      getPublicHolidays(loc.countryCode),
      getHistoricalExtremes(loc.lat, loc.lon),
      getSpaceWeather()
    ]).then(function (results) {
      renderMoreTab(container, loc, results[0], results[1], results[2], results[3]);
      cacheTab(key, 'more', container);
      bindTabInteractions('more', container, loc);
    });
  }

        dataRow('Coldest Day', Math.round(state.unit === 'C' ? extremes.coldest.value : cToF(extremes.coldest.value)) + '°' + state.unit + ' · ' + extremes.coldest.date) +
        dataRow('Rainiest Year', extremes.rainiestYear.year + ' · ' + formatNumber(extremes.rainiestYear.total) + ' mm') +
        dataRow('Avg. Annual Rainfall', formatNumber(extremes.avgAnnualPrecip) + ' mm') +

  function kpToColor(kp) {
    if (kp >= 7) return '#f87171';
    if (kp >= 5) return '#fb923c';
    if (kp >= 4) return '#facc15';
    if (kp >= 3) return '#4ade80';
    return '#5eead4';
  }

  function computeSmartTips(weatherData, aqiData) {
    var tips = [];
    var current = weatherData && weatherData.current;
    var daily = weatherData && weatherData.daily;
    var rainProb = daily && daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
    if (rainProb !== null && rainProb !== undefined && rainProb >= 40) {
      tips.push({ icon:'☂️', text:'Rain probability is ' + rainProb + '% today — worth carrying an umbrella.' });
    }
    var uv = daily && daily.uv_index_max ? daily.uv_index_max[0] : null;
    if (uv !== null && uv !== undefined && uv >= 6) {
      tips.push({ icon:'🧴', text:'UV index peaks near ' + uv.toFixed(1) + ' — sunscreen and shade help around midday.' });
    }
    var aqiVal = aqiData && aqiData.us_aqi;
    if (aqiVal !== null && aqiVal !== undefined && aqiVal > 100) {
      tips.push({ icon:'😷', text:'Air quality is elevated (AQI ' + Math.round(aqiVal) + ') — sensitive groups should limit prolonged outdoor exertion.' });
    }
    var wind = current && current.wind_speed_10m;
    if (wind !== null && wind !== undefined && wind >= 30) {
      tips.push({ icon:'💨', text:'Winds around ' + Math.round(wind) + ' km/h — secure loose items outdoors.' });
    }
    if (daily && daily.sunset && daily.sunset[0]) {
      tips.push({ icon:'📷', text:'Golden hour falls in the hour before sunset (' + formatTimeFromIso(daily.sunset[0]) + ') — great light for photography.' });
    }
    if (!tips.length) tips.push({ icon:'✅', text:'Conditions look calm and clear — a good day to be outside.' });
    return tips;
  }

  function getEarthquakes(lat, lon) {
    var end = new Date();
    var start = new Date(end.getTime() - 30 * 86400000);
    var url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=' + lat +
      '&longitude=' + lon + '&maxradiuskm=300&minmagnitude=3&orderby=time&limit=5&starttime=' +
      start.toISOString().slice(0, 10);
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d || !d.features) return [];
      return d.features.map(function (f) {
        return { mag:f.properties.mag, place:f.properties.place, time:f.properties.time };
      });
    }).catch(function () { return []; });
  }

  function getPublicHolidays(countryCode) {
    if (!countryCode) return Promise.resolve([]);
    var url = 'https://date.nager.at/api/v3/NextPublicHolidays/' + countryCode;
    return fetch(url).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; });
  }

  function getHistoricalExtremes(lat, lon) {
    var endDate = new Date();
    endDate.setDate(endDate.getDate() - 3);
    var startDate = new Date(endDate);
    startDate.setFullYear(startDate.getFullYear() - 3);
    function fmt(d) { return d.toISOString().slice(0, 10); }
    var url = 'https://archive-api.open-meteo.com/v1/archive?latitude=' + lat + '&longitude=' + lon +
      '&start_date=' + fmt(startDate) + '&end_date=' + fmt(endDate) +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto';
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d || !d.daily || !d.daily.time || !d.daily.time.length) return null;
      var maxT = -Infinity, maxDate = null, minT = Infinity, minDate = null, total = 0;
      var byYear = {};
      for (var i = 0; i < d.daily.time.length; i++) {
        var tmax = d.daily.temperature_2m_max[i], tmin = d.daily.temperature_2m_min[i], p = d.daily.precipitation_sum[i] || 0;
        if (tmax !== null && tmax > maxT) { maxT = tmax; maxDate = d.daily.time[i]; }
        if (tmin !== null && tmin < minT) { minT = tmin; minDate = d.daily.time[i]; }
        var y = d.daily.time[i].slice(0, 4);
        byYear[y] = (byYear[y] || 0) + p;
        total += p;
      }
      var years = Object.keys(byYear);
      if (!years.length) return null;
      var best = years.reduce(function (a, b) { return byYear[a] > byYear[b] ? a : b; }, years[0]);
      return {
        hottest:{ value:maxT, date:maxDate },
        coldest:{ value:minT, date:minDate },
        rainiestYear:{ year:best, total:byYear[best] },
        avgAnnualPrecip: total / years.length,
        rangeStart: fmt(startDate),
        rangeEnd: fmt(endDate)
      };
    }).catch(function () { return null; });
  }

  function getSpaceWeather() {
    var kpUrl = 'https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json';
    var plasmaUrl = 'https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json';
    var magUrl = 'https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json';

    return Promise.all([
      fetch(kpUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      fetch(plasmaUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      fetch(magUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]).then(function (res) {
      var kpData = res[0], plasma = res[1], mag = res[2];
      var out = { kp:0, windSpeed:null, bz:null };
      if (kpData && kpData.length > 1) {
        var v = parseFloat(kpData[kpData.length - 1][1]);
        if (!isNaN(v)) out.kp = v;
      }
      if (plasma && plasma.length > 1) {
        var s = parseFloat(plasma[plasma.length - 1][2]);
        if (!isNaN(s)) out.windSpeed = s;
      }
      if (mag && mag.length > 1) {
        var b = parseFloat(mag[mag.length - 1][3]);
        if (!isNaN(b)) out.bz = b;
      }
      return out;
    }).catch(function () { return null; });
  }

  /* ======================================================================
     32 · MAIN LOCATION FETCH
     ====================================================================== */
  function fetchLocationData(lat, lon, presetName, presetInfo) {
    showPanelLoading();

    var weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,cloud_cover,is_day' +
      '&hourly=temperature_2m,precipitation_probability,weather_code,relative_humidity_2m,uv_index,visibility,dew_point_2m,wind_speed_10m,wind_direction_10m,cloud_cover,snowfall' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max,snowfall_sum,wind_speed_10m_max' +
      '&minutely_15=precipitation' +
      '&forecast_days=16&timezone=auto';

    var aqiUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon +
      '&current=us_aqi,pm2_5,pm10,european_aqi,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto';

    var geoUrl = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat +
      '&longitude=' + lon + '&localityLanguage=en';

    var weatherPromise = fetch(weatherUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    var aqiPromise = fetch(aqiUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    var geoPromise = presetName ? Promise.resolve(null)
      : fetch(geoUrl).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    var elevPromise = getElevation(lat, lon);

    Promise.all([weatherPromise, aqiPromise, geoPromise, elevPromise]).then(function (res) {
      var weatherData = res[0];
      var aqiData = res[1];
      var geoData = res[2];
      var elevation = res[3];

      if (!weatherData && !aqiData && !presetName && !geoData) {
        showPanelError(lat, lon);
        toast('Could not reach the weather network', 'err');
        return;
      }

      var name = presetName;
      var countryCode = presetInfo && presetInfo.countryCode;
      var countryName = presetInfo && presetInfo.countryName;
      var adminRegion = presetInfo && presetInfo.adminRegion;

      if (!name) {
        if (geoData) {
          var city = geoData.city || geoData.locality;
          countryName = geoData.countryName;
          countryCode = geoData.countryCode;
          adminRegion = geoData.principalSubdivision;
          if (city && countryName) name = city + ', ' + countryName;
          else if (countryName) name = countryName;
          else name = 'Open Ocean';
        } else {
          name = 'Unnamed Point';
        }
      }

      var loc = {
        name: name,
        lat: lat,
        lon: lon,
        cityQuery: name.split(',')[0].trim(),
        countryCode: countryCode || null,
        countryName: countryName || null,
        adminRegion: adminRegion || null,
        timezone: weatherData ? weatherData.timezone : null,
        timezoneAbbr: weatherData ? weatherData.timezone_abbreviation : null,
        localTime: (weatherData && weatherData.current && weatherData.current.time)
          ? weatherData.current.time.replace('T', ' ') : null,
        elevation: elevation
      };

      renderPanel(name, lat, lon, weatherData, aqiData ? aqiData.current : null, loc);
      saveRecentSearch({ name:name, lat:lat, lon:lon });
      updateHash(lat, lon, name);
    });
  }

  function showPanelError(lat, lon) {
    panelContentEl.innerHTML =
      '<div class="p-eyebrow"><span class="dot"></span>LOCATION LOCK</div>' +
      '<div class="p-title">' + formatCoord(lat, lon) + '</div>' +
      '<div class="p-error"><div class="p-error-text">Signal lost. Could not reach the weather<br/>network for this point. Try another spot.</div></div>';
    openPanel();
  }

  /* ======================================================================
     33 · SEARCH
     ====================================================================== */
  var searchInput = document.getElementById('searchInput');
  var searchResultsEl = document.getElementById('searchResults');
  var searchDebounce = null;
  var searchHighlightIdx = -1;

  searchInput.addEventListener('input', function () {
    var q = searchInput.value.trim();
    clearTimeout(searchDebounce);
    searchHighlightIdx = -1;
    if (q.length < 2) { renderRecentSearches(); return; }
    searchDebounce = setTimeout(function () { runSearch(q); }, 320);
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchResultsEl.classList.add('hidden');
      searchInput.blur();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault(); moveSearchHighlight(1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); moveSearchHighlight(-1);
    } else if (e.key === 'Enter') {
      var items = searchResultsEl.querySelectorAll('.search-result-item');
      var idx = searchHighlightIdx >= 0 ? searchHighlightIdx : (items.length ? 0 : -1);
      if (idx >= 0 && items[idx]) items[idx].click();
    }
  });

  document.addEventListener('click', function (e) {
    if (!searchResultsEl.contains(e.target) && e.target !== searchInput) {
      searchResultsEl.classList.add('hidden');
    }
  });

  function moveSearchHighlight(delta) {
    var items = searchResultsEl.querySelectorAll('.search-result-item');
    if (!items.length) return;
    searchHighlightIdx += delta;
    if (searchHighlightIdx < 0) searchHighlightIdx = items.length - 1;
    if (searchHighlightIdx >= items.length) searchHighlightIdx = 0;
    Array.prototype.forEach.call(items, function (it, i) {
      it.classList.toggle('highlighted', i === searchHighlightIdx);
    });
    items[searchHighlightIdx].scrollIntoView({ block:'nearest' });
  }

  function runSearch(query) {
    var url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(query) +
      '&count=6&language=en&format=json';
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      renderSearchResults((data && data.results) || []);
    }).catch(function () {
      searchResultsEl.innerHTML = '<div class="search-result-empty">Search unavailable right now.</div>';
      searchResultsEl.classList.remove('hidden');
    });
  }

  function renderSearchResults(results) {
    if (!results.length) {
      searchResultsEl.innerHTML = '<div class="search-result-empty">No matches found.</div>';
      searchResultsEl.classList.remove('hidden');
      return;
    }
    var html = '';
    results.forEach(function (r, i) {
      var region = [r.admin1, r.country].filter(Boolean).join(', ');
      html += '<div class="search-result-item" data-idx="' + i + '"><span>' + escapeHtml(r.name) +
        '</span><span class="sr-country">' + escapeHtml(region) + '</span></div>';
    });
    searchResultsEl.innerHTML = html;
    searchResultsEl.classList.remove('hidden');
    searchHighlightIdx = -1;

    Array.prototype.forEach.call(searchResultsEl.querySelectorAll('.search-result-item'), function (el) {
      el.addEventListener('click', function () {
        selectSearchResult(results[parseInt(el.getAttribute('data-idx'), 10)]);
      });
    });
  }

  function renderRecentSearches() {
    if (!state.recentSearches.length) { searchResultsEl.classList.add('hidden'); return; }
    var html = '<div class="search-section-label">Recent</div><div class="recent-chip-row">';
    state.recentSearches.forEach(function (r, i) {
      html += '<span class="recent-chip" data-idx="' + i + '">' + escapeHtml(r.name) + '</span>';
    });
    html += '</div>';
    searchResultsEl.innerHTML = html;
    searchResultsEl.classList.remove('hidden');

    Array.prototype.forEach.call(searchResultsEl.querySelectorAll('.recent-chip'), function (chip) {
      chip.addEventListener('click', function () {
        var r = state.recentSearches[parseInt(chip.getAttribute('data-idx'), 10)];
        searchInput.value = r.name;
        searchResultsEl.classList.add('hidden');
        hideHint();
        state.autoRotate = false;
        syncRotateBtn();
        var localPoint = latLonToVector3(r.lat, r.lon, EARTH_RADIUS);
        placeMarker(localPoint);
        flyTo(r.lat, r.lon);
        fetchLocationData(r.lat, r.lon, r.name, null);
      });
    });
  }

  searchInput.addEventListener('focus', function () {
    if (!searchInput.value.trim()) renderRecentSearches();
  });

  function selectSearchResult(r) {
    searchResultsEl.classList.add('hidden');
    searchInput.value = r.name;
    hideHint();

    // Stop the globe spinning so the searched spot stays put
    state.autoRotate = false;
    syncRotateBtn();

    var localPoint = latLonToVector3(r.latitude, r.longitude, EARTH_RADIUS);
    placeMarker(localPoint);
    flyTo(r.latitude, r.longitude);

    var region = [r.admin1, r.country].filter(Boolean).join(', ');
    var name = region ? r.name + ', ' + region : r.name;
    var presetInfo = {
      countryCode: r.country_code || null,
      countryName: r.country || null,
      adminRegion: r.admin1 || null
    };
    fetchLocationData(r.latitude, r.longitude, name, presetInfo);
  }

  /* ======================================================================
     34 · KEYBOARD SHORTCUTS
     ====================================================================== */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.key === '/') {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    } else if (e.key === 'Escape') {
      if (state.panelOpen) closePanel();
      else searchResultsEl.classList.add('hidden');
    } else if (e.key === 'r' || e.key === 'R') {
      state.autoRotate = !state.autoRotate; syncRotateBtn();
    } else if (e.key === 'g' || e.key === 'G') {
      gridToggleBtn.click();
    } else if (e.key === 'p' || e.key === 'P') {
      precipToggleBtn.click();
    } else if (e.key === 'i' || e.key === 'I') {
      issToggleBtn.click();
    } else if (e.key === 'f' || e.key === 'F') {
      flightToggleBtn.click();
    } else if (e.key === 's' || e.key === 'S') {
      toggleSoundscape();
    } else if (e.key === 'n' || e.key === 'N') {
      themeToggleBtn.click();
    }
  });

  /* ======================================================================
     35 · COORDINATE + SUBSOLAR READOUT
     ====================================================================== */
  var lastSunUpdate = 0;
  setInterval(function () {
    var now = new Date();
    var utcEl = document.getElementById('crUtc');
    var subEl = document.getElementById('crSub');
    if (utcEl) {
      utcEl.textContent =
        String(now.getUTCHours()).padStart(2, '0') + ':' +
        String(now.getUTCMinutes()).padStart(2, '0') + ' UTC';
    }
    var sub = getSubsolarPoint(now);
    if (subEl) {
      subEl.textContent = 'subsolar ' + Math.abs(sub.lat).toFixed(1) + '°' + (sub.lat >= 0 ? 'N' : 'S') +
        ', ' + Math.abs(sub.lon).toFixed(1) + '°' + (sub.lon >= 0 ? 'E' : 'W');
    }
    // refresh terminator every 60 s
    if (Date.now() - lastSunUpdate > 60000) {
      lastSunUpdate = Date.now();
      sunDirection.copy(latLonToVector3(sub.lat, sub.lon, 1)).normalize();
    }
  }, 1000);

  /* ======================================================================
     36 · BOOT
     ====================================================================== */
  function boot() {
    var initial = parseHash();
    if (initial) {
      hideHint();
      setTimeout(function () {
        var localPoint = latLonToVector3(initial.lat, initial.lon, EARTH_RADIUS);
        placeMarker(localPoint);
        state.autoRotate = false;
        syncRotateBtn();
        flyTo(initial.lat, initial.lon);
        fetchLocationData(initial.lat, initial.lon, initial.name, null);
      }, 700);
    }
  }
  boot();

})();
</script>
</body>
</html>
